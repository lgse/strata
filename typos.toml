[files]
extend-exclude = [
  "data/fonts/**",
  "data/icons/**",
  "data/licenses/**",
  "Cargo.lock",
  # English is checked in en.json; English dictionaries cannot check translations.
  "data/locales/**/de.json",
  "data/locales/**/es.json",
  "data/locales/**/fr.json",
  "data/locales/**/hu.json",
  "data/locales/**/it.json",
  "data/locales/**/ja.json",
  "data/locales/**/ko.json",
  "data/locales/**/pt-BR.json",
  "data/locales/**/ru.json",
  "data/locales/**/vi.json",
  "data/locales/**/zh-CN.json",
  "data/locales/**/zh-TW.json",
  # Provider translations; the English messages are checked in provider.py.
  "integrations/kdeconnect/messages.json",
  "integrations/localsend/messages.json",
  # Reproducible upstream MathJax bundle and npm dependency lock.
  "data/math-renderer.js",
  "packaging/math-renderer/package-lock.json",
]

[default]
extend-ignore-re = [
  "`crypted\\.rar`",
  # Deliberately misspelled input in the Settings closest-match regression.
  '"relase chanel"',
  # French caption exercised by the restart-to-apply regression.
  '"Redémarrer maintenant"',
  # German F1 row exercised by the localized shortcut reference regression.
  '"Ausgewählte Elemente kopieren / ausschneiden"',
  # Non-English values in the multilingual count and calendar catalogs.
  '(?m)^\s*"(?:fr|hu|de|es|ja|pt-BR|ko|vi|it|ru|zh-CN|zh-TW)": ".*"',
  # Non-English installer messages generated from data/locales/installer.json.
  '(?s)\n  (?:fr|hu|de|es|ja|pt-BR|ko|vi|it|ru|zh-CN|zh-TW)\) INSTALLER_MESSAGES=\(.*?\n  \) ;;',
  # Localized desktop-entry values.
  '(?m)^\w+\[(?:fr|hu|de|es|ja|pt_BR|ko|vi|it|ru|zh_CN|zh_TW)\]=.*$',
  # "café" fixtures spelled as raw, escaped or percent-encoded bytes, and the name they fix to.
  'caf(\\x[0-9a-fA-F]{2}|\\u\{[0-9a-fA-F]+\}|%[0-9A-Fa-f]{2}|_\.txt)',
]

[default.extend-words]
# RTF control words, spelled as the format defines them.
pard = "pard"
headerr = "headerr"
falt = "falt"
# OpenDocument (ODF) and its XSL-FO attribute namespace.
ODF = "ODF"
fo = "fo"
FO = "FO"
Omarchy = "Omarchy"
Hyprland = "Hyprland"
JetBrains = "JetBrains"
Darcula = "Darcula"
darcula = "darcula"
Strata = "Strata"
WRONLY = "WRONLY"
gir = "gir"
exportfs = "exportfs"
# Verbatim file extensions.
mak = "mak"
edn = "edn"
ags = "ags"
tese = "tese"
# The `--qa` reply field for captured GLib warnings and criticals.
criticals = "criticals"
