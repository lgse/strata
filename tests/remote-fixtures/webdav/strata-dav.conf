<IfModule !dav_module>
LoadModule dav_module modules/mod_dav.so
</IfModule>
<IfModule !dav_fs_module>
LoadModule dav_fs_module modules/mod_dav_fs.so
</IfModule>
<IfModule !ssl_module>
LoadModule ssl_module modules/mod_ssl.so
</IfModule>
<IfModule !socache_shmcb_module>
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
</IfModule>
ServerName strata-fixture
ErrorLog /dev/stderr
DavLockDB /var/lib/dav/lockdb
Listen 443
Alias /dav /srv/dav/files
<Directory /srv/dav/files>
  Dav On
  Options Indexes
  AuthType Basic
  AuthName "Strata fixture"
  AuthUserFile /etc/apache2/dav.passwd
  Require valid-user
</Directory>
<VirtualHost *:443>
  SSLEngine on
  SSLCertificateFile /etc/ssl/apache2/fixture.crt
  SSLCertificateKeyFile /etc/ssl/apache2/fixture.key
</VirtualHost>
