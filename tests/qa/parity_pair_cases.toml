name = "a label with a key it does not have"
refused = "note"

[[case.edit]]
header = "keys/moves-rune"
find = '''"twin":"moves",'''
put = '''"twin":"moves","note":"x",'''

[[case]]
name = "a label with no reference"
refused = "ref"

[[case.edit]]
header = "keys/moves"
find = ''',"ref":"lgse/strata#2200"'''
put = ''''''

[[case]]
