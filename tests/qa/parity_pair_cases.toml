exception = "a11y"
twin = "renames-rune/list-ru"
ref = "lgse/strata#2201"
'''

# A twin's steps against its original's, in each run it holds.

[[case]]
name = "a twin with no step"
problem = '''scenarios/keys/moves-rune.jsonl has no step in columns: a twin reaches its original's result by steps of its own'''

[[case.edit]]
header = "keys/moves-rune"
text = '''
{"scenario":"moves-rune","modes":["columns"],"targets":["rune"],"prefs":{"type_to_search":false},"tree":"canonical","parity":{"twin":"moves","exception":"timing","ref":"lgse/strata#2200","differs":"line 4 waits for the selection, where the original expects it at once"}}
'''

[[case]]
name = "a twin whose steps are its original's but for a message and a timeout"
problem = '''scenarios/keys/moves-rune.jsonl runs columns by its original's steps, so nothing differs: a run the shared file passes on Rune is required and has no twin'''

[[case.edit]]
header = "keys/moves-rune"
find = '''{"wait":{"selected":["b"],"dir":"$root"},"message":"b to be selected"}'''
put = '''{"expect":{"selected":["b"],"dir":"$root"},"message":"b to be selected","timeout_ms":500}'''

[[case]]
name = "a twin drops its original's check of the files on disk"
problem = '''scenarios/keys/moves-rune.jsonl lacks line 6 of moves in columns, an fs step: a twin keeps every fs step and every pref check of its original, in its order, for the files on disk and settings.toml match with no exception'''

[[case.edit]]
header = "keys/moves-rune"
find = '''
{"fs":{"path":"b","exists":true}}
'''
put = ''''''

[[case]]
name = "a twin drops its original's check of settings.toml"
problem = '''scenarios/keys/moves-rune.jsonl lacks line 7 of moves in columns, a pref check: a twin keeps every fs step and every pref check of its original, in its order, for the files on disk and settings.toml match with no exception'''

[[case.edit]]
header = "keys/moves-rune"
find = '''
{"wait":{"all":[{"pref":{"key":"show_hidden","value":false}},{"focused":"b"}]},"message":"the preference to be written"}
'''
put = ''''''

[[case]]
name = "a twin keeps its original's end checks in another order"
problem = '''scenarios/keys/moves-rune.jsonl lacks line 7 of moves in columns, a pref check: a twin keeps every fs step and every pref check of its original, in its order, for the files on disk and settings.toml match with no exception'''

[[case.edit]]
header = "keys/moves-rune"
find = '''
{"fs":{"path":"b","exists":true}}
{"wait":{"all":[{"pref":{"key":"show_hidden","value":false}},{"focused":"b"}]},"message":"the preference to be written"}
'''
put = '''
{"wait":{"all":[{"pref":{"key":"show_hidden","value":false}},{"focused":"b"}]},"message":"the preference to be written"}
{"fs":{"path":"b","exists":true}}
'''

[[case]]
name = "a twin checks another file than the one its original's variable names"
patches = ["moves-rune", "renames-rune"]
problem = '''scenarios/keys/renames-rune.jsonl lacks line 6 of renames in list-ru, an fs step: a twin keeps every fs step and every pref check of its original, in its order, for the files on disk and settings.toml match with no exception'''

[[case.edit]]
header = "keys/renames"
find = '''{"id":"ru","layout":"ru","vars":{"name":"gamma"}}]}'''
put = '''{"id":"ru","layout":"ru","vars":{"name":"gamma"}}],"parity":{"twin":"renames-rune","exception":"a11y","ref":"lgse/strata#2201"}}'''

[[case.edit]]
header = "keys/renames-rune"
text = '''
{"scenario":"renames-rune","modes":["list"],"targets":["rune"],"variants":[{"id":"ru","layout":"ru"}],"parity":{"twin":"renames","exception":"a11y","ref":"lgse/strata#2201","differs":"line 4 presses the button, which has no key of its own on Rune"}}
{"key":"F2"}
{"type":"gamma"}
{"click":{"button":"Rename"}}
{"fs":{"path":"beta","exists":true}}
'''

[[case.edit]]
file = "keys"
find = '''
status = "pending"
reason = "scope"
blocker = "A2: layouts"
'''
put = '''
status = "parallel"
exception = "a11y"
twin = "renames-rune/list-ru"
ref = "lgse/strata#2201"
'''

