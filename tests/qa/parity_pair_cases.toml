# What the parity ledger's two readers accept and refuse of a labelled pair: the second table,
# beside tests/qa/parity_cases.toml, read by the runner's tests (tests/qa/twin_tests.rs) and
# the scripts' (scripts/test_qa_parity_twins.py) alike. An edit is written as in that table.
#
# The corpus is a labelled pair, with its files whole. `moves` cannot pass in Columns on
# the Rune target under the `timing` exception, so `moves-rune`, beside it, stands in for
# that run there: its fourth line waits where the original expects at once, and it keeps the
# original's `fs` step and its check of settings.toml. `renames` is a scenario with no twin.
# Here the runs are read from the headers and the steps from the files, as each reader
# reads them, and a case's `problem` is the one line both report for the whole corpus: the
# ledger's entries, each header alone, and each pair.
#
#   scenarios  a file's text for each `<folder>/<scenario>`: the header, then the steps.
#   ledger     each folder's file. A twin's runs are not listed: each is the `twin` of the
#              parallel run it stands in for.
#   patches    the scenarios the Rune mutation patches are named for.
#   packet     the entries of the Rune filing packet, docs/rune/upstream/rune.
#   case       edits which both refuse: each `edit` names a `header`, which is a scenario's
#              file, or a `file` of the ledger, and changes it as that table's do. `patches` replaces
#              the patches there are. `refused` is for a file a reader cannot read at all.
#   accepted   edits both still accept.

patches = ["moves-rune"]
packet = ["98-escape-after-a-dead-key.md"]

[scenarios]
"keys/moves" = '''
{"scenario":"moves","modes":["columns","list"],"prefs":{"type_to_search":false},"tree":"canonical","parity":{"twin":"moves-rune","exception":"timing","ref":"lgse/strata#2200"}}
{"wait":{"entry":"b","dir":"$root"},"message":"the entry b to appear"}
{"key":"Down"}
{"key":"Right","modes":["list"]}
{"expect":{"selected":["b"],"dir":"$root"}}
{"fs":{"path":"b","exists":true}}
{"wait":{"all":[{"pref":{"key":"show_hidden","value":false}},{"focused":"b"}]},"message":"the preference to be written"}
'''
"keys/moves-rune" = '''
{"scenario":"moves-rune","modes":["columns"],"targets":["rune"],"prefs":{"type_to_search":false},"tree":"canonical","parity":{"twin":"moves","exception":"timing","ref":"lgse/strata#2200","differs":"line 4 waits for the selection, where the original expects it at once"}}
{"wait":{"entry":"b","dir":"$root"},"message":"the entry b to appear"}
{"key":"Down"}
{"wait":{"selected":["b"],"dir":"$root"},"message":"b to be selected"}
{"fs":{"path":"b","exists":true}}
{"wait":{"all":[{"pref":{"key":"show_hidden","value":false}},{"focused":"b"}]},"message":"the preference to be written"}
'''
"keys/renames" = '''
{"scenario":"renames","modes":["list"],"variants":[{"id":"us","vars":{"name":"beta"}},{"id":"ru","layout":"ru","vars":{"name":"gamma"}}]}
{"key":"F2"}
{"type":"$name"}
{"key":"Return","variants":["us"]}
{"key":"KP_Enter","variants":["ru"]}
{"fs":{"path":"$name","exists":true}}
'''

[ledger]
keys = '''
[[run]]
scenario = "moves"
run = "columns"
package = "A7"
status = "parallel"
exception = "timing"
twin = "moves-rune/columns"
ref = "lgse/strata#2200"

[[run]]
scenario = "moves"
run = "list"
package = "A2"
status = "pending"
reason = "scope"
blocker = "A2"

[[run]]
scenario = "renames"
run = "list-us"
package = "A2"
status = "pending"
reason = "scope"
blocker = "A2: list"

[[run]]
scenario = "renames"
run = "list-ru"
package = "A2"
status = "pending"
reason = "scope"
blocker = "A2: layouts"
'''

# A file a reader cannot read: the runner's reader and the scripts' refuse the same headers.

