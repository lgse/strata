# The archives and providers alphabet (A13): what a user does with archives and an external
# file provider in Columns on the canonical fixture, with type to search off, plus `bundle.zip`
# (`docs/inside.txt`, `top.txt`, written with pinned member times), the ZipCrypto
# `encrypted.zip` (`protected.txt`, password `fixture-password`) and the `example` provider of
# `tests/qa/scenarios/file_providers` (its menu offers `Keep test pin`, then `Release test pin`):
# - `Extract here` from the entry menu on the fixture archives and on ones the sequence made,
#   with the `Extract` password dialog taking a right or a wrong password;
# - `Compress…` from the entry menu into `packed.zip` or `packed.tar`, so a second one meets the
#   `File already exists` prompt, answered by `Replace`, `Keep Both` or `Cancel`, by click or
#   by keys;
# - `Ctrl+Z` undoing a compression or an extraction;
# - the provider's section in entry menus and its action, which flips the provider's state;
# - the reveal of what a compression or an extraction made, between moves along the folders;
# - the archive tree in the drawer, opened by explicit entry on a plain archive, with its keys,
#   member clicks, Left back to the listing and the drawer closed again.
#
# Left out, with why:
# - The drawer on anything but a plain archive's tree: every action outside the tree waits for
#   the drawer to close, so the cursor never brings a text file's or a folder's preview in, and
#   `encrypted.zip`'s preview is never opened. `app.preview` reads the drawer's accessible tree:
#   a text body reads differently on the two targets (lgse/strata#2558, A15's), and so does the
#   password field, whose inner `GtkText` GTK names too (lgse/strata#2560, A13's, open). The
#   nine `archive_preview` runs hold the prompt.
# - Compressing anything but `readme.md`, `todo.txt` and `documents`, or from another folder: a
#   file the sequence wrote has the clock's mtime, which a new archive records, so two replays
#   would write different bytes.
# - Password-protected compression: its salt changes the archive's bytes on every run (as in
#   `menus`).
# - `Extract to…` (A20's floating chooser) and the `abandoned-extract-to-no-hijack` runs it
#   holds; 10xer mode (A11's); the provider's badges and its activation notice, which the
#   observation does not read.
# - A click on a folder already open as a pane (lgse/strata#2356, as in `clipboard`).
# - `Up` on a first row (`archive`, `notes.txt`, `diagram.txt`, `docs`, `inside.txt`), as in
#   `menus` and `views` (lgse/strata#2408), and `Right` on the empty `archive` folder (`views`).
#
# Version 1 was the first draft, never merged: its smoke tier met the drawer's differences
# above in 12 of 20 seeds and fixed the password prompt's header naming its archive `ZIP`
# where GTK writes `zip`. Its GTK calibration met lgse/strata#2559, a GTK critical after an
# extracted previewed tar, parked in tests/qa/fuzz/corpus/archives. Version 2, never merged
# either, kept the drawer closed and agreed in 20 of 20 seeds on GTK and against Rune, but left
# the provider's `File availability` outcome open until the safety net closed it, for about a
# third of its observations. Version 3, never merged, closed it in the action that opened it,
# and met the drawer once more: `Right` on `packed (1).tar`, a numbered copy its guard did not
# name. Version 4, never merged, sent `Right` only to the folders a sequence can open, and kept
# the drawer closed. Version 5 opens the archive tree, since #2561 presents its member rows and
# crumbs as GTK's and A15's #2548 exposed the header's separators. Its first smoke tier found
# Space in the tree no longer closing the preview after #2548 (fixed), and a click on an open
# folder (lgse/strata#2356, now guarded).
area = "archives"
version = 5
about = "Columns on the canonical fixture with bundle.zip, encrypted.zip and a provider, type to search off: Extract here with its password dialog, Compress with File already exists answers by click and by keys, Undo, the reveal of what they made, the provider's entry menu section and action, and the archive tree in the drawer"
header = '''{"modes":["columns"],"prefs":{"type_to_search":false},"setup":[{"fs":{"path":"$config/strata/providers/example","mkdir":true,"parents":true}},{"fs":{"path":"$config/strata/providers/example","chmod":"700"}},{"fs":{"path":"$config/strata/providers/example/state","write":"on-demand"}},{"fs":{"path":"$config/strata/providers/example/provider.py","write":"\nimport json,os,sys,threading,time\nfrom pathlib import Path\nroot,state,record=map(Path,sys.argv[1:])\n(state.parent/'pid').write_text(str(os.getpid()))\nlock=threading.RLock()\ngeneration=0\ndef emit(value):\n with lock:\n  print(json.dumps(value),flush=True)\ndef watch():\n global generation\n previous=None\n while True:\n  try: now=(state.read_text(), (state.parent/'event').read_text() if (state.parent/'event').exists() else '')\n  except OSError: now='offline'\n  if now!=previous or (state.parent/'storm').exists():\n   previous=now\n   with lock:\n    generation+=1\n    event={'version':1,'event':'invalidate'}\n    if not (state.parent/'legacy').exists(): event.update(revision=generation,paths=[str(root)])\n    emit(event)\n  time.sleep(.1)\nthreading.Thread(target=watch,daemon=True).start()\nfor line in sys.stdin:\n r=json.loads(line);paths=r['paths']\n if (state.parent/'delay').exists(): time.sleep(.3)\n with lock:\n  mode=state.read_text()\n  eligible=mode!='offline' and (r['method']=='query' or all(Path(p).is_relative_to(root) and Path(p).name!='local-only.txt' for p in paths))\n  result={'version':1,'id':r['id']}\n  if r['method']=='query': result['decorations']=[]\n  elif r['method']=='menu': result['actions']=[]\n  if eligible:\n   if r['method']=='query':\n    result['decorations']=[{'path':p,'badge':'badge' if mode=='kept' else None,'description':'Available offline' if mode=='kept' else '', 'priority':int((state.parent/'priority').read_text()) if (state.parent/'priority').exists() else 0} for p in paths if Path(p).is_relative_to(root) and Path(p).name!='local-only.txt']\n   elif r['method']=='menu':\n    result['actions']=[{'id':'release' if mode=='kept' else 'keep','label':'Release test pin' if mode=='kept' else 'Keep test pin','icon':'badge'}]\n    if (state.parent/'context').exists(): result['actions'][0]['context']=(state.parent/'context').read_text()\n    if (state.parent/'tree').exists():\n     result['actions']=[{'id':'inspect','label':'Inspect test state'}, {'id':'availability','label':'Offline availability','children':result['actions']+[{'id':'details','label':'Details','children':[{'id':'info','label':'Inspect nested state'}]}]}]\n     if (state.parent/'relabel').exists():\n      result['actions'][1]['label']='Local availability'\n      result['actions'][1]['children'][0]['label']='Release updated pin' if mode=='kept' else 'Keep test pin'\n     if (state.parent/'deep-relabel').exists():\n      result['actions'][1]['label']='Cloud availability'\n      result['actions'][1]['children'][1]['label']='Updated details'\n      result['actions'][1]['children'][1]['children'][0]['label']='Inspect refreshed state'\n     if (state.parent/'hide-inspect').exists(): result['actions'].pop(0)\n   elif r['method']=='activate':\n    record.write_text(json.dumps(r));state.write_text('kept');result['message']='Test pin accepted'\n    if (state.parent/'disconnect').exists(): sys.exit(0)\n    if (state.parent/'partial').exists():\n     result.update(message='One test pin accepted; another was rejected',outcome={'status':'partial','accepted':1,'total':len(paths),'job':'fixture-job-17'})\n  if r['method'] in ('query','menu') and (state.parent/'method-error').exists():\n   result={'version':1,'id':r['id'],'error':'not-available','message':'State unavailable'}\n  with lock:\n   if 'error' not in result and not (state.parent/'legacy').exists(): result['revision']=generation\n   emit(result)\n"}},{"fs":{"path":"$config/strata/providers/example/badge.png","base64":"iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAHUlEQVR4nGM0qnj2n4ECwESJ5lEDRg0YNWAwGQAAosYCrxCcv1sAAAAASUVORK5CYII="}},{"fs":{"path":"$config/strata/providers/example/provider.json","write":"{\"version\": 1, \"id\": \"example\", \"name\": \"Example Cloud\", \"icon\": \"badge\", \"command\": [\"$python\", \"$config/strata/providers/example/provider.py\", \"$fixture\", \"$config/strata/providers/example/state\", \"$config/strata/providers/example/record\"], \"icons\": {\"badge\": \"badge.png\"}}"}},{"fs":{"path":"bundle.zip","zip":[["docs/inside.txt",{"text":"inside\n","date_time":[2024,3,5,10,20,30],"mode":"100644"}],["top.txt",{"text":"top\n","date_time":[2024,3,5,10,20,30],"mode":"100644"}]]}},{"fs":{"path":"encrypted.zip","base64":""}}]}'''

[[action]]
name = "down"
weight = 8
steps = ['{"key":"<key>","when":{"all":[{"focused_pane":true},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null},{"preview":null}]}}']
choose.key = ["Down", "j"]

[[action]]
name = "up"
weight = 5
steps = ['{"key":"<key>","when":{"all":[{"focused_pane":true},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null},{"preview":null},{"not":{"focused":{"one_of":["archive","notes.txt","diagram.txt","docs","inside.txt"]}}}]}}']
choose.key = ["Up", "k"]

[[action]]
name = "right"
weight = 4
steps = ['{"key":"<key>","when":{"all":[{"focused_pane":true},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null},{"preview":null},{"focused":{"one_of":["documents","pictures","bundle","bundle (1)","bundle (2)","docs"]}}]}}']
choose.key = ["Right", "l"]

[[action]]
name = "left"
weight = 4
steps = ['{"key":"<key>","when":{"all":[{"focused_pane":true},{"not":{"directory":"$root"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null},{"preview":null}]}}']
choose.key = ["Left", "h"]

[[action]]
name = "click-entry"
weight = 5
steps = ['{"click":{"entry":"<entry>"},"when":{"all":[{"present":{"entry":"<entry>"}},{"absent":{"pane":"<entry>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null},{"preview":null}]}}']
choose.entry = ["bundle.zip", "encrypted.zip", "documents", "readme.md", "todo.txt", "packed.zip", "packed.tar", "bundle", "protected.txt"]

[[action]]
name = "extract-here"
weight = 4
steps = [
  '{"click":{"entry":"<archive>"},"button":3,"when":{"all":[{"present":{"entry":"<archive>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null},{"preview":null}]}}',
  '{"click":{"menu_item":"Extract here"},"when":{"present":{"menu_item":"Extract here"}}}',
]
choose.archive = ["bundle.zip", "encrypted.zip", "packed.zip", "packed.tar"]

# The Extract password dialog of `encrypted.zip`, answered right or wrong (a wrong one reopens it).
[[action]]
name = "extract-password"
weight = 3
steps = [
  '{"type":"<password>","when":{"all":[{"dialog":"Extract"},{"present":{"role":"password text","states":["focused"],"within":{"dialog":true}}}]}}',
  '{"key":"Return","when":{"dialog":"Extract"}}',
]
choose.password = ["fixture-password", "wrong-password"]

# Compress… into `packed`; a second compression to the same format meets File already exists.
[[action]]
name = "compress"
weight = 4
steps = [
  '{"click":{"entry":"<entry>"},"button":3,"when":{"all":[{"present":{"entry":"<entry>"}},{"directory":"$root"},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null},{"preview":null}]}}',
  '{"click":{"menu_item":"Compress…"},"when":{"present":{"menu_item":"Compress…"}}}',
  '{"click":{"role":"toggle button","name":"<format>"},"when":{"present":{"role":"toggle button","name":"<format>"}}}',
  '{"click":{"role":"text","name":"Archive name"},"when":{"present":{"role":"text","name":"Archive name"}}}',
  '{"key":"ctrl+a","when":{"field":{"name":"Archive name","focused":true}}}',
  '{"type":"packed","when":{"field":{"name":"Archive name","focused":true}}}',
  '{"key":"Return","when":{"field":{"name":"Archive name","focused":true}}}',
]
choose.entry = ["readme.md", "todo.txt", "documents"]
choose.format = ["ZIP", "TAR"]

[[action]]
name = "conflict-choice"
weight = 4
steps = ['{"click":{"dialog_button":"<choice>"},"when":{"dialog":"File already exists"}}']
choose.choice = ["Replace", "Keep Both", "Cancel"]

[[action]]
name = "conflict-keys"
weight = 2
steps = ['{"key":"<key>","when":{"dialog":"File already exists"}}']
choose.key = ["Tab", "shift+Tab", "Return", "Escape"]

[[action]]
name = "undo"
weight = 3
steps = ['{"key":"ctrl+z","when":{"all":[{"focused_pane":true},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null},{"preview":null}]}}']

# The provider's action from an entry menu, observed in its `File availability` outcome, which
# is then closed; the menu is dismissed instead when the action is not offered.
[[action]]
name = "provider-action"
weight = 4
steps = [
  '{"click":{"entry":"<entry>"},"button":3,"when":{"all":[{"present":{"entry":"<entry>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null},{"preview":null}]}}',
  '{"click":{"menu_item":"<item>"},"when":{"present":{"menu_item":"<item>"}}}',
  '{"key":"Escape","when":{"any":[{"menu_items":{}},{"dialog":"File availability"}]}}',
]
choose.entry = ["readme.md", "todo.txt", "documents", "bundle.zip"]
choose.item = ["Keep test pin", "Release test pin"]

# An entry menu observed open, with the provider's section, then dismissed.
[[action]]
name = "entry-menu-dismiss"
weight = 2
steps = [
  '{"click":{"entry":"<entry>"},"button":3,"when":{"all":[{"present":{"entry":"<entry>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null},{"preview":null}]}}',
  '{"key":"Escape","when":{"menu_items":{}}}',
]
choose.entry = ["encrypted.zip", "readme.md", "documents"]

# Takes away what the sequence made, so compressions and extractions start over.
[[action]]
name = "remove-made"
weight = 2
steps = ['{"fs":{"path":"<made>","remove":true},"when":{"all":[{"file":{"path":"$fixture/<made>","exists":true}},{"not":{"focused":"<made>"}},{"not":{"all_selected":{"contains":["<made>"]}}},{"not":{"present":{"pane":"<made>"}}},{"preview":null}]}}']
choose.made = ["packed.zip", "packed.tar", "packed (1).zip", "packed (1).tar", "bundle", "protected.txt"]

# The archive tree in the drawer: a plain archive's preview opened by explicit entry in Columns
# (`Stage::PreviewNavigation`), never `encrypted.zip`'s password prompt (lgse/strata#2560).
[[action]]
name = "open-archive-preview"
weight = 5
steps = [
  '{"click":{"entry":"<archive>"},"when":{"all":[{"present":{"entry":"<archive>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null},{"preview":null}]}}',
  '{"key":"<key>","when":{"all":[{"focused":"<archive>"},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null},{"preview":null}]}}',
]
choose.archive = ["bundle.zip", "packed.zip", "packed.tar"]
choose.key = ["Right", "Return", "space"]

# Keys inside the archive tree: the cursor, folders, Left up a level and back to the listing,
# and Escape or Space closing the drawer.
[[action]]
name = "archive-tree-keys"
weight = 8
steps = ['{"key":"<key>","when":{"all":[{"not":{"focused_pane":true}},{"not":{"preview":null}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.key = ["Down", "Up", "Right", "Left", "Return", "j", "k", "l", "h", "Escape", "space"]

[[action]]
name = "archive-member-click"
weight = 3
steps = ['{"click":{"role":"list item","within":{"preview":true},"has":{"role":"label","name":"<member>"}},"when":{"all":[{"present":{"role":"list item","within":{"preview":true},"has":{"role":"label","name":"<member>"}}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.member = ["docs/", "top.txt", "inside.txt", "readme.md", "todo.txt", "documents/", "notes.txt"]

# Back in the listing with the drawer open on the archive: Right enters it again, Space closes it.
[[action]]
name = "listing-with-archive-preview"
weight = 4
steps = ['{"key":"<key>","when":{"all":[{"focused_pane":true},{"not":{"preview":null}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null},{"focused":{"one_of":["bundle.zip","packed.zip","packed.tar","packed (1).zip","packed (1).tar"]}}]}}']
choose.key = ["Right", "l", "space"]

# Safety net: closes any leftover menu or dialog so one cannot hold the rest of a sequence.
[[action]]
name = "dismiss-overlay"
weight = 2
steps = ['{"key":"Escape","when":{"any":[{"dialog":true},{"menu_items":{}}]}}']
