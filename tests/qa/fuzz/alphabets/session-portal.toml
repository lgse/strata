# The portal alphabet (F5, slice 4): the FileChooser portal's chooser, as `strata --qa --portal`
# serves an `OpenFile` request, in List on the canonical fixture, Rune on the portal session
# host (A20's `qa/session/portal.rs`):
# - the opening: a request for several files from `$root`, and its chooser adopted;
# - rows clicked alone, with Ctrl and with Shift, folders opened by a double click, the listing's
#   keys, and Back to `$root`;
# - the answer: Return, the Open button, Escape or the Cancel button; and, once it came, a
#   request sent again and its chooser adopted;
# - a file written or removed behind the chooser's back.
# What the portal answered (its status and the chosen paths) is observed after every step, as
# `portal`, beside what the chooser shows and the fixture's digest. No step waits on a dialog:
# an Open chooser raises none here, and the error its footer shows (Open over a folder alone)
# is an alert the snapshot reads as `dialog`, which takes no keys.
#
# While no request awaits its answer the portal shows no window, so the replay skips every step
# that needs one (a process step, or a step whose `when` the target answers), as a step whose
# `when` does not hold; a `portal_open` while a request awaits is skipped too
# (`tests/qa/fuzz/peers.rs`). A file is written behind the chooser's back whatever shows.
#
# Left out, with why:
# - Leaving the fixture: Backspace, Alt+Up and the crumbs go above `$root`, where the listing is
#   the machine's. Back returns only to `$root`.
# - Ctrl+A: GTK's chooser takes its cursor to the last row and Rune's keeps it where it was
#   (lgse/strata#2701).
# - A double click on a folder: on the session host Rune's view then sometimes holds no cursor
#   where its browser holds the first visit's (lgse/strata#2702); a click and
#   Return open the folder instead.
# - Up, Shift+Up on a folder's first row and Down, Shift+Down on its last, as the `list`
#   alphabet leaves them out: GTK takes the keyboard to the pane header (`owner.md`, A1 item 3)
#   and selects the cursor's entry with nothing selected (lgse/strata#2414). The first rows are
#   `archive`, `new.txt` or `notes.txt`, and `diagram.txt`; the last `todo.txt`,
#   `spreadsheet.csv` and `photo.txt`. With no entry focused, as in the empty `archive`, GTK's
#   Up and Down take the keyboard out of the listing too (to the pane, or the Name field) and
#   Rune's stay, A1 item 3's kind: they wait for a focused entry.
# - Shift+click: GTK's model cursor stays where the click before left it (lgse/strata#2353,
#   `oracle`), and Return then confirms from there: with files and a folder selected and the
#   folder clicked, GTK answers the files and Rune opens the folder.
# - A Ctrl+click on a selected row: with only the load's cursor left selected, GTK's next arrow
#   selects the focused row where Rune's moves (lgse/strata#2414's kind). Ctrl+click adds rows.
# - Back with no entry focused: GTK leaves the keyboard off the listing, Rune focuses it
#   (`owner.md`, A1 item 4: Rune's, meanwhile). Back waits for a focused entry.
# - Filters, the Name field of a save request, image conversion and drops: the
#   `chooser_selection` and `chooser_image_conversion` scenarios hold them, each needing its own
#   request; a later version can draw the request's options.
# Version 1 was the draft, never merged, changed in place as it met the findings above: Ctrl+A
# (#2701) and a double click's first visit (#2702), whose sequences are parked; Shift+click
# (#2353), a selected row's Ctrl+click (#2414), edge keys with no entry focused (A1 item 3),
# Back unfocused (A1 item 4), and the footer error, which broke Rune's keyboard invariant until
# the invariant left an alert out. Version 2 leaves out what it lists above.
area = "session-portal"
version = 2
about = "List on the canonical fixture through the compositor (Rune on the portal session host): an OpenFile request for several files, its rows clicked, Ctrl- and Shift-clicked and opened, its keys, its answer by Return, Open, Escape or Cancel, the request sent again, and files changed behind its back"
header = '{"modes":["list"],"session_bus":true,"portal":true}'
host = "session"
opening = [
  '{"portal_open":"Choose files","options":{"current_folder":"$fixture","multiple":true}}',
  '{"adopt":"Choose files","timeout_ms":20000}',
]

[[action]]
name = "click-row"
weight = 6
steps = ['{"click":{"row":"<entry>"},"when":{"all":[{"present":{"row":"<entry>"}},{"menu_items":null}]}}']
choose.entry = ["readme.md", "todo.txt", "notes.txt", "report.md", "spreadsheet.csv", "diagram.txt", "photo.txt", "documents", "pictures", "archive"]

[[action]]
name = "add-row"
weight = 4
steps = ['{"click":{"row":"<entry>"},"mods":["ctrl"],"when":{"all":[{"present":{"row":"<entry>"}},{"not":{"state":{"target":{"row":"<entry>"},"selected":true}}},{"menu_items":null}]}}']
choose.entry = ["readme.md", "todo.txt", "notes.txt", "report.md", "spreadsheet.csv", "diagram.txt", "photo.txt", "documents"]

[[action]]
name = "open-folder"
weight = 4
steps = [
  '{"click":{"row":"<folder>"},"when":{"all":[{"present":{"row":"<folder>"}},{"menu_items":null}]}}',
  '{"key":"Return","when":{"all":[{"focused":"<folder>"},{"menu_items":null}]}}',
]
choose.folder = ["documents", "pictures", "archive"]

[[action]]
name = "down"
weight = 4
steps = ['{"key":"<key>","when":{"all":[{"focused":true},{"not":{"field":{"focused":true}}},{"not":{"focused":{"one_of":["todo.txt","spreadsheet.csv","photo.txt"]}}},{"menu_items":null}]}}']
choose.key = ["Down", "Down", "shift+Down"]

[[action]]
name = "up"
weight = 3
steps = ['{"key":"<key>","when":{"all":[{"focused":true},{"not":{"field":{"focused":true}}},{"not":{"focused":{"one_of":["archive","new.txt","notes.txt","diagram.txt"]}}},{"menu_items":null}]}}']
choose.key = ["Up", "Up", "shift+Up"]

[[action]]
name = "edge"
weight = 2
steps = ['{"key":"<key>","when":{"all":[{"not":{"field":{"focused":true}}},{"menu_items":null}]}}']
choose.key = ["Home", "End"]

[[action]]
name = "back"
weight = 2
steps = ['{"key":"alt+Left","when":{"all":[{"not":{"directory":"$root"}},{"focused":true},{"menu_items":null}]}}']

[[action]]
name = "accept"
weight = 3
steps = ['{"key":"Return","when":{"all":[{"not":{"field":{"focused":true}}},{"menu_items":null}]}}']

[[action]]
name = "open-button"
weight = 2
steps = ['{"click":{"role":"button","name":"Open"},"when":{"all":[{"present":{"role":"button","name":"Open"}},{"menu_items":null}]}}']

[[action]]
name = "cancel"
weight = 1
steps = ['{<command>,"when":{"all":[{"menu_items":null}]}}']
choose.command = ['"key":"Escape"', '"click":{"role":"button","name":"Cancel"}']

[[action]]
name = "ask-again"
weight = 6
steps = [
  '{"portal_open":"Choose files","options":{"current_folder":"$fixture","multiple":true}}',
  '{"adopt":"Choose files","timeout_ms":20000}',
]

[[action]]
name = "write"
weight = 2
steps = ['{"fs":{"path":"<path>","write":"written behind the chooser\n"}}']
choose.path = ["new.txt", "documents/new.txt", "todo.txt"]

[[action]]
name = "remove"
weight = 1
steps = ['{"fs":{"path":"<path>","remove":true},"when":{"file":{"path":"$fixture/<path>","exists":true}}}']
choose.path = ["new.txt", "documents/new.txt", "readme.md"]
