# The List view's alphabet (A2): what a user does in the List table on the canonical
# fixture, by the keys and pointer GTK's List view and the Rune List view both take today.
#
# Type to search is off (the header's `prefs`), so j and k are Down and Up, as GTK reads
# them then (`Context::of` in `src/ui/keys/alias.rs`).
#
# Left out, with why:
# - Right and Left, and h and l, which are them with type to search off: List rows have no
#   sideways neighbour, Left leaves the pane for the sidebar (on GTK `h` took the keyboard
#   out of the pane 5 times in 5), and Right with no cursor is an owner's question
#   (`owner.md`, A2 item 1).
# - The preview (A15's), typed search (A10's filter), view switches (A8's), the sort (A10's).
# - Grouping by type: a saved preference (`group_by_type`) that one header holds for a whole
#   alphabet; a grouped alphabet is a second one, when grouped runs need it.
# - The headings' resize and reorder drags: a drag by offset on a heading is a point tied to
#   one toolkit's heading widths, which the rules keep out.
# - A click or right-click on the entry being renamed: where the caret goes is by pixel, and
#   GTK does not answer a Shift+click there the same way twice (lgse/strata#2173).
# - Renames, by F2 and by the menu: while the List editor is open GTK's QA snapshot leaves the
#   edited row out of `app.matches` and `app.panes` (lgse/strata#2510, open), so every step
#   with the editor open differs. Rename in List stays the scenarios' and `columns`'.
# - Ctrl+A: GTK's snapshot then reports the row the cursor left as focused (lgse/strata#2351's
#   kind, `main`'s lgse/strata#2361).
# - Up, k, Shift+Up and Page_Up on a folder's first row, which take GTK's keyboard to the pane
#   header where Rune's stays (`owner.md`, A1 item 3), and Down, j, Shift+Down and Page_Down on
#   its last, which with nothing selected select the cursor's entry on GTK and do nothing on
#   Rune (lgse/strata#2414, with the owner): each is guarded by name. A folder's first entry is
#   `archive`, `notes.txt`, `diagram.txt` or, once written, `fuzz-b.txt`; its last `todo.txt`,
#   `spreadsheet.csv` or `photo.txt`.
# - (Until version 7, a Shift+click with nothing selected, as after a folder's load, where Rune
#   ranged from the load's cursor: lgse/strata#2551, fixed in F4's round 2. Version 7 sends it
#   again.)
# - Shift+Home and Shift+End: GTK's browser takes as its cursor the last entry a change newly
#   selected, not the row its list focuses, so a reload or a return after a range of more than
#   one entry refocuses that entry (lgse/strata#2552, `oracle`; `icons v1` seed `0x1a`, F4's
#   round 2). Shift+Down and Shift+Up add one entry, the cursor's, and stay.
# - A Ctrl+click on an entry already selected: GTK's next key moves from the cursor the click
#   left, Rune's from the clicked row (lgse/strata#2353, with the owner).
#
# Version 3 met all four in nearly every seed across the targets (F4's round 1); version 4,
# F4's round 2 draft, guarded them and met lgse/strata#2640 (fixed) and lgse/strata#2641 at
# Return; version 5 kept Return off a multi-selection, and met lgse/strata#2644 where its
# menu's Escape, guarded on a Rename row, left a menu over several entries open; version 6
# dismisses any menu.
#
# The actions are the single-pane views' own, so the Icons view's alphabet (A1) can take the
# same list with its own header and Right and Left, which an Icons grid has.
area = "list"
version = 7
about = "List on the canonical fixture, type to search off: keyboard navigation and selection with arrows, j and k off the folders' ends, clicks, Ctrl and Shift clicks and background clicks by name, opening folders in place, Back and the parent, the context menu by pointer, hidden files, and files made and removed behind the application's back"
header = '{"modes":["list"],"prefs":{"type_to_search":false}}'

[[action]]
name = "down"
weight = 8
steps = ['{"key":"<key>","when":{"not":{"focused":{"one_of":["todo.txt","spreadsheet.csv","photo.txt"]}}}}']
choose.key = ["Down", "Down", "j", "Page_Down"]

[[action]]
name = "up"
weight = 6
steps = ['{"key":"<key>","when":{"not":{"focused":{"one_of":["archive","notes.txt","diagram.txt","fuzz-b.txt"]}}}}']
choose.key = ["Up", "Up", "k", "Page_Up"]

[[action]]
name = "edge"
weight = 3
steps = ['{"key":"<key>"}']
choose.key = ["Home", "End"]

[[action]]
name = "extend-down"
weight = 3
steps = ['{"key":"shift+Down","when":{"not":{"focused":{"one_of":["todo.txt","spreadsheet.csv","photo.txt"]}}}}']

[[action]]
name = "extend-up"
weight = 3
steps = ['{"key":"shift+Up","when":{"not":{"focused":{"one_of":["archive","notes.txt","diagram.txt","fuzz-b.txt"]}}}}']

[[action]]
name = "escape"
weight = 3
steps = ['{"key":"Escape"}']

# Return only on the two folders the walk visits, and only with nothing else selected: with a
# multi-selection GTK's Return activates the selection, opening Open With for its files, where
# Rune's opens the focused folder (lgse/strata#2641, beside #2358; `icons v2` seed `0x08`).
# On a file it asks for the file's default application, which the QA image has none of: GTK
# then opens Strata's Open With chooser, which takes the keyboard (reproduced), and Rune opens
# nothing, so the keys after it go to different places. Not on `archive`, the fixture's one empty
# folder, where GTK lost Back and the parent key in the walk (observed in the walk, not
# reproduced: both work there by hand). And not off the rows: on GTK, Up off the first row
# takes the keyboard to the pane header, where Return leaves the fixture.
[[action]]
name = "open"
weight = 2
steps = ['{"key":"Return","when":{"all":[{"any":[{"focused":"documents"},{"focused":"pictures"}]},{"any":[{"selected":[]},{"selected":["documents"]},{"selected":["pictures"]}]}]}}']

# A folder opened by the pointer, as a double click opens it in a List view, wherever the
# keyboard is: on GTK the keyboard is often off the rows, where Return is not sent.
[[action]]
name = "open-folder"
weight = 4
steps = ['{"click":{"entry":"<folder>"},"count":2,"when":{"all":[{"present":{"entry":"<folder>"}}]}}']
choose.folder = ["documents", "pictures"]

# The parent of the fixture's own folder is /tmp, which holds other runs' folders: the
# parent and Back stay inside the fixture.
[[action]]
name = "parent"
weight = 3
steps = ['{"key":"alt+Up","when":{"not":{"directory":"$root"}}}']

[[action]]
name = "back"
weight = 3
steps = ['{"key":"alt+Left","when":{"not":{"directory":"$root"}}}']

# Entries of the three folders the walk shows; one not shown is skipped at once.
[[action]]
name = "click"
weight = 5
steps = ['{"click":{"entry":"<entry>"},"when":{"all":[{"present":{"entry":"<entry>"}}]}}']
choose.entry = ["documents", "pictures", "readme.md", "todo.txt", "notes.txt", "report.md", "spreadsheet.csv", "diagram.txt", "photo.txt"]

[[action]]
name = "ctrl-click"
weight = 2
steps = ['{"click":{"entry":"<entry>"},"mods":["ctrl"],"when":{"all":[{"present":{"entry":"<entry>"}},{"not":{"all_selected":{"contains":["<entry>"]}}}]}}']
choose.entry = ["documents", "readme.md", "todo.txt", "notes.txt", "report.md", "spreadsheet.csv", "diagram.txt", "photo.txt"]

[[action]]
name = "shift-click"
weight = 2
steps = ['{"click":{"entry":"<entry>"},"mods":["shift"],"when":{"all":[{"present":{"entry":"<entry>"}}]}}']
choose.entry = ["documents", "readme.md", "todo.txt", "notes.txt", "report.md", "spreadsheet.csv", "diagram.txt", "photo.txt"]

# A click on the pane's empty space below its rows, as `background-click-clears-selection`
# makes it: the folders the walk shows hold at most six rows, so the point is blank on both
# targets.
[[action]]
name = "click-background"
weight = 2
steps = ['{"click":{"pane":"<pane>"},"at":["50%",-60],"when":{"all":[{"directory":"<pane>"}]}}']
choose.pane = ["$root", "documents", "pictures"]

# The context menu by the pointer, then a dismissal. The Escape is for any menu open: a menu
# over several selected entries has no Rename row, and left open it takes the next click
# (lgse/strata#2644), as F5 found of `pointer v3`.
[[action]]
name = "menu-dismiss"
weight = 2
steps = [
  '{"click":{"entry":"<entry>"},"button":3,"when":{"all":[{"present":{"entry":"<entry>"}}]}}',
  '{"key":"Escape","when":{"menu_items":{}}}',
]
choose.entry = ["documents", "readme.md", "todo.txt", "notes.txt", "report.md", "diagram.txt"]

[[action]]
name = "refresh"
weight = 1
steps = ['{"key":"F5"}']

# The one action here that writes settings.toml.
[[action]]
name = "hidden"
weight = 2
steps = ['{"key":"ctrl+period"}']

[[action]]
name = "write"
weight = 2
steps = ['{"fs":{"path":"<path>","write":"fuzz\n"}}']
choose.path = ["fuzz-a.txt", "documents/fuzz-b.txt", "pictures/fuzz-c.txt"]

[[action]]
name = "remove"
weight = 1
steps = ['{"fs":{"path":"<path>","remove":true}}']
choose.path = ["fuzz-a.txt", "documents/fuzz-b.txt", "pictures/fuzz-c.txt"]
