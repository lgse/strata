# The List view's alphabet (A2): what a user does in the List table on the canonical
# fixture, by the keys and pointer GTK's List view and the Rune List view both take today.
#
# Left out, with why: Right and Left (List rows have no sideways neighbour; Left leaves the
# pane for the sidebar, and Right with no cursor is an owner's question, `owner.md`, A2
# item 1), the preview (A15's), typed text (type to search is A10's filter), Ctrl+click and
# Shift+click on the row being renamed (where the caret goes is by pixel; and
# lgse/strata#2173), view switches and the sort (A8's and A10's).
#
# The actions are the single-pane views' own, so the Icons view's alphabet (A1) can take the
# same list with its own header and Right and Left, which an Icons grid has.
area = "list"
version = 1
about = "List on the canonical fixture: keyboard navigation and selection, clicks by name, opening folders in place, Back and the parent, the context menu's Rename, F2 rename, hidden files, and files made and removed behind the application's back"
header = '{"modes":["list"]}'

[[action]]
name = "down"
weight = 10
steps = ['{"key":"Down"}']

[[action]]
name = "up"
weight = 8
steps = ['{"key":"Up"}']

[[action]]
name = "edge"
weight = 4
steps = ['{"key":"<key>"}']
choose.key = ["Home", "End", "Page_Down", "Page_Up"]

[[action]]
name = "extend"
weight = 6
steps = ['{"key":"shift+<key>"}']
choose.key = ["Down", "Up", "Home", "End"]

[[action]]
name = "select-all"
weight = 1
steps = ['{"key":"ctrl+a"}']

[[action]]
name = "escape"
weight = 4
steps = ['{"key":"Escape"}']

# A List view opens a folder in place: Return on a folder shows it, and on a file opens it
# with its application, which the QA environment does not have. So Return is for folders
# and for committing a rename only.
[[action]]
name = "open"
weight = 4
steps = ['{"key":"Return","when":{"any":[{"field":{"name":"Rename"}},{"focused_kind":"folder"}]}}']

# The parent of the fixture's own folder is /tmp, which holds other runs' folders: the
# parent and Back stay inside the fixture.
[[action]]
name = "parent"
weight = 3
steps = ['{"key":"alt+Up","when":{"not":{"directory":"$root"}}}']

[[action]]
name = "back"
weight = 2
steps = ['{"key":"alt+Left","when":{"not":{"directory":"$root"}}}']

# No click lands on an entry while a name is being edited (`calibration.toml` says why).
[[action]]
name = "click"
weight = 4
steps = ['{"click":{"entry":"<entry>"},"when":{"all":[{"present":{"entry":"<entry>"}},{"not":{"field":{"name":"Rename"}}}]}}']
choose.entry = ["archive", "documents", "pictures", "readme.md", "todo.txt", "notes.txt", "report.md", "photo.txt"]

[[action]]
name = "click-with"
weight = 3
steps = ['{"click":{"entry":"<entry>"},"mods":["<modifier>"],"when":{"all":[{"present":{"entry":"<entry>"}},{"not":{"field":{"name":"Rename"}}}]}}']
choose.entry = ["documents", "pictures", "readme.md", "todo.txt", "notes.txt", "spreadsheet.csv"]
choose.modifier = ["ctrl", "shift"]

[[action]]
name = "menu"
weight = 2
steps = ['{"click":{"entry":"<entry>"},"button":3,"when":{"all":[{"present":{"entry":"<entry>"}},{"not":{"field":{"name":"Rename"}}}]}}']
choose.entry = ["documents", "readme.md", "todo.txt", "report.md"]

# Rename is the menu row both targets run today; the menu's other rows are other packages'.
[[action]]
name = "menu-rename"
weight = 2
steps = ['{"click":{"menu_item":"Rename"},"when":{"present":{"menu_item":"Rename"}}}']

[[action]]
name = "rename"
weight = 2
steps = ['{"key":"F2"}']

[[action]]
name = "rename-type"
weight = 2
steps = ['{"type":"<text>","when":{"field":{"name":"Rename"}}}']
choose.text = ["x", "-2", "renamed"]

[[action]]
name = "refresh"
weight = 1
steps = ['{"key":"F5"}']

# The one action here that writes settings.toml.
[[action]]
name = "hidden"
weight = 2
steps = ['{"key":"ctrl+period"}']

[[action]]
name = "write"
weight = 2
steps = ['{"fs":{"path":"<path>","write":"fuzz\n"}}']
choose.path = ["fuzz-a.txt", "documents/fuzz-b.txt", "archive/fuzz-c.txt"]

[[action]]
name = "remove"
weight = 1
steps = ['{"fs":{"path":"<path>","remove":true}}']
choose.path = ["fuzz-a.txt", "documents/fuzz-b.txt", "archive/fuzz-c.txt"]
