# The drag-and-drop alphabet (A19): what a user drags in the List view on the canonical
# fixture, with single-click folder activation (`explorer_folder_clicks = 1`) to walk in and
# out of the folders:
# - a file dragged onto a folder of the fixture's root, which moves it, or with Ctrl, copies it
#   (`drag-file-onto-folder`);
# - a folder dragged onto another, which moves it in, or onto itself, which nothing takes
#   (`folder-into-another-folder`, `drop-folder-into-itself`);
# - a file dropped on the pane's own background, its own folder, which nothing takes
#   (`drag-onto-pane-background`);
# - undo of the last transfer, opening a folder in place, the parent, and a click on a file.
#
# Every drag starts from a row not selected, so it drags that row alone and selects it.
#
# Every drop is guarded on disk (`file`) so that it never meets a name already there: the
# conflict dialog is `entry_management`'s, and its choices the conflict alphabet's. Type to
# search and single-click previews are off (`prefs`), so no click opens a preview drawer
# (A15's).
#
# Left out, with why:
# - A drag from a row already selected. GTK's Ctrl+drag of a row an earlier drag selected
#   takes it out of the selection and drags it alone (`oracle`, lgse/strata#2590,
#   against `ctrl-drag-copies-keeps-selection`); and a plain drag of a selected row in a
#   multi-selection gives GTK's keyboard to that row, Rune's staying where it was
#   (`divergence`, lgse/strata#2592).
# - A drag cancelled with Escape. Held over a folder for the observation's rest, it springs
#   the folder open after 750 ms, a step tied to timing; and its release on GTK selects the
#   row under it while the keyboard stays on the dragged row (`oracle`,
#   lgse/strata#2591). `escape-cancels-file-drag` owns the cancel.
# - Drags onto the sidebar, the tab strip and the location bar: the sidebar's drops move files
#   out of the fixture (Home, Trash), and the strip and crumbs are `tabs`' and `location`'s
#   alphabets'. Sidebar pins are `sidebar`'s.
# - Drags from another process (`content_drops`): the driver starts no foreign drag source.
# - Shift during a drag, and drags across volumes: the fixture has one volume, and on the
#   session host a modifier changed mid-drag reaches no client (A19.md, "Open").
# - Spring-loaded folders: a drag resting 750 ms on a folder opens it, a step tied to timing
#   the observation does not hold steady.
# - Multi-selection drags: a selection made by Ctrl+click is `pointer`'s, and a drag of several
#   entries would meet names already there in ways the guards cannot see.
# Version 1 met all three, parked in tests/qa/fuzz/corpus/drag, and lost the keyboard after an
# undo brought a moved entry back (`handover::Kept`, fixed with the alphabet).
area = "drag"
version = 2
about = "List on the canonical fixture with single-click folder activation: files moved or Ctrl-copied onto the root's folders, folders moved into another or onto themselves, drops on the pane's own background, undo, opening a folder, the parent and a click on a file; every drag from a row not selected, every drop guarded against a name already there"
header = '{"modes":["list"],"prefs":{"type_to_search":false,"single_click_previews":false,"explorer_folder_clicks":1,"explorer_file_clicks":2}}'

[[action]]
name = "drag-file-onto-folder"
weight = 8
steps = ['{"drag":{"from":{"entry":"<file>"},"to":{"entry":"<folder>"}},"when":{"all":[{"directory":"$root"},{"present":{"entry":"<file>"}},{"not":{"all_selected":{"contains":["<file>"]}}},{"present":{"entry":"<folder>"}},{"file":{"path":"$fixture/<folder>/<file>","exists":false}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.file = ["readme.md", "todo.txt"]
choose.folder = ["archive", "documents", "pictures"]

[[action]]
name = "ctrl-drag-file-onto-folder"
weight = 6
steps = ['{"drag":{"from":{"entry":"<file>"},"to":{"entry":"<folder>"}},"mods":["ctrl"],"when":{"all":[{"directory":"$root"},{"present":{"entry":"<file>"}},{"not":{"all_selected":{"contains":["<file>"]}}},{"present":{"entry":"<folder>"}},{"file":{"path":"$fixture/<folder>/<file>","exists":false}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.file = ["readme.md", "todo.txt"]
choose.folder = ["archive", "documents", "pictures"]

# A folder onto another moves it in; onto itself, nothing takes the drop.
[[action]]
name = "drag-folder-onto-folder"
weight = 4
steps = ['{"drag":{"from":{"entry":"<from>"},"to":{"entry":"<to>"}},"when":{"all":[{"directory":"$root"},{"present":{"entry":"<from>"}},{"not":{"all_selected":{"contains":["<from>"]}}},{"present":{"entry":"<to>"}},{"file":{"path":"$fixture/<to>/<from>","exists":false}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.from = ["archive", "pictures"]
choose.to = ["archive", "documents"]

# The pane's empty space below its rows, as `drag-onto-pane-background` drops: the fixture's
# folders hold at most six rows, so the point is blank on both targets.
[[action]]
name = "drag-onto-own-background"
weight = 3
steps = ['{"drag":{"from":{"entry":"<file>"},"to":{"pane":"$root"},"to_at":["50%",-60]},"when":{"all":[{"directory":"$root"},{"present":{"entry":"<file>"}},{"not":{"all_selected":{"contains":["<file>"]}}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.file = ["readme.md", "todo.txt"]

[[action]]
name = "undo"
weight = 3
steps = ['{"key":"ctrl+z","when":{"all":[{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']

[[action]]
name = "dismiss-dialog"
weight = 2
steps = ['{"key":"Escape","when":{"dialog":true}}']

# Opens the folder in place: single-click activation.
[[action]]
name = "open-folder"
weight = 4
steps = ['{"click":{"entry":"<folder>"},"when":{"all":[{"present":{"entry":"<folder>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.folder = ["archive", "documents", "pictures"]

[[action]]
name = "click-file"
weight = 3
steps = ['{"click":{"entry":"<file>"},"when":{"all":[{"present":{"entry":"<file>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.file = ["readme.md", "todo.txt", "notes.txt", "photo.txt"]

# The parent of the fixture's own folder is /tmp, which holds other runs' folders: the parent
# stays inside the fixture.
[[action]]
name = "parent"
weight = 4
steps = ['{"key":"alt+Up","when":{"all":[{"not":{"directory":"$root"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
