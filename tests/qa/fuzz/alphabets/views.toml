# The view switch's alphabet (A8): what a user does to change how the canonical fixture is
# shown, in GTK and Rune alike: Ctrl+1, Ctrl+2 and Ctrl+3, the Appearance popover's view rows,
# its Group by file type and Hidden files rows, and the keys that move the keyboard and the
# selection between switches, so a switch carries a cursor, a selection and an open folder
# from one view to the next.
#
# What a replay can see of a switch is the view shown (`app.view_mode`), the panes and their
# selection and keyboard (`app.panes`, `app.focused`, `app.focused_pane`), the folder shown
# (`app.directory`) and its entries (`app.matches`).
#
# Type to search is off (the header's `prefs`), as in the other alphabets.
#
# Left out, with why:
# - The text size keys and the density sliders: what they change is geometry, which the
#   snapshot does not compare, and the List headings' widths follow it.
# - "Customize columns…" and "Show sizes in Columns view": not on Rune when this version was
#   written (lgse/strata#2399, lgse/strata#2402); a later version takes them.
# - Return on an entry: on a file it asks for the default application, which the QA image has
#   none of (`list.toml`'s note); folders are opened by Right in Columns and by a double click.
# - Right and Left outside Columns: Left leaves a single pane for the sidebar (`list.toml`).
# - Renames, menus and files made behind the application: the per-view alphabets have them.
#
# Version 1 was the first draft, never merged: its smoke tier met the plain popover's
# `app.dialog` (lgse/strata#2405, ruled and in the map), Up off a first row, and one sequence
# broke F3's browser-view invariant (lgse/strata#2386, since fixed). Version 2, never merged
# either, had the Up guard; its smoke tier met lgse/strata#2408, parked. Version 3 keeps Right
# off the empty `archive`.
area = "views"
version = 3
about = "Columns, Icons and List on the canonical fixture, type to search off: the view switched by Ctrl+1, Ctrl+2, Ctrl+3 and by the Appearance popover's rows, Group by file type and Hidden files from the popover and by Ctrl+period, with arrows, Home, End, Shift extension and Escape between switches, folders opened by Right in Columns and by a double click, and the parent and Back"
header = '{"modes":["columns"],"prefs":{"type_to_search":false}}'

[[action]]
name = "switch"
weight = 10
steps = ['{"key":"ctrl+<digit>"}']
choose.digit = ["1", "2", "3"]

# The popover's view row: it opens with the keyboard on its first row, as GTK's does.
[[action]]
name = "popover-switch"
weight = 6
steps = [
  '{"click":{"role":"toggle button","name":"Appearance"}}',
  '{"click":{"role":"radio menu item","name":"<view>"},"when":{"present":{"role":"radio menu item","name":"<view>"}}}',
]
choose.view = ["Columns", "Icons", "List"]

# Group by file type is sensitive in List only; elsewhere the click lands on nothing and an
# Escape closes the popover.
[[action]]
name = "popover-group"
weight = 2
steps = [
  '{"click":{"role":"toggle button","name":"Appearance"}}',
  '{"click":{"role":"check menu item","name":"Group by file type"},"when":{"all":[{"view_mode":"List"},{"present":{"role":"check menu item","name":"Group by file type"}}]}}',
  '{"key":"Escape","when":{"present":{"role":"radio menu item","name":"Columns"}}}',
]

[[action]]
name = "popover-hidden"
weight = 2
steps = [
  '{"click":{"role":"toggle button","name":"Appearance"}}',
  '{"click":{"role":"check menu item","name":"Hidden files"},"when":{"present":{"role":"check menu item","name":"Hidden files"}}}',
]

# The popover opened and closed by Escape: the keyboard goes back to the button.
[[action]]
name = "popover-dismiss"
weight = 2
steps = [
  '{"click":{"role":"toggle button","name":"Appearance"}}',
  '{"key":"Escape","when":{"present":{"role":"radio menu item","name":"Columns"}}}',
]

[[action]]
name = "hidden"
weight = 2
steps = ['{"key":"ctrl+period"}']

[[action]]
name = "down"
weight = 8
steps = ['{"key":"Down"}']

# Up off a folder's first row takes the keyboard out of the rows on GTK and stays on the row
# on Rune (`owner.md`, A1 item 3): the guard `columns.toml` has.
[[action]]
name = "up"
weight = 5
steps = ['{"key":"<key>","when":{"not":{"focused":{"one_of":["archive", "notes.txt", "diagram.txt"]}}}}']
choose.key = ["Up", "shift+Up"]

[[action]]
name = "edge"
weight = 3
steps = ['{"key":"<key>"}']
choose.key = ["Home", "End"]

[[action]]
name = "extend"
weight = 2
steps = ['{"key":"shift+Down"}']

[[action]]
name = "escape"
weight = 2
steps = ['{"key":"Escape"}']

# Right opens the folder under the keyboard in Columns, as the child column. Not on
# `archive`, the fixture's one empty folder: in it, shown in Icons, Down takes GTK's keyboard
# to the footer (lgse/strata#2408, parked in tests/qa/fuzz/corpus/views).
[[action]]
name = "right"
weight = 3
steps = ['{"key":"Right","when":{"all":[{"view_mode":"Columns"},{"not":{"focused":"archive"}}]}}']

[[action]]
name = "open-folder"
weight = 3
steps = ['{"click":{"entry":"<folder>"},"count":2,"when":{"all":[{"present":{"entry":"<folder>"}},{"not":{"view_mode":"Columns"}}]}}']
choose.folder = ["documents", "pictures"]

[[action]]
name = "parent"
weight = 2
steps = ['{"key":"alt+Up","when":{"not":{"directory":"$root"}}}']

[[action]]
name = "back"
weight = 2
steps = ['{"key":"alt+Left","when":{"not":{"directory":"$root"}}}']
