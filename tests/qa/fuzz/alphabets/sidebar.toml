# The sidebar's alphabet (A3): what a user does to the sidebar and the header's toggle in
# Columns on the canonical fixture, by the keys, clicks, drags and menus GTK's sidebar and
# the Rune sidebar both take today: the width toggle by Ctrl+B and by its button, the
# built-in places reordered by drag, the rows' context menus by right-click and the Menu key,
# Unpin from them, and the keyboard walked into the sidebar, along it, up into the header and
# back down, between the rows and out to the files.
#
# What a replay can see of the sidebar is what it leaves in `settings.toml` (the width step,
# `sidebar_order`, `sidebar_show_*`), its menus (`app.menu`), and the files losing the
# keyboard to it and taking it back (`app.focused`, `app.panes[].focused`).
#
# Type to search is off (the header's `prefs`), so h, j, k and l are the arrows, as GTK reads
# them then.
#
# The keyboard comes in by Tab from the files to the header's toggle, then Down
# (`top_bar_navigation`): Left of the fixture's own column is its parent, /tmp, outside the
# fixture, so Left from the files never reaches the sidebar here.
#
# Left out, with why:
# - Return, Space and a click on a row: every built-in place (Home, Trash, Network, Desktop)
#   is outside the fixture, and opening one ends the replay. So is Return on a crumb that the
#   header's arrows reach.
# - Pins, the PINNED heading and its collapse: the bookmarks file is outside the fixture, and
#   no header key seeds it.
# - Empty Trash…: the Trash is outside the fixture and holds nothing a replay put there.
# - Ctrl+Shift+B, GTK's `focus_sidebar`: no command takes it on Rune yet.
# - The rows' other menu rows (Open in New Tab, Connect to server…, Customize…, Properties):
#   other packages' commands, inert on Rune, and opening a dialog or a tab outside the area.
# - Left from the files: see above.
# - A row dropped on itself: a click on it, which opens its place.
#
# Version 1 differed across the targets in 97 of 100 seeds (F4's round 1), on classes version 2
# leaves out, each with its finding (F4's round 2):
# - The reorder drags: a drag of a sidebar row moves Rune's keyboard to the sidebar where GTK's
#   stays in the files (lgse/strata#2646), and a drag across an open menu closes Rune's menu
#   where GTK's swallows the drag (lgse/strata#2406).
# - The toggle's click: the keyboard is on the header's button then, where GTK's Menu key opens
#   the selected entry's menu and Rune's nothing (lgse/strata#2647); Ctrl+B is kept, from the
#   files only, since with the keyboard on no entry it gives Rune's keyboard to the files
#   (lgse/strata#2648).
# - Tab, Shift+Tab and the arrows off the files: Shift+Tab from the files stops on the column's
#   header actions on GTK (lgse/strata#2379), and the header's arrow walk reaches other places
#   (lgse/strata#2649). So the keyboard stays in the files, and the sidebar is reached by the
#   pointer's menus.
# - Up and k off a column's first entry, which take GTK's keyboard to the column's header
#   actions (`owner.md`, A1 item 3; `columns` guards them so).
# - The Menu key off the files (lgse/strata#2647), and a right-click while a menu is open, which
#   opens the row's menu on Rune and only closes GTK's (lgse/strata#2644): each menu is
#   dismissed in the action that opens it.
# - Unpin: with the row's keyboard in it, Rune leaves no element with the keyboard
#   (lgse/strata#2406's open case).
# Version 2, F4's round 2 draft, never merged, met Shift+Up shrinking a range back to one
# folder, which opens its column on Rune and not on GTK (lgse/strata#2650); version 3 leaves the
# Shift moves out, which are the files' alphabets' and not the sidebar's.
area = "sidebar"
version = 3
about = "Columns on the canonical fixture, type to search off: the sidebar's width toggle by Ctrl+B from the files, the rows' and the files' context menus by right-click and the Menu key, dismissed, and the keyboard along the files' columns between"
header = '{"modes":["columns"],"prefs":{"type_to_search":false}}'

[[action]]
name = "toggle-key"
weight = 6
steps = ['{"key":"ctrl+b","when":{"all":[{"focused_in_matches":true},{"menu_items":null}]}}']

[[action]]
name = "down"
weight = 6
steps = ['{"key":"<key>","when":{"all":[{"focused_in_matches":true},{"menu_items":null}]}}']
choose.key = ["Down", "j"]

[[action]]
name = "up"
weight = 5
steps = ['{"key":"<key>","when":{"all":[{"focused_in_matches":true},{"not":{"focused":{"one_of":["archive","notes.txt","diagram.txt","fuzz-b.txt"]}}},{"menu_items":null}]}}']
choose.key = ["Up", "k"]

# Right opens a folder's column, and Left goes back to the parent's, never out of the fixture.
[[action]]
name = "sideways"
weight = 3
steps = ['{"key":"<key>","when":{"all":[{"focused_in_matches":true},{"menu_items":null}]}}']
choose.key = ["Right", "l"]

[[action]]
name = "back"
weight = 2
steps = ['{"key":"<key>","when":{"all":[{"focused_in_matches":true},{"not":{"directory":"$root"}},{"menu_items":null}]}}']
choose.key = ["Left", "h"]

# The files' menu by the Menu key, then dismissed.
[[action]]
name = "menu-key"
weight = 2
steps = [
  '{"key":"Menu","when":{"all":[{"focused_in_matches":true},{"menu_items":null}]}}',
  '{"key":"Escape","when":{"menu_items":{}}}',
]

# A row's menu by the pointer, then dismissed.
[[action]]
name = "right-click"
weight = 4
steps = [
  '{"click":{"sidebar":"<place>"},"button":3,"when":{"all":[{"present":{"sidebar":"<place>"}},{"menu_items":null}]}}',
  '{"key":"Escape","when":{"menu_items":{}}}',
]
choose.place = ["Home", "Trash", "Network", "Desktop"]
