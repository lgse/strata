# The menus, dialogs and keymap alphabet (A6): what a user does to open and act through
# context menus, modal dialogs, the shortcut reference and saved keybindings in Columns on the
# canonical fixture:
# - entry, multi-selection, background and sidebar context menus by right-click, Menu and
#   Shift+F10, with live keymap hints, Hidden Files, Refresh, New Folder, Move to Trash and
#   Escape;
# - structural aliases (`o` bound to `activate`, `Ctrl+[` bound to `escape`) and saved
#   keybindings (`Ctrl+E` bound to `rename` with `F2` unbound, `Ctrl+Shift+G` bound to
#   `actions.compress`), plus Escape at `Stage::Dismissal` (including from the header's
#   Appearance button outside the panes, lgse/strata#2411) and `Stage::ItemNavigation`
#   (closing the deepest column, lgse/strata#2426);
# - the Keyboard shortcuts reference (`F1` and the footer's `F1 Shortcuts` toggle button),
#   searched, word-edited, holding off `Ctrl+,`, reopened with its kept query selected, and
#   closed by `Escape` or `F1`;
# - Customize Folder and Customize File from entry, background and sidebar (`On::Place`)
#   menus, saving presets, resetting to the theme colour, choosing bundled icons, clearing
#   saved customizations, and carrying `settings.toml` customizations across rename, Move to
#   Trash and Undo;
# - the Compress dialog from the entry menu and `Ctrl+Shift+G`, creating deterministic `ZIP`
#   and `TAR` archives, refusing invalid archive names inline, and toggling format and
#   password protection (`Password protected` / `No password`);
# - the Connect to server dialog from the sidebar Network row's context menu, editing
#   addresses, cancelling (returning focus to the sidebar row), and opening fixture paths
#   (including re-opening the active folder).
#
# Type to search is off (`prefs`), so `h`, `j`, `k`, `l` and `o` act as navigation and
# structural aliases outside text fields while still typing inside dialog fields.
#
# Left out, with why:
# - Opening C21 submenus (`Open in…`, and `Actions` once A14 adds it): C21 mounts an open
#   submenu as a sibling `menu` surface on `Frame::layer` not read by `open_menu` or
#   `Target::MenuItem` (lgse/strata#2507).
# - Secondary press on another entry while a menu is open (Rune packet entry 49,
#   `secondary-press-scrim`), and secondary press on an open menu's own row
#   (lgse/strata#2451, `owner.md` A6 item 1): every menu-opening action guards
#   `menu_items: null`.
# - Clicking `Clear` in Customize before setting a colour or icon on that item: GTK marks
#   `Clear` insensitive while nothing is saved, whereas C15's secondary button stays enabled
#   (lgse/strata#2479); `customize-clear` sets an icon first so `Clear` is enabled on both.
# - Opening Customize's `Choose Emoji…` popover: GTK's built-in `GtkEmojiChooser` exposes an
#   unnamed internal `GtkSearchEntry` (`app.field.name = ""`), whereas C20d's `IconPicker`
#   names its search field `"Search"`.
# - Stacked second-level `dialog` layers (`Custom Folder Color` / `Custom File Color`, and
#   Compress's `Password required` / `Passwords do not match` danger notices): `open_dialog`
#   in `strata-qa` reads the first rendered `dialog` in pre-order, which on GTK's `GtkOverlay`
#   is the underlying dialog and on Rune (whose modal hides background layers from `presented`)
#   is the stacked dialog; covered by `customize-takes-focus-single-escape`, `customize/tests`
#   and `compress/tests`.
# - Creating password-protected `ZIP` or `7Z` archives on disk: encryption salts change the
#   output archive's SHA-256 content digest on every run.
# - "Run this program?" (`confirm_run_program` in `src/ui/browser/desktop.rs`): on GTK the
#   confirmation omits `close_on_escape` and `remember_modal_focus`, leaving `app.focused`
#   `null` on dismissal, whereas Rune's `StrataDialog` restores focus to the listing as F3's
#   `keyboard` invariant requires; covered by `executable-menu-confirmed-run` and
#   `executable-requires-confirmation`.
# - Submitting failing addresses in Connect to server: `MIN_CONNECTING` holds `"Connecting…"`
#   for 1 s, longer than `REST`'s 400 ms quiet window, so a failing attempt settles mid-spinner
#   and resolves during the next step; valid local paths and cancelled remote URIs settle at
#   once.
# - Toggling Hidden Files while focus sits on a file below `.hidden.txt`: GTK's `GtkListView`
#   keeps `has_focus()` on the recycled row slot while `GtkMultiSelection` follows the file
#   (`main` bug lgse/strata#2361); `background-menu-hidden` runs while a folder above
#   `.hidden.txt` has focus.
# - Properties (A17's), Settings and live keymap editing (A18's), Copy to / Move to / Extract to
#   floating choosers (A20's), Open With and custom actions (A14's), archive Quick Preview on
#   `Right` / `l` over `bundle.zip` or `bundle.tar` (A15's), and compression conflict /
#   progress / replace-undo flows (A13's).
#
# Version 1 was the first draft, never merged: its smoke tier caught `ReferenceState::open`
# leaving a kept query unselected on reopen (`footer/reference/state.rs`, fixed here) and
# `sidebar::menu::open` leaving focus in the file view when a sidebar row's menu opened
# (`sidebar/menu.rs`, fixed here), and met `Ctrl+Shift+M`'s `tenxer_mode` binding, GTK's
# `confirm_run_program` focus/Escape omission, and stacked-dialog `open_dialog` ordering.
# Version 2, never merged either, caught three more Rune parity bugs (all fixed here):
# `menus::open` not focusing/activating the right-clicked column when focus was in the sidebar
# or another column (`menus.rs`), `PointerMachine`'s secondary press inside a multi-selection
# not moving the cursor to the clicked entry (`collection/pointer/machine.rs`), and Compress's
# invalid-name refusal not selecting the rejected name (`compress.rs`), plus `Ctrl+Z` meeting
# `undo_archive` (A13's). Version 3 guarded `undo` while `bundle.zip` or `bundle.tar` exists,
# reaching 17 of 20 with the remaining 3 pressing `Right` / `l` on `bundle.zip` / `bundle.tar`
# (opening A15's Quick Preview on GTK). Version 4 keeps `Right` / `l` off created archives.
area = "menus"
version = 4
about = "Columns on the canonical fixture, type to search off, custom keymap (`o`, `Ctrl+[`, `Ctrl+E`, `Ctrl+Shift+G`): entry, multi-selection, background and sidebar context menus, Escape dismissal inside and outside panes, F1 Shortcut Reference and footer button, Customize Folder/File with presets, Clear and trash/rename/undo persistence, Compress archives and options, and Connect to server"
header = '{"modes":["columns"],"prefs":{"type_to_search":false,"keymap":{"default":{"activate":["Return","o"],"escape":["Escape","<Control>bracketleft"],"rename":["<Control>e"],"actions.compress":["<Control><Shift>g"]}}}}'

[[action]]
name = "down"
weight = 6
steps = ['{"key":"<key>","when":{"all":[{"focused_pane":true},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.key = ["Down", "j"]

[[action]]
name = "up"
weight = 4
steps = ['{"key":"<key>","when":{"all":[{"focused_pane":true},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null},{"not":{"focused":{"one_of":["archive","notes.txt","diagram.txt"]}}}]}}']
choose.key = ["Up", "k"]

[[action]]
name = "right"
weight = 4
steps = ['{"key":"<key>","when":{"all":[{"focused_pane":true},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null},{"not":{"focused":{"one_of":["archive","bundle.zip","bundle.tar"]}}}]}}']
choose.key = ["Right", "l"]

[[action]]
name = "left"
weight = 4
steps = ['{"key":"<key>","when":{"all":[{"focused_pane":true},{"not":{"directory":"$root"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.key = ["Left", "h"]

[[action]]
name = "click-entry"
weight = 5
steps = ['{"click":{"entry":"<entry>"},"when":{"all":[{"present":{"entry":"<entry>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.entry = ["documents", "pictures", "readme.md", "todo.txt", "notes.txt", "report.md", "photo.txt"]

[[action]]
name = "ctrl-click-entry"
weight = 3
steps = ['{"click":{"entry":"<entry>"},"mods":["ctrl"],"when":{"all":[{"present":{"entry":"<entry>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.entry = ["readme.md", "todo.txt", "notes.txt", "report.md"]

# `o` bound as a structural Enter alias opens focused folders in Columns.
[[action]]
name = "alias-open-folder"
weight = 4
steps = ['{"key":"o","when":{"all":[{"focused_pane":true},{"any":[{"focused":"documents"},{"focused":"pictures"}]},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']

# Escape and its `Ctrl+[` structural alias clear selection at `Stage::Dismissal` or close the
# deepest column at `Stage::ItemNavigation`.
[[action]]
name = "alias-escape"
weight = 4
steps = ['{"key":"<esc>","when":{"all":[{"focused_pane":true},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.esc = ["Escape", "ctrl+bracketleft"]

# Escape / `Ctrl+[` while focus is on the header's Appearance button clears the active column's
# selection without moving focus (lgse/strata#2411), then returns focus to an entry.
[[action]]
name = "header-escape"
weight = 3
steps = [
  '{"click":{"role":"toggle button","name":"Appearance"},"when":{"all":[{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"key":"Escape","when":{"present":{"role":"radio menu item","name":"Columns"}}}',
  '{"key":"<esc>","when":{"all":[{"not":{"focused_pane":true}},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"entry":"readme.md"},"when":{"all":[{"present":{"entry":"readme.md"}},{"not":{"dialog":true}},{"menu_items":null}]}}',
]
choose.esc = ["Escape", "ctrl+bracketleft"]

# `F2` was unbound in `prefs` when `rename` moved to `Ctrl+E`: pressing `F2` must not open an
# inline rename on either target.
[[action]]
name = "unbound-f2"
weight = 2
steps = ['{"key":"F2","when":{"all":[{"focused_in_matches":true},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']

# `Ctrl+E` opens inline rename (and carries saved customizations when committed on `todo.txt`),
# cancelled by `Escape` or `Ctrl+[` or committed and later renamed back.
[[action]]
name = "bound-rename-todo"
weight = 3
steps = [
  '{"click":{"entry":"todo.txt"},"when":{"all":[{"present":{"entry":"todo.txt"}},{"absent":{"entry":"todo-renamed.txt"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"key":"ctrl+e","when":{"all":[{"focused":"todo.txt"},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"type":"todo-renamed","when":{"field":{"name":"Rename","focused":true}}}',
  '{"key":"<end>","when":{"field":{"name":"Rename","focused":true}}}',
]
choose.end = ["Return", "Escape", "ctrl+bracketleft"]

[[action]]
name = "bound-rename-back"
weight = 2
steps = [
  '{"click":{"entry":"todo-renamed.txt"},"when":{"all":[{"present":{"entry":"todo-renamed.txt"}},{"absent":{"entry":"todo.txt"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"key":"ctrl+e","when":{"all":[{"focused":"todo-renamed.txt"},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"type":"todo","when":{"field":{"name":"Rename","focused":true}}}',
  '{"key":"Return","when":{"field":{"name":"Rename","focused":true}}}',
]

# Entry context menu by right-click, observed while open (`app.menu`), then dismissed.
[[action]]
name = "entry-menu-dismiss"
weight = 4
steps = [
  '{"click":{"entry":"<entry>"},"button":3,"when":{"all":[{"present":{"entry":"<entry>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"key":"Escape","when":{"menu_items":{}}}',
]
choose.entry = ["documents", "pictures", "readme.md", "todo.txt", "notes.txt"]

# Entry context menu by `Menu` or `Shift+F10` on the focused selection, observed then dismissed.
[[action]]
name = "menu-key-dismiss"
weight = 4
steps = [
  '{"key":"<key>","when":{"all":[{"focused_in_matches":true},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"key":"Escape","when":{"menu_items":{}}}',
]
choose.key = ["Menu", "shift+F10"]

# Multi-selection context menu (verifies no `Open` row on multi-selection, lgse/strata#2358).
[[action]]
name = "multi-selection-menu"
weight = 3
steps = [
  '{"click":{"entry":"readme.md"},"when":{"all":[{"present":{"entry":"readme.md"}},{"present":{"entry":"todo.txt"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"entry":"todo.txt"},"mods":["ctrl"],"when":{"all":[{"present":{"entry":"todo.txt"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"key":"<key>","when":{"all":[{"focused_in_matches":true},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"key":"Escape","when":{"menu_items":{}}}',
]
choose.key = ["Menu", "shift+F10"]

# Background context menu toggling Hidden Files while focus sits on a folder above `.hidden.txt`.
[[action]]
name = "background-menu-hidden"
weight = 2
steps = [
  '{"click":{"background":true,"dir":"$root"},"button":3,"when":{"all":[{"present":{"pane":"$root"}},{"any":[{"focused":"archive"},{"focused":"documents"},{"focused":"pictures"}]},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"<item>"},"when":{"present":{"menu_item":"<item>"}}}',
  '{"key":"Escape","when":{"menu_items":{}}}',
]
choose.item = ["Show Hidden Files", "Hide Hidden Files"]

# Background context menu Refresh.
[[action]]
name = "background-menu-refresh"
weight = 2
steps = [
  '{"click":{"background":true,"dir":"<dir>"},"button":3,"when":{"all":[{"present":{"pane":"<dir>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"Refresh"},"when":{"present":{"menu_item":"Refresh"}}}',
]
choose.dir = ["$root", "documents", "pictures"]

# Background context menu New Folder, cancelled by Escape or `Ctrl+[`.
[[action]]
name = "background-menu-new-folder"
weight = 2
steps = [
  '{"click":{"background":true,"dir":"<dir>"},"button":3,"when":{"all":[{"present":{"pane":"<dir>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"New Folder"},"when":{"present":{"menu_item":"New Folder"}}}',
  '{"type":"draft-folder","when":{"field":{"name":"Rename","focused":true}}}',
  '{"key":"<esc>","when":{"field":{"name":"Rename","focused":true}}}',
]
choose.dir = ["$root", "documents"]
choose.esc = ["Escape", "ctrl+bracketleft"]

# Sidebar context menu opened on built-in places, observed and dismissed (focus stays on the
# sidebar row), then returned to an entry when convenient.
[[action]]
name = "sidebar-menu-dismiss"
weight = 3
steps = [
  '{"click":{"sidebar":"<place>"},"button":3,"when":{"all":[{"present":{"sidebar":"<place>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"key":"Escape","when":{"menu_items":{}}}',
]
choose.place = ["Home", "Trash", "Network", "Desktop"]

# Move to Trash from the entry menu and `Ctrl+Z` undo (carrying saved customizations through
# `TrashedCustomizations`, #2504).
[[action]]
name = "menu-trash"
weight = 2
steps = [
  '{"click":{"entry":"<entry>"},"button":3,"when":{"all":[{"present":{"entry":"<entry>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"Move to Trash"},"when":{"present":{"menu_item":"Move to Trash"}}}',
]
choose.entry = ["todo.txt", "notes.txt"]

[[action]]
name = "undo"
weight = 3
steps = ['{"key":"ctrl+z","when":{"all":[{"file":{"path":"$fixture/bundle.zip","exists":false}},{"file":{"path":"$fixture/bundle.tar","exists":false}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']

# Keyboard shortcuts reference (`F1`), with search typing, `Ctrl+Left` word movement, `Ctrl+,`
# blocked inside the modal, reopen query-selection parity, and closed by `Escape` or `F1`.
[[action]]
name = "shortcut-reference"
weight = 4
steps = [
  '{"key":"F1","when":{"all":[{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"type":"<query>","when":{"field":{"name":"Search actions or keys…","focused":true}}}',
  '{"key":"ctrl+Left","when":{"field":{"name":"Search actions or keys…","focused":true}}}',
  '{"key":"ctrl+,","when":{"field":{"name":"Search actions or keys…","focused":true}}}',
  '{"key":"<close>","when":{"dialog":"Keyboard shortcuts"}}',
]
choose.close = ["Escape", "F1"]
choose.query = ["open tab", "rename", "compress", "escape"]

# Footer's `F1 Shortcuts` toggle button opening the reference and returning focus on close.
[[action]]
name = "footer-shortcuts-button"
weight = 3
steps = [
  '{"click":{"role":"toggle button","name":"F1 Shortcuts"},"when":{"all":[{"present":{"role":"toggle button","name":"F1 Shortcuts"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"key":"<close>","when":{"dialog":"Keyboard shortcuts"}}',
  '{"click":{"entry":"readme.md"},"when":{"all":[{"present":{"entry":"readme.md"}},{"not":{"dialog":true}},{"menu_items":null}]}}',
]
choose.close = ["Escape", "F1"]

# Customize Folder / Customize File from the entry menu: saves preset colours and bundled icons
# in `settings.toml`.
[[action]]
name = "customize-entry"
weight = 4
steps = [
  '{"click":{"entry":"<entry>"},"button":3,"when":{"all":[{"present":{"entry":"<entry>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"Customize…"},"when":{"present":{"menu_item":"Customize…"}}}',
  '{"click":{"role":"button","name":"<color>","within":{"dialog":true}},"when":{"dialog":true}}',
  '{"click":{"dialog_button":"<icon>"},"when":{"dialog":true}}',
  '{"click":{"dialog_button":"Done"},"when":{"dialog":true}}',
]
choose.color = ["Red", "Orange", "Yellow", "Green", "Blue", "Purple", "Gray"]
choose.entry = ["documents", "pictures", "readme.md", "todo.txt"]
choose.icon = ["Documents", "Code", "Archive", "Pictures", "Terminal", "Pinned", "Tasks"]

# Sets an icon first so `Clear` is enabled on both targets (lgse/strata#2479), then clears.
[[action]]
name = "customize-clear"
weight = 3
steps = [
  '{"click":{"entry":"<entry>"},"button":3,"when":{"all":[{"present":{"entry":"<entry>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"Customize…"},"when":{"present":{"menu_item":"Customize…"}}}',
  '{"click":{"dialog_button":"Code"},"when":{"dialog":true}}',
  '{"click":{"dialog_button":"Clear"},"when":{"dialog":true}}',
  '{"click":{"dialog_button":"Done"},"when":{"dialog":true}}',
]
choose.entry = ["documents", "pictures", "readme.md", "todo.txt"]

# Customize Folder from the background menu (including ancestor columns).
[[action]]
name = "customize-background"
weight = 2
steps = [
  '{"click":{"background":true,"dir":"<dir>"},"button":3,"when":{"all":[{"present":{"pane":"<dir>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"Customize…"},"when":{"present":{"menu_item":"Customize…"}}}',
  '{"click":{"role":"button","name":"<color>","within":{"dialog":true}},"when":{"dialog":true}}',
  '{"key":"Escape","when":{"dialog":true}}',
]
choose.color = ["Green", "Purple", "Default (Theme color)"]
choose.dir = ["$root", "documents"]

# Customize Folder from a sidebar place row (`commands::On::Place`), returning focus to the row.
[[action]]
name = "customize-sidebar"
weight = 2
steps = [
  '{"click":{"sidebar":"<place>"},"button":3,"when":{"all":[{"present":{"sidebar":"<place>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"Customize…"},"when":{"present":{"menu_item":"Customize…"}}}',
  '{"click":{"dialog_button":"Pinned"},"when":{"dialog":true}}',
  '{"click":{"dialog_button":"<finish>"},"when":{"dialog":true}}',
  '{"click":{"dialog_button":"Done"},"when":{"dialog":true}}',
]
choose.finish = ["Done", "Clear"]
choose.place = ["Home", "Desktop"]

# Compress dialog from the entry menu: creates deterministic unencrypted `bundle.zip` or
# `bundle.tar` on pinned-mtime fixture items when the destination name is free.
[[action]]
name = "compress-create"
weight = 3
steps = [
  '{"click":{"entry":"<entry>"},"button":3,"when":{"all":[{"present":{"entry":"<entry>"}},{"file":{"path":"$fixture/bundle.zip","exists":false}},{"file":{"path":"$fixture/bundle.tar","exists":false}},{"directory":"$root"},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"Compress…"},"when":{"present":{"menu_item":"Compress…"}}}',
  '{"click":{"role":"toggle button","name":"<format>"},"when":{"present":{"role":"toggle button","name":"<format>"}}}',
  '{"click":{"role":"text","name":"Archive name"},"when":{"present":{"role":"text","name":"Archive name"}}}',
  '{"key":"ctrl+a","when":{"field":{"name":"Archive name","focused":true}}}',
  '{"type":"bundle","when":{"field":{"name":"Archive name","focused":true}}}',
  '{"key":"Return","when":{"field":{"name":"Archive name","focused":true}}}',
]
choose.entry = ["readme.md", "documents"]
choose.format = ["ZIP", "TAR"]

[[action]]
name = "remove-bundle"
weight = 2
steps = ['{"fs":{"path":"<archive>","remove":true},"when":{"all":[{"file":{"path":"$fixture/<archive>","exists":true}},{"not":{"focused":"<archive>"}},{"not":{"all_selected":{"contains":["<archive>"]}}}]}}']
choose.archive = ["bundle.zip", "bundle.tar"]

# Compress dialog opened by `Ctrl+Shift+G` (`ACTIONS_COMPRESS` at `Stage::DirectCommands`),
# refusing an invalid archive name inline and closing cleanly.
[[action]]
name = "compress-invalid-name"
weight = 3
steps = [
  '{"key":"ctrl+shift+g","when":{"all":[{"focused_in_matches":true},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"key":"ctrl+a","when":{"field":{"name":"Archive name","focused":true}}}',
  '{"type":"<invalid>","when":{"field":{"name":"Archive name","focused":true}}}',
  '{"key":"Return","when":{"field":{"name":"Archive name","focused":true}}}',
  '{"key":"Escape","when":{"dialog":true}}',
]
choose.invalid = ["../escape", "sub/archive", "."]

# Compress format and password-protection toggles (`ZIP`, `7Z`, `Password protected` ->
# `No password`, `TAR.GZ`) and cancelling via `Cancel` or `Escape`.
[[action]]
name = "compress-password-options"
weight = 3
steps = [
  '{"click":{"entry":"readme.md"},"button":3,"when":{"all":[{"present":{"entry":"readme.md"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"Compress…"},"when":{"present":{"menu_item":"Compress…"}}}',
  '{"click":{"role":"toggle button","name":"<format>"},"when":{"present":{"role":"toggle button","name":"<format>"}}}',
  '{"click":{"role":"toggle button","name":"Password protected"},"when":{"present":{"role":"toggle button","name":"Password protected"}}}',
  '{"click":{"role":"password text","name":"Password"},"when":{"present":{"role":"password text","name":"Password"}}}',
  '{"type":"secret","when":{"dialog":true}}',
  '{"click":{"role":"toggle button","name":"No password"},"when":{"present":{"role":"toggle button","name":"No password"}}}',
  '{"click":{"dialog_button":"Cancel"},"when":{"dialog":true}}',
]
choose.format = ["ZIP", "7Z"]

# Connect to server from the sidebar Network row: edits a remote URI and cancels (returning
# focus to the Network sidebar row).
[[action]]
name = "connect-server-cancel"
weight = 3
steps = [
  '{"click":{"sidebar":"Network"},"button":3,"when":{"all":[{"present":{"sidebar":"Network"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"Connect to server…"},"when":{"present":{"menu_item":"Connect to server…"}}}',
  '{"type":"<uri>","when":{"field":{"name":"Server address","focused":true}}}',
  '{"key":"ctrl+a","when":{"field":{"name":"Server address","focused":true}}}',
  '{"click":{"dialog_button":"Cancel"},"when":{"dialog":"Connect to server"}}',
]
choose.uri = ["smb://nas/share", "sftp://host/home"]

# Connect to server opening a fixture folder (including re-opening the active location),
# transferring focus back to the files.
[[action]]
name = "connect-server-open"
weight = 3
steps = [
  '{"click":{"sidebar":"Network"},"button":3,"when":{"all":[{"present":{"sidebar":"Network"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"Connect to server…"},"when":{"present":{"menu_item":"Connect to server…"}}}',
  '{"type":"<path>","when":{"field":{"name":"Server address","focused":true}}}',
  '{"key":"Return","when":{"field":{"name":"Server address","focused":true}}}',
