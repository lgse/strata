# The session host's drops from another process (F5): content another application drags into
# the List view on the canonical fixture, with Rune's replays in a real window in a private
# headless sway (`host = "session"`) and GTK's on Xvfb. The source is the runner's own
# (`tests/qa/foreign_drag_source.py`), as the `content_drops` scenarios start it, on each
# target's display: a GTK window on X11 for GTK, a native Wayland one beside the window on sway
# for Rune, so the drag crosses each display's data device.
# - text offered as content, dropped onto a folder of the fixture's root or an `inner` folder
#   made inside `documents` or `pictures`, which saves it there
#   as a new file (`dropped text.txt`, a numbered name when it is taken), onto the background of
#   whatever folder is shown, subfolders included, or onto the root's crumb;
# - a file offered by its path, dropped onto a folder of the root, which copies it there, and
#   dropped again where its name is taken, which asks "File already exists", answered with
#   Keep Both or Replace, or dismissed;
# - folders opened in place (single-click activation), the parent and Back, clicks on files, a
#   new tab and the next one, undo, and a file made and removed behind the application's back.
#
# Each drop is one action: the offer written to the run's environment, the source started and
# named `foreign`, the drag from it, the wait for the source to hear the drag end ("Foreign drag
# finished", which a refused drop reports too, and a copied file), and the source stopped. The
# source and the drag share one guard; the wait and the stop take none, since the replay skips
# them when no source runs, so an action its guard skips skips whole. (A guard on them goes
# stale: a drop changes what it read, as a file drop takes the name, or a tab's folder shows.)
# A shrunk sequence that keeps a drag without its source has the drag refused on both targets
# alike.
#
# Starting the source takes the X focus from GTK's window on the window-manager-less Xvfb,
# which nothing gives back, so GTK reports no focus after a sequence's first drop and
# lgse/strata#2595's `toolkit` rules excuse it, by the owner's ruling of 2026-11-20: this
# alphabet compares no focus after its first drop, and still compares the files created, names,
# contents, selection and directory.
#
# Left out, with why:
# - An image offered as content. GTK saves it as GDK encodes the texture it decodes
#   (`texture.save_to_png_bytes`), Rune a PNG's bytes as offered, so the two files differ in
#   their bytes with the same pixels (lgse/strata#2645). `foreign-content-saves-new-files`'
#   `image` runs hold the saved picture on both targets.
# - Folders offered by path, and a move-only offer (`foreign-folder-drags-validate`): a move
#   asks the source to delete, which it reports otherwise. A later version.
# - Links and web addresses offered as content: they need the runner's image server (`http`),
#   which a sequence does not start yet.
# - Drops onto the sidebar, and onto a crumb above the root: their places are outside the
#   fixture (`content_drops` covers the sidebar as a scenario).
# - Drops onto a tab: onto one not shown, Rune selects it and saves there and GTK saves nothing
#   (lgse/strata#2668); `foreign-content-reaches-every-drop-target`' `tab` runs drop onto the
#   tab shown on both targets.
# - Escape during the drag and modifiers changed during it: wlroots' drag grab gives no client
#   a key then (A19.md, "Open").
# Version 1 was F5's draft, never merged: it dropped PNG content too, which met
# lgse/strata#2645 in 19 of its 20 smoke seeds. Version 2 ran about one drop in four: the
# background drop chose among three folders, and a skipped drop's wait was refused for want of
# a source (#2656's review). Version 3, a draft too, dropped into the folder shown and guarded
# the wait and the stop with the drop's whole guard, which a file drop changes, so a source
# stayed running into the next drop's. Version 4 guards them with what the drop leaves as it
# was, and drops onto an `inner` folder made away from the root. Version 5, with the replay
# skipping a wait or a stop that finds no source running, weighs the way back to the root and
# the inner folders more, where the folder rows' drops run. Version 6 keeps tab drops off a
# tab of the folder shown (lgse/strata#2668, met by version 5 in 4 of 20 seeds). Version 7
# leaves tab drops out, as version 6 met #2668 onto a tab of another folder, and leaves the
# wait and the stop unguarded, as a tab drop's guard went stale and kept a source running.
area = "session-drops"
version = 7
about = "List on the canonical fixture through the compositor (Rune on the session host): text dragged from another process onto the root's folders, the folder shown, folders made away from the root and the root's crumb, a file offered by path copied onto a folder and its name conflict answered, folders opened in place, tabs, the parent and Back, clicks on files, undo, and a file made and removed behind the application's back"
header = '{"modes":["list"],"session_bus":true,"prefs":{"type_to_search":false,"single_click_previews":false,"explorer_folder_clicks":1,"explorer_file_clicks":2}}'
host = "session"

[[action]]
name = "drop-text-onto-folder"
weight = 6
steps = [
  '{"fs":{"path":"$environment/offer.txt","write":"Selected words\nsecond line"}}',
  '{"foreign":{"offers":[{"mime":"text/plain;charset=utf-8","path":"$environment/offer.txt"}]},"as":"foreign","when":{"all":[{"directory":"$root"},{"present":{"entry":"<folder>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"drag":{"from":{"kept":"foreign"},"to":{"entry":"<folder>"}},"when":{"all":[{"directory":"$root"},{"present":{"entry":"<folder>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"foreign_label":"Foreign drag finished"}',
  '{"foreign_stop":true}',
]
choose.folder = ["archive", "documents", "pictures"]

# The background of whatever folder is shown, subfolders included: the folders the walk shows
# hold at most six rows and the saved files a few more, so the point stays blank.
[[action]]
name = "drop-text-into-shown-folder"
weight = 5
steps = [
  '{"fs":{"path":"$environment/offer.txt","write":"Selected words\nsecond line"}}',
  '{"foreign":{"offers":[{"mime":"text/plain;charset=utf-8","path":"$environment/offer.txt"}]},"as":"foreign","when":{"all":[{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"drag":{"from":{"kept":"foreign"},"to":{"pane":null},"to_at":["50%",-60]},"when":{"all":[{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"foreign_label":"Foreign drag finished"}',
  '{"foreign_stop":true}',
]

# The root's crumb in the location bar, as `foreign-content-reaches-every-drop-target` drops
# on it: it saves into the root from any folder of the fixture.
[[action]]
name = "drop-text-onto-root-crumb"
weight = 2
steps = [
  '{"fs":{"path":"$environment/offer.txt","write":"Selected words\nsecond line"}}',
  '{"foreign":{"offers":[{"mime":"text/plain;charset=utf-8","path":"$environment/offer.txt"}]},"as":"foreign","when":{"all":[{"present":{"role":"button","name":"$root"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"drag":{"from":{"kept":"foreign"},"to":{"role":"button","name":"$root"},"to_at":["90%","50%"]},"when":{"all":[{"present":{"role":"button","name":"$root"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"foreign_label":"Foreign drag finished"}',
  '{"foreign_stop":true}',
]

# A file offered by its path, copied onto a folder where its name is free.
[[action]]
name = "drop-file-onto-folder"
weight = 4
steps = [
  '{"fs":{"path":"$environment/offer-file.txt","write":"offered file\n"}}',
  '{"foreign":{"paths":["$environment/offer-file.txt"]},"as":"foreign","when":{"all":[{"directory":"$root"},{"present":{"entry":"<folder>"}},{"file":{"path":"$fixture/<folder>/offer-file.txt","exists":false}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"drag":{"from":{"kept":"foreign"},"to":{"entry":"<folder>"}},"when":{"all":[{"directory":"$root"},{"present":{"entry":"<folder>"}},{"file":{"path":"$fixture/<folder>/offer-file.txt","exists":false}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"foreign_label":"Foreign drag finished"}',
  '{"foreign_stop":true}',
]
choose.folder = ["archive", "documents", "pictures"]

# The same where its name is taken: "File already exists" stays open after the drop.
[[action]]
name = "drop-file-where-taken"
weight = 3
steps = [
  '{"fs":{"path":"$environment/offer-file.txt","write":"offered file\n"}}',
  '{"foreign":{"paths":["$environment/offer-file.txt"]},"as":"foreign","when":{"all":[{"directory":"$root"},{"present":{"entry":"<folder>"}},{"file":{"path":"$fixture/<folder>/offer-file.txt","exists":true}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"drag":{"from":{"kept":"foreign"},"to":{"entry":"<folder>"}},"when":{"all":[{"directory":"$root"},{"present":{"entry":"<folder>"}},{"file":{"path":"$fixture/<folder>/offer-file.txt","exists":true}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"foreign_label":"Foreign drag finished"}',
  '{"foreign_stop":true}',
]
choose.folder = ["archive", "documents", "pictures"]

[[action]]
name = "answer-conflict"
weight = 3
steps = [
  '{"click":{"dialog_button":"<choice>"},"when":{"present":{"dialog_button":"<choice>"}}}',
]
choose.choice = ["Keep Both", "Replace"]

# A folder made inside `documents` or `pictures` behind the application's back, for drops
# onto a folder row away from the root.
[[action]]
name = "make-inner-folder"
weight = 3
steps = ['{"fs":{"path":"<folder>/inner","mkdir":true},"when":{"file":{"path":"$fixture/<folder>/inner","exists":false}}}']
choose.folder = ["documents", "pictures"]

[[action]]
name = "drop-text-onto-inner-folder"
weight = 4
steps = [
  '{"fs":{"path":"$environment/offer.txt","write":"Selected words\nsecond line"}}',
  '{"foreign":{"offers":[{"mime":"text/plain;charset=utf-8","path":"$environment/offer.txt"}]},"as":"foreign","when":{"all":[{"present":{"entry":"inner"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"drag":{"from":{"kept":"foreign"},"to":{"entry":"inner"}},"when":{"all":[{"present":{"entry":"inner"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"foreign_label":"Foreign drag finished"}',
  '{"foreign_stop":true}',
]

# Opens the folder in place: single-click activation.
[[action]]
name = "open-folder"
weight = 3
steps = ['{"click":{"entry":"<folder>"},"when":{"all":[{"present":{"entry":"<folder>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.folder = ["archive", "documents", "pictures", "inner"]

[[action]]
name = "click-file"
weight = 3
steps = ['{"click":{"entry":"<file>"},"when":{"all":[{"present":{"entry":"<file>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.file = ["readme.md", "todo.txt", "notes.txt", "photo.txt", "dropped text.txt"]

[[action]]
name = "new-tab"
weight = 3
steps = ['{"key":"ctrl+t","when":{"all":[{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']

[[action]]
name = "next-tab"
weight = 2
steps = ['{"key":"ctrl+Tab","when":{"all":[{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']

[[action]]
name = "undo"
weight = 2
steps = ['{"key":"ctrl+z","when":{"all":[{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']

[[action]]
name = "dismiss"
weight = 1
steps = ['{"key":"Escape","when":{"any":[{"dialog":true},{"menu_items":{}}]}}']

# The parent of the fixture's own folder is /tmp, which holds other runs' folders: the parent
# and Back stay inside the fixture.
[[action]]
name = "back"
weight = 6
steps = ['{"key":"<key>","when":{"all":[{"not":{"directory":"$root"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.key = ["alt+Left", "alt+Up"]

[[action]]
name = "write"
weight = 1
steps = ['{"fs":{"path":"fuzz-a.txt","write":"fuzz\n"},"when":{"file":{"path":"$fixture/fuzz-a.txt","exists":false}}}']

[[action]]
name = "remove"
weight = 1
steps = ['{"fs":{"path":"fuzz-a.txt","remove":true},"when":{"file":{"path":"$fixture/fuzz-a.txt","exists":true}}}']
