# The pointer alphabet (A9): what a user does with the pointer in the List view on the
# canonical fixture under single-click folder activation (`explorer_folder_clicks = 1`):
# - single clicks that open a folder in place (`ClickModes`, `click_modes`);
# - single, Ctrl and Shift clicks on files and folders, a slow second click on the same file
#   (`two-slow-clicks-do-not-open`), and clicks on the pane's empty space below its rows;
# - marquee drags begun on that empty space or on a row's blank name-column space
#   (`empty-name-space-drag-starts-marquee`), ending on an entry by name;
# - the context menu by the pointer, then dismissed; Escape, Back and the parent; and a file
#   made and removed behind the application's back while the pointer selects.
#
# Type to search and single-click previews are off (`prefs`), so a file click opens no preview
# drawer (A15's). Files keep double-click activation.
#
# Left out, with why:
# - The keyboard's cursor moves: arrows, j and k, and their Shift extensions. After a marquee
#   GTK's next arrow starts from the entry the band reached last, not from the row it reports
#   focused (lgse/strata#2552, `oracle`; a return to the folder or a reload after a marquee
#   meets it too, and those sequences are parked). Up off a folder's first row takes GTK's
#   keyboard to the pane header (`list.toml`), and Down on its last row with nothing selected
#   selects the cursor's entry on GTK and does nothing on Rune (lgse/strata#2414, with the
#   owner). The keyboard's own alphabets are `list`, `icons` and `views`.
# - The folder-click choice switched in Settings (`click-mode-preference-live`), and so the
#   double clicks that open a folder once it is Double: GTK's Settings is a window of its own,
#   which the snapshot does not report, and Rune's a dialog over the browser (`app.dialog`
#   `null` against `"Settings"`); Settings is A18's, and its own alphabet's.
# - A double click, or a single click in single-click file mode, on a file: with no default
#   application in the test image it opens Open With (A14's), which takes the keyboard.
# - A double click on a folder under single-click activation: the first click opens the folder
#   in place, so the second lands wherever that folder's listing puts a row under the pointer,
#   a point tied to one toolkit's row heights.
# - `archive`, the fixture's one empty folder, as `list.toml` gives: GTK lost Back and the
#   parent there in the List walk.
# - Row drags onto folders and between panes (`pointer_intent`, A19's), and the drag thresholds
#   and modifiers of a press-and-drag on a row.
# - Middle-click autoscroll and the wheel (`popover_scrolling`, `marquee_scrolling`): the
#   fixture's folders hold at most six rows, so nothing scrolls, and the observation does not
#   hold the scroll position or the autoscroll shield.
#
# Versions 1 and 2 were A9's drafts, never merged: version 1 met GTK's Settings window
# (`app.dialog`), lgse/strata#2414 on Down off a last row, lgse/strata#2551 (fixed) on a
# Shift+click after a folder's load, and lgse/strata#2552 on arrows after a marquee; version 2
# met name-space drags from a selected row moving it (A19's) and a deselecting Ctrl+click
# (as in lgse/strata#2353). Version 3 sends no keyboard cursor moves, and guards both. Its
# menu's Escape, guarded on a Rename row, left a menu over several selected entries open, and
# every later action needs no menu, so the rest of a sequence was skipped (F5's review of
# lgse/strata#2637: seed 0x06 had a menu open for 24 of its 48 observations). Version 4
# dismisses any menu, as `chooser` and `session-pointer` v3 do. Version 5 sends no Shift+click
# after a band, by the owner's ruling of 2026-11-20 (lgse/strata#2667).
area = "pointer"
version = 5
about = "List on the canonical fixture with single-click folder activation, type to search and single-click previews off: folder clicks that open in place, single, Ctrl, Shift and slow second clicks, background clicks, marquee drags from blank pane and name-column space, the context menu by the pointer, Escape, Back and the parent, and a file made and removed behind the application's back"
header = '{"modes":["list"],"prefs":{"type_to_search":false,"single_click_previews":false,"explorer_folder_clicks":1,"explorer_file_clicks":2}}'

# Opens the folder in place: single-click activation.
[[action]]
name = "click-folder"
weight = 6
steps = ['{"click":{"entry":"<folder>"},"when":{"all":[{"present":{"entry":"<folder>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.folder = ["documents", "pictures"]

[[action]]
name = "click-file"
weight = 6
steps = ['{"click":{"entry":"<file>"},"when":{"all":[{"present":{"entry":"<file>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.file = ["readme.md", "todo.txt", "fuzz-a.txt", "notes.txt", "report.md", "spreadsheet.csv", "diagram.txt", "photo.txt"]

# A Ctrl+click adds an entry, a folder too, without opening it. Only one not selected: a
# Ctrl+click that takes an entry out leaves GTK's browser cursor on the entry before it while
# its keyboard focus moves to the clicked row (`pointer_selection`, as in lgse/strata#2353).
[[action]]
name = "ctrl-click"
weight = 4
steps = ['{"click":{"entry":"<entry>"},"mods":["ctrl"],"when":{"all":[{"present":{"entry":"<entry>"}},{"not":{"all_selected":{"contains":["<entry>"]}}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.entry = ["documents", "pictures", "readme.md", "todo.txt", "notes.txt", "report.md", "diagram.txt", "photo.txt"]

# A Shift+click ranges from the anchor, or selects the entry alone where there is none, as
# after a folder's load; a folder too, without opening it.
# A Shift+click only where nothing is selected or the focused entry is: after a click or a
# Ctrl+click, not after a band, which leaves the focus where it was. A marquee leaves no Shift
# anchor on Rune, where GTK's band makes its first entry one, a ruled deviation
# (lgse/strata#2667, owner.md, 2026-11-20). A band over the focused row still reaches it.
[[action]]
name = "shift-click"
weight = 4
steps = ['{"click":{"entry":"<entry>"},"mods":["shift"],"when":{"all":[{"present":{"entry":"<entry>"}},{"any":[{"selected":[]},{"all":[{"focused":"archive"},{"all_selected":{"contains":["archive"]}}]},{"all":[{"focused":"documents"},{"all_selected":{"contains":["documents"]}}]},{"all":[{"focused":"pictures"},{"all_selected":{"contains":["pictures"]}}]},{"all":[{"focused":"readme.md"},{"all_selected":{"contains":["readme.md"]}}]},{"all":[{"focused":"todo.txt"},{"all_selected":{"contains":["todo.txt"]}}]},{"all":[{"focused":"fuzz-a.txt"},{"all_selected":{"contains":["fuzz-a.txt"]}}]},{"all":[{"focused":"notes.txt"},{"all_selected":{"contains":["notes.txt"]}}]},{"all":[{"focused":"report.md"},{"all_selected":{"contains":["report.md"]}}]},{"all":[{"focused":"spreadsheet.csv"},{"all_selected":{"contains":["spreadsheet.csv"]}}]},{"all":[{"focused":"diagram.txt"},{"all_selected":{"contains":["diagram.txt"]}}]},{"all":[{"focused":"photo.txt"},{"all_selected":{"contains":["photo.txt"]}}]}]},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.entry = ["documents", "pictures", "readme.md", "todo.txt", "notes.txt", "report.md", "diagram.txt", "photo.txt"]

# Two clicks on one file further apart than the double-click interval: two single clicks, so
# the file stays selected and nothing opens. A rename the second click might start is
# cancelled.
[[action]]
name = "slow-second-click"
weight = 3
steps = [
  '{"click":{"entry":"<file>"},"when":{"all":[{"present":{"entry":"<file>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"sleep":600}',
  '{"click":{"entry":"<file>"},"when":{"all":[{"present":{"entry":"<file>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"key":"Escape","when":{"field":{"name":"Rename"}}}',
]
choose.file = ["readme.md", "todo.txt", "notes.txt", "photo.txt"]

# The pane's empty space below its rows, as `background-click-clears-selection` makes it: the
# folders the walk shows hold at most six rows, so the point is blank on both targets.
[[action]]
name = "click-background"
weight = 3
steps = ['{"click":{"pane":"<pane>"},"at":["50%",-60],"when":{"all":[{"directory":"<pane>"},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.pane = ["$root", "documents", "pictures"]

# A marquee from the pane's empty space up to an entry, as `background-press-clears-before-drag`
# draws it.
[[action]]
name = "marquee-from-background"
weight = 5
steps = ['{"drag":{"from":{"pane":"<pane>"},"from_at":["50%",-60],"to":{"entry":"<entry>"}},"when":{"all":[{"directory":"<pane>"},{"present":{"entry":"<entry>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.pane = ["$root", "documents", "pictures"]
choose.entry = ["documents", "pictures", "readme.md", "todo.txt", "notes.txt", "report.md", "spreadsheet.csv", "diagram.txt", "photo.txt"]

# A marquee from a row's blank name-column space to another entry, as
# `empty-name-space-drag-starts-marquee` draws it: no row moves. Only from a row not selected:
# blank space on a selected row drags the selection, and GTK drops it on the folder under the
# release where Rune does not yet (`pointer_intent`, A19's).
[[action]]
name = "marquee-from-name-space"
weight = 5
steps = ['{"drag":{"from":{"entry":"<from>","part":"label"},"from_at":["2/3","50%"],"to":{"entry":"<to>"}},"when":{"all":[{"present":{"entry":"<from>"}},{"not":{"all_selected":{"contains":["<from>"]}}},{"present":{"entry":"<to>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.from = ["todo.txt", "readme.md", "notes.txt", "photo.txt"]
choose.to = ["documents", "pictures", "report.md", "spreadsheet.csv", "diagram.txt"]

[[action]]
name = "menu-dismiss"
weight = 2
steps = [
  '{"click":{"entry":"<entry>"},"button":3,"when":{"all":[{"present":{"entry":"<entry>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"key":"Escape","when":{"menu_items":{}}}',
]
choose.entry = ["documents", "readme.md", "todo.txt", "notes.txt", "diagram.txt"]

[[action]]
name = "escape"
weight = 2
steps = ['{"key":"Escape","when":{"all":[{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']

# The parent of the fixture's own folder is /tmp, which holds other runs' folders: the parent
# and Back stay inside the fixture.
[[action]]
name = "back"
weight = 3
steps = ['{"key":"<key>","when":{"all":[{"not":{"directory":"$root"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.key = ["alt+Left", "alt+Up"]

# `fuzz-a.txt` lists after the root's folders, so it is never a folder's first row, nor its
# last, which `todo.txt` is.
[[action]]
name = "write"
weight = 1
steps = ['{"fs":{"path":"fuzz-a.txt","write":"fuzz\n"},"when":{"file":{"path":"$fixture/fuzz-a.txt","exists":false}}}']

[[action]]
name = "remove"
weight = 1
steps = ['{"fs":{"path":"fuzz-a.txt","remove":true},"when":{"file":{"path":"$fixture/fuzz-a.txt","exists":true}}}']
