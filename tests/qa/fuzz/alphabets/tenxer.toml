# 10xer mode's alphabet (A11): what a user does with 10xer's keys in a List view on the
# canonical fixture, by the keys GTK's 10xer mode and Rune's both take today.
#
# Type to search and single-click previews are off (the header's `prefs`), as 10xer's own
# scenarios have them.
#
# Left out, with why:
# - `d`, `D`, `x`, `y`, `p` and `P`: they trash, delete, cut and paste the fixture's named
#   entries, which later steps look for. Their confirmations and refusals are the
#   `tenxer-d-*` and paste scenarios'.
# - `i` and `l` on a file: they open the preview drawer, which is A15's and its own
#   alphabet's (`preview`).
# - Reload over an empty listing (a filter that matched nothing): there GTK's two replays of
#   one sequence left the keyboard in the pane or nowhere, at random (version 1's calibration;
#   shrunk to 9 steps, it confirmed 0 of 3, so noise and no finding).
# - Committing the `f` filter: after its Return GTK's listing has no cursor, and Space selects
#   nothing (lgse/strata#2586, `oracle`; version 2's smoke tier, parked in
#   `tests/qa/fuzz/corpus/tenxer`). The filter is typed, and abandoned by Escape.
# - `h` out of a folder with entries selected: a walk back into it restores the selection, and
#   GTK's first 10xer move there drops it where Rune's keeps it (lgse/strata#2587, `oracle` by
#   the owner's ruling of 2026-11-17; version 3's smoke tier, parked). `h` leaves only a folder
#   with nothing selected, so a revisit restores none: version 4 left `h` out altogether.
# - `i` on a filter's result folder: GTK peeks it and Rune does not yet (A11's Open, "The
#   keyboard peek of a search result"), so the Escape after it lands differently.
# - `archive`: the fixture's empty folder, where the List alphabet saw GTK lose the parent
#   key (`list.toml`).
# - The chords that leave the fixture or open other windows: `g` places, `t` tabs, `;`
#   actions, `c` copies to the clipboard. They have their scenarios.
area = "tenxer"
version = 5
about = "10xer mode in List on the canonical fixture: j and k, gg and G, Space, Invert and Select All, / find with Enter or Escape over a selection, n and N, i folder peeks and Reload with one open, l and h into and out of folders, the f filter typed and abandoned, sort chords, hidden files, and files made and removed behind the application's back"
header = '{"modes":["list"],"prefs":{"tenxer_mode":true,"type_to_search":false,"single_click_previews":false}}'

[[action]]
name = "move"
weight = 10
steps = ['{"key":"<key>"}']
choose.key = ["j", "k", "Down", "Up"]

[[action]]
name = "first"
weight = 2
steps = ['{"key":"g"}', '{"key":"g"}']

[[action]]
name = "last"
weight = 2
steps = ['{"key":"shift+g"}']

[[action]]
name = "select"
weight = 5
steps = ['{"key":"space"}']

[[action]]
name = "invert"
weight = 1
steps = ['{"key":"ctrl+r"}']

[[action]]
name = "select-all"
weight = 1
steps = ['{"key":"ctrl+a"}']

[[action]]
name = "escape"
weight = 4
steps = ['{"key":"Escape"}']

# A find committed: the cursor moves to the next match, and the matches stay highlighted
# until an Escape.
[[action]]
name = "find"
weight = 3
steps = ['{"key":"slash"}', '{"type":"<query>"}', '{"key":"Return"}']
choose.query = ["re", "o", "do", "zz"]

# A selection, then a find abandoned by Escape: the prompt goes, and the selection stays.
[[action]]
name = "find-abandoned"
weight = 3
steps = ['{"key":"space"}', '{"key":"slash"}', '{"type":"<query>"}', '{"key":"Escape"}']
choose.query = ["re", "pic"]

[[action]]
name = "repeat"
weight = 3
steps = ['{"key":"<key>"}']
choose.key = ["n", "shift+n"]

# A folder's peek in List, from the keyboard; not over a filter's results (see above).
[[action]]
name = "peek"
weight = 3
steps = ['{"key":"i","when":{"all":[{"any":[{"focused":"documents"},{"focused":"pictures"}]},{"not":{"present":{"role":"label","name_matches":"filter: "}}}]}}']

# Reload with a peek open: GTK keeps the peek, and its listing as it was.
[[action]]
name = "peek-reload"
weight = 2
steps = [
  '{"key":"i","when":{"all":[{"any":[{"focused":"documents"},{"focused":"pictures"}]},{"not":{"present":{"role":"label","name_matches":"filter: "}}}]}}',
  '{"key":"F5","when":{"not":{"matches":[]}}}',
]

[[action]]
name = "reload"
weight = 1
steps = ['{"key":"F5","when":{"not":{"matches":[]}}}']

[[action]]
name = "enter"
weight = 3
steps = ['{"key":"l","when":{"any":[{"focused":"documents"},{"focused":"pictures"}]}}']

# The parent of the fixture's own folder is /tmp, which holds other runs' folders; and only
# from a folder with nothing selected (see above).
[[action]]
name = "parent"
weight = 3
steps = ['{"key":"h","when":{"all":[{"not":{"directory":"$root"}},{"selected":[]}]}}']

[[action]]
name = "filter"
weight = 2
steps = ['{"key":"f"}', '{"type":"<query>"}', '{"key":"Escape"}']
choose.query = ["re", "txt", "zz"]

[[action]]
name = "sort"
weight = 2
steps = ['{"key":"comma"}', '{"key":"<key>"}']
choose.key = ["a", "s", "shift+a", "shift+s"]

# The one action here that writes settings.toml.
[[action]]
name = "hidden"
weight = 1
steps = ['{"key":"period"}']

[[action]]
name = "write"
weight = 2
steps = ['{"fs":{"path":"<path>","write":"fuzz\n"}}']
choose.path = ["fuzz-a.txt", "documents/fuzz-b.txt", "pictures/fuzz-c.txt"]

[[action]]
name = "remove"
weight = 1
steps = ['{"fs":{"path":"<path>","remove":true}}']
choose.path = ["fuzz-a.txt", "documents/fuzz-b.txt", "pictures/fuzz-c.txt"]
