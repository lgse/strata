# The Quick Preview alphabet (A15): what a user does to open, retarget, focus, guard, and dismiss
# the preview drawer and its session reservation across Columns, Icons and List:
# - Toggling Quick Preview via `Space` (including `Space` entering a folder without opening the
#   preview), entry context-menu `Quick preview` (`commands::On::Row`), and the Appearance
#   popover's `Preview panel` (`preview-panel`), plus closing via `Close preview (Space)` or
#   `Escape` dismissal;
# - Following cursor, extended-range (`Shift+Down`), and `Ctrl+click` multi-selection changes
#   across sandboxed comic-cover previews (`album.cbz`, `comic.cbz`, `issue-2.cbz` -> `ImageView`
#   `"Cover preview"`), broken archive and RAW camera failure cards (`corrupt.cbz`, `broken.cbz`,
#   `broken.NEF` with the 7-row `raw_details` camera metadata footer), binary unsupported-type
#   feedback (`binary.dat`, `opaque.dat`, `extra.dat` -> `"No visual preview"`), unpreviewable
#   packages (`package.deb`), and folder / empty-selection placeholders (`"No preview for this
#   selection"`, with `Open in default application` kept visible and disabled);
# - Entering and leaving the preview (`Right`/`l` and `Left`), focusing the resize divider (`F8`),
#   blocking file-mutation shortcuts while focus is inside the preview (`F2`, `Delete`,
#   `Shift+Delete`, `Ctrl+X`, `Ctrl+V`, `Ctrl+D`), previewing filtered results (`Ctrl+F` -> `Down`
#   -> `Space`), switching between Columns, Icons and List (`Ctrl+1`, `Ctrl+2`, `Ctrl+3`), and
#   evicting an open preview when its file (`samples/extra.dat`) is removed on disk.
#
# Type to search is off (`prefs`), so `h`, `j`, `k` and `l` navigate outside text fields.
#
# Left out, with why:
# - Leaving text (`CodeView`), rendered Markdown (`DocumentView`), CSV (`SheetGrid`,
#   lgse/strata#2509), or non-cover still images (`ImageView` caption/name ruling) open at step
#   boundaries: `open_preview` (`app.preview`) flattens every presented descendant's accessible
#   name and text, where GTK's `GtkSourceView` reports one `\n`-joined buffer string, GTK's
#   `GtkListView` omits Rune's `"Document"`/`"Source"` container names, and C11b uses `table`
#   instead of `GtkColumnView`'s `tree table` (covered by the 50 `quick_preview` parity runs and
#   3 `-rune` twins).
# - Clicking `Open in default application` (`EXTERNAL_LINK`): with no desktop handler installed in
#   the test image, `BrowserEvent::OpenRequested` opens `Open With` (A14's Slice 2, `properties.toml`).
# - Opening a context menu while the preview drawer is already open: Rune's context menu is a
#   modal layer that hides background `app.preview` while open (`qa/tree.rs`), as modal dialogs do
#   (`properties.toml`). `context-menu-preview` opens Quick Preview from `preview: null`.
# - `Up` off a folder's first row and `Icons` vertical arrows (`owner.md` A1 item 3, `views.toml`),
#   `Right` on empty `archive` (lgse/strata#2408), cursorless folder opens in `Icons`/`List`
#   (lgse/strata#2415, lgse/strata#2361), clicking an already-open folder column, dismissing a
#   filter or splicing into an open cursorless column (lgse/strata#2356), and `Ctrl+click`
#   deselecting while another entry stays selected (lgse/strata#2353).
#
# Versions 1 and 2 were A15's drafts, never merged: version 1 caught `Map::Tenxer` `i` firing with
# `tenxer_mode` off, default-mode `Space` inside the drawer closing the preview instead of
# activating header buttons, `Open in default application` hiding instead of disabling on a
# placeholder, `.a11y_hidden()` omitting the header's `"·"` separators, and stale `"—"` metadata
# when `MetadataFilled` raced `PreviewEvent::Ready` in `List` (all five fixed), and met
# `CodeView`/`DocumentView`/`SheetGrid` body `app.preview` differences (lgse/strata#2509);
# version 2 caught `handover::adopt` skipping `anchor`-only updates after `Quick preview` from a
# context menu (`browser-view` invariant), `extension_label` uppercasing fallback extensions
# (`"CBZ"` vs `"cbz"`), and `Preview` requesting unasked metadata fills on filtered results (all
# three fixed), plus wall-clock ZIP timestamps in `ZipEntry::Image`, modal context menus hiding
# `app.preview`, and lgse/strata#2415 / lgse/strata#2356 on cursorless columns. Version 3 writes
# deterministic `.cbz` archives via `hex` and guards those three cases.
area = "preview"
version = 3
about = "Columns, Icons and List with cover archives, RAW/archive failure cards and binary files, type to search off: Space, context-menu Quick preview and Appearance Preview panel toggles, selection-following previews and placeholders, Right/Left/F8/Escape focus transitions, blocked file keys inside preview, filtered-result Space preview, view switches and live file removal"
header = '{"modes":["columns"],"prefs":{"type_to_search":false},"tree":{"archive":{},"covers":{"broken.cbz":"not a comic archive\n"},"samples":{"broken.NEF":"not a RAW image","package.deb":"!<arch>\n"},"corrupt.cbz":"corrupt archive\n"},"setup":[{"fs":{"path":"album.cbz","hex":""}},{"fs":{"path":"binary.dat","hex":"0001020304"}},{"fs":{"path":"covers/comic.cbz","hex":""}},{"fs":{"path":"covers/issue-2.cbz","hex":""}},{"fs":{"path":"samples/opaque.dat","hex":"00ff00ff"}}]}'

[[action]]
name = "down"
weight = 6
steps = ['{"key":"<key>","when":{"all":[{"focused_pane":true},{"not":{"matches":[]}},{"not":{"view_mode":"Icons"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.key = ["Down", "j"]

[[action]]
name = "up"
weight = 4
steps = ['{"key":"<key>","when":{"all":[{"focused_pane":true},{"focused_in_matches":true},{"not":{"view_mode":"Icons"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null},{"not":{"focused":{"one_of":["archive","broken.cbz","broken.NEF"]}}}]}}']
choose.key = ["Up", "k"]

[[action]]
name = "extend-down"
weight = 2
steps = ['{"key":"shift+Down","when":{"all":[{"focused_pane":true},{"focused_in_matches":true},{"not":{"view_mode":"Icons"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']

[[action]]
name = "right"
weight = 5
steps = ['{"key":"<key>","when":{"all":[{"focused_pane":true},{"not":{"matches":[]}},{"not":{"view_mode":"Icons"}},{"not":{"focused":"archive"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.key = ["Right", "l"]

[[action]]
name = "left-from-pane"
weight = 4
steps = ['{"key":"<key>","when":{"all":[{"focused_pane":true},{"not":{"directory":"$root"}},{"not":{"view_mode":"Icons"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.key = ["Left", "h"]

[[action]]
name = "left-from-preview"
weight = 4
steps = ['{"key":"Left","when":{"all":[{"preview":true},{"not":{"focused_pane":true}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']

[[action]]
name = "toggle-preview"
weight = 7
steps = ['{"key":"space","when":{"all":[{"focused_pane":true},{"focused_in_matches":true},{"not":{"selected":[]}},{"not":{"focused":"archive"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']

[[action]]
name = "context-menu-preview"
weight = 4
steps = [
  '{"click":{"entry":"<entry>"},"button":3,"when":{"all":[{"preview":null},{"present":{"entry":"<entry>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"Quick preview"},"when":{"present":{"menu_item":"Quick preview"}}}',
]
choose.entry = ["album.cbz", "binary.dat", "corrupt.cbz", "comic.cbz", "issue-2.cbz", "broken.cbz", "broken.NEF", "opaque.dat"]

[[action]]
name = "escape"
weight = 5
steps = ['{"key":"Escape","when":{"all":[{"any":[{"preview":true},{"focused_pane":true},{"field":{"focused":true}},{"menu_items":{}}]},{"not":{"dialog":true}}]}}']

[[action]]
name = "click-file"
weight = 6
steps = ['{"click":{"entry":"<entry>"},"when":{"all":[{"present":{"entry":"<entry>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.entry = ["album.cbz", "binary.dat", "corrupt.cbz", "comic.cbz", "issue-2.cbz", "broken.cbz", "broken.NEF", "opaque.dat", "package.deb", "extra.dat"]

[[action]]
name = "open-folder-click"
weight = 3
steps = [
  '{"click":{"entry":"<folder>","dir":"$root"},"when":{"all":[{"view_mode":"Columns"},{"present":{"entry":"<folder>","dir":"$root"}},{"absent":{"pane":"<folder>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"move":{"pane":"<folder>"},"when":{"present":{"pane":"<folder>"}}}',
]
choose.folder = ["archive", "covers", "samples"]

[[action]]
name = "parent-folder"
weight = 3
steps = ['{"key":"alt+Up","when":{"all":[{"focused_pane":true},{"not":{"directory":"$root"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']

[[action]]
name = "ctrl-click-entry"
weight = 3
steps = ['{"click":{"entry":"<entry>"},"mods":["ctrl"],"when":{"all":[{"present":{"entry":"<entry>"}},{"not":{"all_selected":{"contains":["<entry>"]}}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.entry = ["album.cbz", "binary.dat", "corrupt.cbz", "comic.cbz", "issue-2.cbz"]

[[action]]
name = "panel-toggle"
weight = 3
steps = [
  '{"click":{"role":"toggle button","name":"Appearance"},"when":{"all":[{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"role":"toggle button","name":"Preview panel"},"when":{"present":{"role":"toggle button","name":"Preview panel"}}}',
]

[[action]]
name = "close-preview-button"
weight = 3
steps = ['{"click":{"role":"button","name":"Close preview (Space)","within":{"preview":true}},"when":{"all":[{"preview":true},{"present":{"role":"button","name":"Close preview (Space)","within":{"preview":true}}},{"not":{"dialog":true}},{"menu_items":null}]}}']

[[action]]
name = "divider-focus"
weight = 2
steps = ['{"key":"F8","when":{"all":[{"preview":true},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']

[[action]]
name = "preview-blocked-file-key"
weight = 3
steps = [
  '{"key":"Right","when":{"all":[{"focused_pane":true},{"preview":true},{"not":{"view_mode":"Icons"}},{"focused":{"one_of":["album.cbz","binary.dat","corrupt.cbz","comic.cbz","issue-2.cbz","broken.cbz","broken.NEF","opaque.dat"]}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"key":"<key>","when":{"all":[{"preview":true},{"not":{"focused_pane":true}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"key":"Left","when":{"all":[{"preview":true},{"not":{"focused_pane":true}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
]
choose.key = ["F2", "Delete", "shift+Delete", "ctrl+x", "ctrl+v", "ctrl+d"]

[[action]]
name = "filter-space-preview"
weight = 3
steps = [
  '{"key":"ctrl+f","when":{"all":[{"focused_pane":true},{"focused_in_matches":true},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"type":"<query>","when":{"all":[{"field":{"focused":true}},{"not":{"field":{"name":"Rename"}}}]}}',
  '{"key":"Down","when":{"all":[{"field":{"focused":true}},{"not":{"matches":[]}}]}}',
  '{"key":"space","when":{"all":[{"focused_pane":true},{"editable_fields":1},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"key":"Escape","when":{"all":[{"preview":true},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"key":"Escape","when":{"all":[{"editable_fields":1},{"not":{"dialog":true}},{"menu_items":null}]}}',
]
choose.query = ["album", "comic", "binary"]

[[action]]
name = "switch-view"
weight = 4
steps = ['{"key":"ctrl+<digit>","when":{"all":[{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.digit = ["1", "2", "3"]

[[action]]
name = "fs-write-extra"
weight = 2
steps = ['{"fs":{"path":"samples/extra.dat","hex":"00aa55ff"},"when":{"all":[{"editable_fields":0},{"not":{"dialog":true}},{"absent":{"pane":"samples"}},{"not":{"directory":"samples"}},{"file":{"path":"$fixture/samples/extra.dat","exists":false}}]}}']

[[action]]
name = "fs-remove-extra"
weight = 2
steps = ['{"fs":{"path":"samples/extra.dat","remove":true},"when":{"all":[{"editable_fields":0},{"not":{"dialog":true}},{"any":[{"absent":{"pane":"samples"}},{"focused_in_matches":true}]},{"file":{"path":"$fixture/samples/extra.dat","exists":true}}]}}']
