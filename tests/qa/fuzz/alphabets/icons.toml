# The Icons view's alphabet (A1): what a user does in the Icons grid on the canonical
# fixture, by the keys and pointer GTK's Icons view and the Rune Icons view both take today.
# It is the List alphabet (`list.toml`, `list v4`, A2's) with its own header and the
# sideways moves an Icons grid has; every other action is List's, for List's reasons, which
# that file gives, its guards and what it leaves out included.
#
# Type to search is off (the header's `prefs`), so h, j, k and l are Left, Down, Up and
# Right, as GTK reads them then (`Context::of` in `src/ui/keys/alias.rs`).
#
# Left and h only from an entry that is not the folder's first: on GTK, Left on the first
# tile, or with no tile focused, takes the keyboard to the sidebar (`at_left_edge` in
# `src/ui/browser_modes/focus.rs`, `single_pane_arrow_action` in
# `src/ui/window/key_routing.rs`), where Rune, with no sidebar yet, stays or lands on the
# last tile (`owner.md`, A1 item 2). The root's files are never first, since its folders
# list before them; in `documents` and `pictures` the guard names files that a rename or a
# written file moves to the front only rarely. Right and l only with a tile focused: with
# none, where Right lands is the question `owner.md` asks of the List view (A2 item 1).
#
# Every tile of the fixture's folders is on the grid's one row, so Up, Down, j, k and the page
# keys are always at the grid's edge, where GTK commits the cursor's entry and Rune's grid does
# nothing (`owner.md`, A1 items 1, 3 and 12; lgse/strata#2414): left out, as `views` does in
# Icons. Right and l at a folder's last tile are that edge too, and are guarded by name.
#
# Version 1 met List's classes and these in every seed across the targets (F4's round 1);
# version 2, F4's round 2 draft, guarded them and met lgse/strata#2640 (fixed) and
# lgse/strata#2641 at Return; version 3 keeps Return off a multi-selection.
#
# Left out, besides List's: the thumbnail size (Ctrl+Alt+plus, minus and 0, and
# Ctrl+Shift+wheel, which both targets take since lgse/strata#2275), for a later version to
# add; and grouping, which a header would hold for the whole alphabet.
area = "icons"
version = 3
about = "Icons on the canonical fixture, type to search off: keyboard navigation and selection with the sideways arrows, h and l, Home and End, off the grid's edges, clicks, Ctrl and Shift clicks and background clicks by name, opening folders in place, Back and the parent, the context menu by pointer, hidden files, and files made and removed behind the application's back"
header = '{"modes":["icons"],"prefs":{"type_to_search":false}}'

[[action]]
name = "right"
weight = 6
steps = ['{"key":"<key>","when":{"all":[{"focused_in_matches":true},{"not":{"focused":{"one_of":["todo.txt","spreadsheet.csv","photo.txt"]}}}]}}']
choose.key = ["Right", "l"]

[[action]]
name = "left"
weight = 5
steps = ['{"key":"<key>","when":{"any":[{"focused":"readme.md"},{"focused":"todo.txt"},{"focused":"report.md"},{"focused":"spreadsheet.csv"},{"focused":"photo.txt"}]}}']
choose.key = ["Left", "h"]

[[action]]
name = "edge"
weight = 3
steps = ['{"key":"<key>"}']
choose.key = ["Home", "End"]

[[action]]
name = "extend-right"
weight = 3
steps = ['{"key":"shift+Right","when":{"all":[{"focused_in_matches":true},{"not":{"focused":{"one_of":["todo.txt","spreadsheet.csv","photo.txt"]}}}]}}']

[[action]]
name = "extend-left"
weight = 3
steps = ['{"key":"shift+Left","when":{"any":[{"focused":"readme.md"},{"focused":"todo.txt"},{"focused":"report.md"},{"focused":"spreadsheet.csv"},{"focused":"photo.txt"}]}}']

[[action]]
name = "escape"
weight = 3
steps = ['{"key":"Escape"}']

# Return only on the two folders the walk visits, and only with nothing else selected: with a
# multi-selection GTK's Return activates the selection, opening Open With for its files, where
# Rune's opens the focused folder (lgse/strata#2641, beside #2358; `icons v2` seed `0x08`).
# On a file it asks for the file's default application, which the QA image has none of: GTK
# then opens Strata's Open With chooser, which takes the keyboard (reproduced), and Rune opens
# nothing, so the keys after it go to different places. Not on `archive`, the fixture's one empty
# folder, where GTK lost Back and the parent key in the walk (observed in the walk, not
# reproduced: both work there by hand). And not off the rows: on GTK, Up off the first row
# takes the keyboard to the pane header, where Return leaves the fixture.
[[action]]
name = "open"
weight = 2
steps = ['{"key":"Return","when":{"all":[{"any":[{"focused":"documents"},{"focused":"pictures"}]},{"any":[{"selected":[]},{"selected":["documents"]},{"selected":["pictures"]}]}]}}']

# A folder opened by the pointer, as a double click opens it in the Icons view, wherever the
# keyboard is: on GTK the keyboard is often off the rows, where Return is not sent.
[[action]]
name = "open-folder"
weight = 4
steps = ['{"click":{"entry":"<folder>"},"count":2,"when":{"all":[{"present":{"entry":"<folder>"}}]}}']
choose.folder = ["documents", "pictures"]

# The parent of the fixture's own folder is /tmp, which holds other runs' folders: the
# parent and Back stay inside the fixture.
[[action]]
name = "parent"
weight = 3
steps = ['{"key":"alt+Up","when":{"not":{"directory":"$root"}}}']

[[action]]
name = "back"
weight = 3
steps = ['{"key":"alt+Left","when":{"not":{"directory":"$root"}}}']

# Entries of the three folders the walk shows; one not shown is skipped at once.
[[action]]
name = "click"
weight = 5
steps = ['{"click":{"entry":"<entry>"},"when":{"all":[{"present":{"entry":"<entry>"}}]}}']
choose.entry = ["documents", "pictures", "readme.md", "todo.txt", "notes.txt", "report.md", "spreadsheet.csv", "diagram.txt", "photo.txt"]

[[action]]
name = "ctrl-click"
weight = 2
steps = ['{"click":{"entry":"<entry>"},"mods":["ctrl"],"when":{"all":[{"present":{"entry":"<entry>"}},{"not":{"all_selected":{"contains":["<entry>"]}}}]}}']
choose.entry = ["documents", "readme.md", "todo.txt", "notes.txt", "report.md", "spreadsheet.csv", "diagram.txt", "photo.txt"]

[[action]]
name = "shift-click"
weight = 2
steps = ['{"click":{"entry":"<entry>"},"mods":["shift"],"when":{"all":[{"present":{"entry":"<entry>"}},{"not":{"selected":[]}}]}}']
choose.entry = ["documents", "readme.md", "todo.txt", "notes.txt", "report.md", "spreadsheet.csv", "diagram.txt", "photo.txt"]

# A click on the pane's empty space below its tiles, as `background-click-clears-selection`
# makes it: the folders the walk shows fill at most one row of tiles, so the point is blank
# on both targets.
[[action]]
name = "click-background"
weight = 2
steps = ['{"click":{"pane":"<pane>"},"at":["50%",-60],"when":{"all":[{"directory":"<pane>"}]}}']
choose.pane = ["$root", "documents", "pictures"]

# The context menu by the pointer, then a dismissal.
[[action]]
name = "menu-dismiss"
weight = 2
steps = [
  '{"click":{"entry":"<entry>"},"button":3,"when":{"all":[{"present":{"entry":"<entry>"}}]}}',
  '{"key":"Escape","when":{"present":{"menu_item":"Rename"}}}',
]
choose.entry = ["documents", "readme.md", "todo.txt", "notes.txt", "report.md", "diagram.txt"]

[[action]]
name = "refresh"
weight = 1
steps = ['{"key":"F5"}']

# The one action here that writes settings.toml.
[[action]]
name = "hidden"
weight = 2
steps = ['{"key":"ctrl+period"}']

[[action]]
name = "write"
weight = 2
steps = ['{"fs":{"path":"<path>","write":"fuzz\n"}}']
choose.path = ["fuzz-a.txt", "documents/fuzz-b.txt", "pictures/fuzz-c.txt"]

[[action]]
name = "remove"
weight = 1
steps = ['{"fs":{"path":"<path>","remove":true}}']
choose.path = ["fuzz-a.txt", "documents/fuzz-b.txt", "pictures/fuzz-c.txt"]
