# The Properties alphabet (A17): what a user does to open, read, edit and act from the
# Properties dialog in Columns on a fixture with nested hidden files, symlinks, images, video
# and RAW camera files:
# - opening single-item, folder, empty-folder (`archive`), symlink (`outside`) and
#   multi-selection Properties through all four command routes: `Alt+Return`
#   (`commands::On::Focus`), entry and multi-selection context menus (`On::Row`), folder
#   background context menus (`On::Column`), and sidebar built-in place and pinned-folder
#   context menus (`On::Place`);
# - recursive folder and multi-selection size calculation (skipping symlinks and counting
#   hidden entries) while files are added and removed on disk, plus sandboxed media container
#   (`clip.mp4`, `broken.mp4`, `photo.png`) and RAW camera (`camera.DNG`, `broken.NEF`)
#   metadata loading and cancellation on close;
# - permission bit toggles (`Group`/`Others` read, write and execute on entries, plus
#   `Owner write` and `Allow executing file as program` on files), compared on disk through
#   each step's `fs` mode digest;
# - single-item footer actions (`Open` refusal `"Unable to open item"` on `Trash`, `Rename`
#   into the inline editor, `Pin` and `Unpin` updating sidebar bookmarks, and `Copy path` ->
#   `Copied`), modal shortcut blocking (`Ctrl+N`, `Ctrl+T`, `Ctrl+B`, `Ctrl+L`, `Ctrl+F`,
#   `F2`, `Delete`), and closing via `Escape` or `Close dialog` with focus restored to the
#   opener.
#
# Type to search and single-click previews are off (`prefs`), so `h`, `j`, `k` and `l` navigate
# outside text fields without starting a search or opening the preview drawer on click.
#
# Left out, with why:
# - `Open` in Properties on non-Trash entries and folders: `Properties`'s `Open` button
#   (`EXTERNAL_LINK`) calls external `open_location` (`BrowserEvent::OpenRequested`), which
#   with no desktop handler installed in the test image opens GTK's `Open With` chooser
#   (A14's Slice 2), and on `+x` files opens `"Run this program?"` (where GTK's
#   `confirm_run_program` omits `remember_modal_focus`, `menus.toml`; covered by
#   `properties::tests::open_action_on_executable_settles_run_confirmation_immediately`).
# - Clicking an already-open folder column, dismissing a background-menu dialog over a
#   non-empty column with no cursor, splicing external filesystem entries into an open
#   cursorless column (lgse/strata#2356, lgse/strata#2361, `oracle`, `clipboard.toml`), and
#   `Ctrl+click` deselecting an entry while another stays selected (GTK's `pointer_selection`
#   leaves the browser cursor on the prior entry while widget focus moves to the clicked row,
#   as in lgse/strata#2353).
# - Clicking `Unpin` inside Properties when opened from that pinned sidebar row itself:
#   removing the focused sidebar row meets lgse/strata#2406 (`sidebar/parked`); `Pin` and
#   `Unpin` inside Properties run from the folder's entry menu, and pinned sidebar rows open
#   Properties (`On::Place`), run `Copy path`, and restore focus to the sidebar row on close.
# - Removing `Owner` read/write/execute bits on directories or `$HOME`: unwalkable directories
#   hide children from `observe::tree` and prevent cleanup without a teardown chmod, and
#   `$HOME` is outside `$fixture`.
# - Opening the preview drawer (`Space`, A15's): while a modal dialog is open, Rune's modal
#   hides background layers from `presented` (`app.preview = null`) whereas GTK's `GtkOverlay`
#   keeps the background preview in `presented`; preview + Properties is covered by
#   `media-details-properties-only` and `raw-details-preview-and-properties`.
#
# Versions 1 and 2 were A17's drafts, never merged: version 1 met `Open` on fixture folders
# opening GTK's `Open With` chooser (`BrowserEvent::OpenRequested`, A14's Slice 2) and
# lgse/strata#2356 on already-open folder clicks and cursorless background-menu Escape;
# version 2 reached 16 of 20 and met lgse/strata#2406 on `Unpin` of a focused pinned sidebar
# row, lgse/strata#2356 on `fs-write` into an open cursorless `sized-folder` column, and
# `Ctrl+click` deselecting `readme.md` before `j` (as in lgse/strata#2353). Version 3 guards
# those three cases.
area = "properties"
version = 3
about = "Columns with nested hidden files, symlinks, media and RAW photos, type to search and single-click previews off: single-item, folder, symlink and multi-selection Properties via Alt+Return and entry, background and sidebar menus, permission bit and +x toggles, Pin/Unpin, Copy path, Trash Open refusal, Rename, modal shortcut blocking, and Escape / Close dialog dismissal"
header = '{"modes":["columns"],"prefs":{"type_to_search":false,"single_click_previews":false},"setup":[{"fs":{"path":".","populate":{"sized-folder":{"top.txt":"abc","nested":{"child.txt":"12345",".hidden.txt":"1234567"},".hidden":{"visible":{"file.txt":"123"}}}}}},{"fs":{"path":"sized-folder/nested/loop","symlink":"$fixture/sized-folder"}},{"fs":{"path":"sized-folder/outside","symlink":"$fixture/todo.txt"}},{"fs":{"path":"pictures/photo.png","image":{"width":320,"height":180,"rgb":[0,128,0]}}},{"fs":{"path":"pictures/clip.mp4","ffmpeg":["-f","lavfi","-i","color=c=blue:s=160x90:r=24:d=1","-f","lavfi","-i","sine=frequency=440:sample_rate=48000:duration=1","-c:v","libx264","-c:a","aac","-ac","2","-shortest"]}},{"fs":{"path":"pictures/broken.mp4","write":"not a media container"}},{"fs":{"path":"pictures/camera.DNG","raw_photo":true}},{"fs":{"path":"pictures/broken.NEF","write":"not a RAW image"}}]}'

[[action]]
name = "down"
weight = 5
steps = ['{"key":"<key>","when":{"all":[{"focused_pane":true},{"not":{"matches":[]}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.key = ["Down", "j"]

[[action]]
name = "up"
weight = 4
steps = ['{"key":"<key>","when":{"all":[{"focused_pane":true},{"focused_in_matches":true},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null},{"not":{"focused":{"one_of":["archive","notes.txt","broken.mp4","broken.NEF","nested","loop","child.txt"]}}}]}}']
choose.key = ["Up", "k"]

[[action]]
name = "right"
weight = 4
steps = ['{"key":"<key>","when":{"all":[{"focused_pane":true},{"not":{"matches":[]}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null},{"not":{"focused":{"one_of":["archive","loop"]}}}]}}']
choose.key = ["Right", "l"]

[[action]]
name = "left"
weight = 3
steps = ['{"key":"<key>","when":{"all":[{"focused_pane":true},{"not":{"directory":"$root"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.key = ["Left", "h"]

[[action]]
name = "click-file"
weight = 5
steps = ['{"click":{"entry":"<entry>"},"when":{"all":[{"present":{"entry":"<entry>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.entry = ["readme.md", "todo.txt", "notes.txt", "report.md", "camera.DNG", "broken.NEF", "clip.mp4", "broken.mp4", "photo.png", "outside", "top.txt"]

[[action]]
name = "open-folder-click"
weight = 4
steps = [
  '{"click":{"entry":"<folder>","dir":"$root"},"when":{"all":[{"present":{"entry":"<folder>","dir":"$root"}},{"absent":{"pane":"<folder>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"move":{"pane":"<folder>"},"when":{"present":{"pane":"<folder>"}}}',
]
choose.folder = ["archive", "documents", "pictures", "sized-folder"]

[[action]]
name = "ctrl-click-entry"
weight = 3
steps = ['{"click":{"entry":"<entry>"},"mods":["ctrl"],"when":{"all":[{"present":{"entry":"<entry>"}},{"not":{"all_selected":{"contains":["<entry>"]}}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']
choose.entry = ["readme.md", "todo.txt", "notes.txt", "report.md"]

# Opens single-item or multi-selection Properties via `Alt+Return` (`commands::On::Focus`) and
# leaves it open so inside-dialog actions can interleave freely.
[[action]]
name = "open-alt-return"
weight = 6
steps = ['{"key":"alt+Return","when":{"all":[{"focused_in_matches":true},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}']

# Dismisses an open Properties dialog (or leftover menu) via `Escape`, returning focus to the
# opener without clearing selection.
[[action]]
name = "close-escape"
weight = 6
steps = ['{"key":"Escape","when":{"any":[{"dialog":true},{"menu_items":{}}]}}']

# Closes an open Properties dialog via its header `Close dialog` button.
[[action]]
name = "close-button"
weight = 4
steps = ['{"click":{"role":"button","name":"Close dialog","within":{"dialog":true}},"when":{"all":[{"dialog":true},{"present":{"role":"button","name":"Close dialog","within":{"dialog":true}}}]}}']

# Window and view shortcuts pressed while modal Properties is open must be blocked on both
# targets (`modal-dialog-blocks-window-shortcuts`).
[[action]]
name = "blocked-shortcut"
weight = 3
steps = ['{"key":"<key>","when":{"dialog":true}}']
choose.key = ["ctrl+n", "ctrl+t", "ctrl+b", "ctrl+l", "ctrl+f", "F2", "Delete"]

# Toggles Group and Others r/w/x permission bits inside an open Properties dialog for fixture
# entries (keeping Owner rwx on directories and skipping `$root` and places outside `$fixture`).
[[action]]
name = "toggle-permission-bit"
weight = 5
steps = ['{"click":{"role":"toggle button","name":"<bit>","within":{"dialog":true}},"when":{"all":[{"dialog":true},{"not":{"dialog":"$root"}},{"not":{"dialog":"Home"}},{"not":{"dialog":"Desktop"}},{"not":{"dialog":"Trash"}},{"present":{"role":"toggle button","name":"<bit>","within":{"dialog":true}}}]}}']
choose.bit = ["Group read", "Group write", "Group execute", "Others read", "Others write", "Others execute"]

# Opens Properties on a file, toggles `Owner write` and `+x` (`Allow executing file as program`),
# and closes via `Escape`.
[[action]]
name = "file-owner-write-and-exec"
weight = 4
steps = [
  '{"click":{"entry":"<file>"},"button":3,"when":{"all":[{"present":{"entry":"<file>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"Properties"},"when":{"present":{"menu_item":"Properties"}}}',
  '{"click":{"role":"toggle button","name":"Owner write","within":{"dialog":true}},"when":{"present":{"role":"toggle button","name":"Owner write","within":{"dialog":true}}}}',
  '{"click":{"role":"check box","name":"Allow executing file as program","within":{"dialog":true}},"when":{"present":{"role":"check box","name":"Allow executing file as program","within":{"dialog":true}}}}',
  '{"key":"Escape","when":{"dialog":true}}',
]
choose.file = ["readme.md", "todo.txt", "notes.txt", "report.md"]

# Clicks `Copy path` inside an open single-item Properties dialog, flipping it to `Copied`.
[[action]]
name = "copy-path"
weight = 3
steps = ['{"click":{"dialog_button":"Copy path"},"when":{"all":[{"dialog":true},{"present":{"role":"button","name":"Copy path","within":{"dialog":true}}}]}}']

# Entry context menu (`commands::On::Row`) -> `Properties` across folders, symlinks, media and
# RAW files.
[[action]]
name = "entry-menu-properties"
weight = 5
steps = [
  '{"click":{"entry":"<entry>"},"button":3,"when":{"all":[{"present":{"entry":"<entry>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"Properties"},"when":{"present":{"menu_item":"Properties"}}}',
]
choose.entry = ["archive", "documents", "sized-folder", "readme.md", "camera.DNG", "broken.NEF", "clip.mp4", "broken.mp4", "photo.png", "outside"]

# Multi-selection Properties via `Menu` / `Shift+F10` -> `Properties` (`On::Row`) on a folder +
# file selection, exercising aggregate recursive size calculation.
[[action]]
name = "multi-selection-menu-properties"
weight = 3
steps = [
  '{"click":{"entry":"<folder>","dir":"$root"},"when":{"all":[{"present":{"entry":"<folder>","dir":"$root"}},{"absent":{"pane":"<folder>"}},{"present":{"entry":"readme.md","dir":"$root"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"entry":"readme.md","dir":"$root"},"mods":["ctrl"],"when":{"all":[{"present":{"entry":"readme.md","dir":"$root"}},{"not":{"all_selected":{"contains":["readme.md"]}}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"key":"<menu>","when":{"all":[{"focused_in_matches":true},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"Properties"},"when":{"present":{"menu_item":"Properties"}}}',
  '{"key":"Escape","when":{"dialog":true}}',
]
choose.folder = ["documents", "sized-folder"]
choose.menu = ["Menu", "shift+F10"]

# Folder background context menu (`commands::On::Column`) -> `Properties` on an empty or
# cursor-bearing active column (including `$root`, where `Rename` is disabled).
[[action]]
name = "background-menu-properties"
weight = 4
steps = [
  '{"click":{"background":true,"dir":"<dir>"},"button":3,"when":{"all":[{"directory":"<dir>"},{"present":{"pane":"<dir>"}},{"any":[{"matches":[]},{"focused_in_matches":true}]},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"Properties"},"when":{"present":{"menu_item":"Properties"}}}',
]
choose.dir = ["$root", "archive", "documents", "pictures", "sized-folder"]

# Sidebar built-in place context menu (`commands::On::Place`) -> `Properties`, closed right
# after so focus returns to the sidebar row.
[[action]]
name = "sidebar-place-properties"
weight = 3
steps = [
  '{"click":{"sidebar":"<place>"},"button":3,"when":{"all":[{"present":{"sidebar":"<place>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"Properties"},"when":{"present":{"menu_item":"Properties"}}}',
  '{"key":"Escape","when":{"dialog":true}}',
]
choose.place = ["Home", "Desktop", "Trash"]

# Sidebar `Trash` Properties -> `Open` (`actions::open_clicked`), verifying `"Unable to open item"`
# error dialog and closing cleanly via `Escape`.
[[action]]
name = "sidebar-trash-open-refused"
weight = 3
steps = [
  '{"click":{"sidebar":"Trash"},"button":3,"when":{"all":[{"present":{"sidebar":"Trash"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"Properties"},"when":{"present":{"menu_item":"Properties"}}}',
  '{"click":{"dialog_button":"Open"},"when":{"all":[{"dialog":"Trash"},{"present":{"role":"button","name":"Open","within":{"dialog":true}}}]}}',
  '{"key":"Escape","when":{"dialog":"Unable to open item"}}',
]

# Pins or unpins a fixture folder from its Properties dialog (`Pin` / `Unpin`).
[[action]]
name = "properties-pin-toggle"
weight = 4
steps = [
  '{"click":{"entry":"<folder>"},"button":3,"when":{"all":[{"present":{"entry":"<folder>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"Properties"},"when":{"present":{"menu_item":"Properties"}}}',
  '{"click":{"dialog_button":"<pin>"},"when":{"all":[{"dialog":"<folder>"},{"present":{"role":"button","name":"<pin>","within":{"dialog":true}}}]}}',
  '{"key":"Escape","when":{"dialog":true}}',
]
choose.folder = ["documents", "pictures", "sized-folder"]
choose.pin = ["Pin", "Unpin"]

# Opens Properties from a pinned folder's sidebar row (`commands::On::Place`), copies its path,
# and closes via `Escape` (returning focus to the pinned sidebar row).
[[action]]
name = "sidebar-pinned-properties"
weight = 3
steps = [
  '{"click":{"sidebar":"<folder>"},"button":3,"when":{"all":[{"present":{"sidebar":"<folder>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"Properties"},"when":{"present":{"menu_item":"Properties"}}}',
  '{"click":{"dialog_button":"Copy path"},"when":{"all":[{"dialog":"<folder>"},{"present":{"role":"button","name":"Copy path","within":{"dialog":true}}}]}}',
  '{"key":"Escape","when":{"dialog":true}}',
]
choose.folder = ["documents", "pictures", "sized-folder"]

# Clicks `Rename` inside `todo.txt`'s Properties dialog, opening the inline `Rename` editor in
# the column and committing or cancelling.
[[action]]
name = "properties-rename-todo"
weight = 3
steps = [
  '{"click":{"entry":"todo.txt"},"button":3,"when":{"all":[{"present":{"entry":"todo.txt"}},{"absent":{"entry":"todo-prop.txt"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"Properties"},"when":{"present":{"menu_item":"Properties"}}}',
  '{"click":{"dialog_button":"Rename"},"when":{"all":[{"dialog":"todo.txt"},{"present":{"role":"button","name":"Rename","within":{"dialog":true}}}]}}',
  '{"type":"todo-prop","when":{"field":{"name":"Rename","focused":true}}}',
  '{"key":"<end>","when":{"field":{"name":"Rename","focused":true}}}',
]
choose.end = ["Return", "Escape"]

[[action]]
name = "properties-rename-back"
weight = 2
steps = [
  '{"click":{"entry":"todo-prop.txt"},"button":3,"when":{"all":[{"present":{"entry":"todo-prop.txt"}},{"absent":{"entry":"todo.txt"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null}]}}',
  '{"click":{"menu_item":"Properties"},"when":{"present":{"menu_item":"Properties"}}}',
  '{"click":{"dialog_button":"Rename"},"when":{"all":[{"dialog":"todo-prop.txt"},{"present":{"role":"button","name":"Rename","within":{"dialog":true}}}]}}',
  '{"type":"todo","when":{"field":{"name":"Rename","focused":true}}}',
  '{"key":"Return","when":{"field":{"name":"Rename","focused":true}}}',
]

# Runner-side file additions and removals inside `sized-folder` while `sized-folder` is not open,
# so folder and multi-selection size calculations see live changing totals without splicing into
# an open cursorless column (lgse/strata#2356).
[[action]]
name = "fs-write"
weight = 2
steps = ['{"fs":{"path":"sized-folder/extra.txt","write":"extra bytes\n"},"when":{"all":[{"not":{"dialog":true}},{"absent":{"pane":"sized-folder"}},{"file":{"path":"$fixture/sized-folder/extra.txt","exists":false}}]}}']

[[action]]
name = "fs-remove"
weight = 2
steps = ['{"fs":{"path":"sized-folder/extra.txt","remove":true},"when":{"all":[{"not":{"dialog":true}},{"absent":{"pane":"sized-folder"}},{"file":{"path":"$fixture/sized-folder/extra.txt","exists":true}}]}}']
