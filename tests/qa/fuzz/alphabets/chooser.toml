# The chooser alphabet (A20): the floating Copy to and Move to chooser, the folder chooser a file
# manager opens over its window, in Columns on the canonical fixture, type to search off:
# - opening it from an entry's context menu on a file or folder of `$root`;
# - in it, the path field (Ctrl+L, a folder of the fixture typed, Return), the listing's Down and
#   Right, Escape, and its "Copy here" or "Move here";
# - the "File already exists" dialog a repeated copy raises, answered with Keep Both, Replace or
#   Skip;
# - the browser's own clicks, so that the chooser opens on other folders.
# Every copy and move is compared in the fixture's digest.
#
# A browser step is taken only while no chooser is open, and a chooser step only while its
# window is: each looks for its target within that window, as `floating-chooser-transfers-files`
# does.
#
# Left out, with why:
# - The portal chooser (`strata-rune --qa --portal`): the fuzz replay starts no session bus and
#   no portal, and replays no `portal_open` (docs/testing.md, "Alphabets"), so its filters, Name
#   field, multiple selection and image conversion are reached only by the `chooser_selection`
#   and `chooser_image_conversion` scenarios.
# - Leaving the fixture in the chooser: Left, Backspace and Alt+Up in its listing go above
#   `$root`, where a Copy here would write outside the fixture. The path field types folders of
#   the fixture only.
# - Extract to: the canonical fixture holds no archive.
# - The browser's own arrow keys: once a chooser has closed, GTK's browser has no focus on the
#   QA's Xvfb, which runs no window manager to make it active again (lgse/strata#2595), so a key
#   guarded on the browser's focus is skipped on GTK and sent on Rune. The owner's ruling of
#   2026-11-17 excuses the focus fields then, in tests/qa/fuzz/normalisation.map, and not a step
#   one target takes and the other skips. Clicks reach the browser on both.
# - Up in the chooser's listing: from its first row GTK moves the keyboard to the pane header and
#   leaves the load cursor provisional, so Move here takes the current folder, where Rune's
#   Columns re-selects the row and Move here takes it (`owner.md`, A1 item 3, which the menus
#   and clipboard alphabets leave out too). The listing is empty or one row deep in most of the
#   fixture's folders, where every Up starts at the first row.
# - A click on a folder whose column is open: GTK's list view puts its keyboard on the column's
#   first row, Rune's keeps it off the rows (`oracle` finding lgse/strata#2356), as the clipboard
#   alphabet leaves out.
area = "chooser"
version = 5
about = "Columns, type to search off: the floating Copy to and Move to chooser from an entry's menu, its path field, listing keys, Escape and Copy here or Move here, the conflict dialog a repeated copy raises, and the browser's own clicks between"
header = '{"modes":["columns"],"prefs":{"type_to_search":false}}'

[[action]]
name = "click-entry"
weight = 4
steps = ['{"click":{"entry":"<entry>"},"when":{"all":[{"present":{"entry":"<entry>"}},{"absent":{"pane":"<entry>"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null},{"absent":{"toplevel":"Copy to"}},{"absent":{"toplevel":"Move to"}}]}}']
choose.entry = ["documents", "pictures", "readme.md", "todo.txt"]

[[action]]
name = "open-chooser"
weight = 8
steps = [
  '{"click":{"entry":"<entry>","dir":"$root"},"button":3,"when":{"all":[{"present":{"entry":"<entry>","dir":"$root"}},{"editable_fields":0},{"not":{"dialog":true}},{"menu_items":null},{"absent":{"toplevel":"Copy to"}},{"absent":{"toplevel":"Move to"}}]}}',
  '{"click":{"menu_item":"<item>"},"when":{"present":{"menu_item":"<item>"}}}',
  '{"key":"Escape","when":{"menu_items":{}}}',
]
choose.entry = ["readme.md", "todo.txt", "documents", "pictures"]
choose.item = ["Copy to…", "Copy to…", "Move to…"]

[[action]]
name = "chooser-path"
weight = 8
steps = [
  '{"key":"ctrl+l","when":{"present":{"toplevel":"<title>"}}}',
  '{"key":"ctrl+a","when":{"present":{"field":true,"within":{"toplevel":"<title>"}}}}',
  '{"type":"<folder>","when":{"present":{"field":true,"within":{"toplevel":"<title>"}}}}',
  '{"key":"Return","when":{"present":{"field":true,"within":{"toplevel":"<title>"}}}}',
]
choose.folder = ["$fixture", "$fixture/documents", "$fixture/pictures", "$fixture/archive"]
choose.title = ["Copy to", "Move to"]

[[action]]
name = "chooser-keys"
weight = 5
steps = ['{"key":"<key>","when":{"all":[{"present":{"toplevel":"<title>"}},{"absent":{"field":true,"within":{"toplevel":"<title>"}}}]}}']
choose.key = ["Down", "Right"]
choose.title = ["Copy to", "Move to"]

[[action]]
name = "copy-here"
weight = 5
steps = ['{"click":{"role":"button","name":"Copy here","within":{"toplevel":"Copy to"}},"when":{"present":{"role":"button","name":"Copy here","within":{"toplevel":"Copy to"}}}}']

[[action]]
name = "move-here"
weight = 3
steps = ['{"click":{"role":"button","name":"Move here","within":{"toplevel":"Move to"}},"when":{"present":{"role":"button","name":"Move here","within":{"toplevel":"Move to"}}}}']

[[action]]
name = "chooser-escape"
weight = 2
steps = ['{"key":"Escape","when":{"any":[{"present":{"toplevel":"Copy to"}},{"present":{"toplevel":"Move to"}}]}}']

[[action]]
name = "conflict"
weight = 4
steps = ['{"click":{"dialog_button":"<choice>"},"when":{"all":[{"dialog":"File already exists"},{"present":{"dialog_button":"<choice>"}}]}}']
choose.choice = ["Keep Both", "Replace", "Skip"]
