# The Settings alphabet (A18): what a user does in Settings in Columns on the canonical fixture,
# type to search off, with every change compared in `settings.toml`:
# - opening Settings from the header and closing it with Close settings or Escape, and moving
#   between General, Keyboard and Appearance;
# - General's switches (Folder peeking, Mirror columns selection, Single-click file previews,
#   Include subfolders, Open folder after dropping files) and List view's folder click modes,
#   and the Modified date format menu;
# - Keyboard's two tables, its search, a capture on Rename or Refresh (a free key, a taken key
#   that is refused, Backspace and Escape), removing Rename's chips, Rename's row Reset, and
#   Reset all answered with Reset or Cancel.
#
# A page-specific action first opens Settings when it is closed and clicks its page, so that
# most actions reach their control. Pages and the map toggles are clicked, as the scenarios do:
# GTK keeps every page in its tree, so an `activate` of "10xer mode" can reach General's switch
# of that name. The date format's menu opens from its inner toggle, as in
# `settings-choice-buttons-expose-value`: GTK's outer menu button opens nothing when activated.
# Reset all is pressed only while it can be: GTK's `activate` presses an insensitive button.
# Its answer is looked for within its dialog: GTK's General page, in the tree too, has a Reset.
#
# Left out, with why:
# - `Escape` on "Reset all keybinds?": GTK's `confirm_reset_all` (`src/ui/settings/keyboard.rs`)
#   never calls `close_on_escape`, so the confirmation stays open, where Rune's closes as every
#   other modal does (`oracle` finding lgse/strata#2547, `findings.md`). The `escape` action is
#   guarded on its absence; Cancel and Close dialog agree on both.
#
# Met and kept: GTK's Settings is an unnamed layer and its choice menus unnamed popovers, where
# Rune's are a named dialog and menus, so every sequence parts on `app.dialog` at the step that
# opens Settings, and on `app.menu` where a menu opens (`divergence` finding lgse/strata#2572,
# for the owner; its shrunk sequence is parked in tests/qa/fuzz/corpus/settings).
area = "settings"
version = 3
about = "Columns, type to search off: Settings from the header, closed by Close settings and Escape; General's switches, List view's folder clicks and the date format menu; Keyboard's tables, search, capture with a free, a taken and the Backspace and Escape keys, chip removal, row Reset and Reset all with Reset or Cancel"
header = '{"modes":["columns"],"prefs":{"type_to_search":false}}'

[[action]]
name = "open"
weight = 6
steps = ['{"activate":{"role":"button","name":"Settings"},"when":{"absent":{"role":"button","name":"Close settings"}}}']

[[action]]
name = "close"
weight = 2
steps = ['{"activate":{"role":"button","name":"Close settings"},"when":{"present":{"role":"button","name":"Close settings"}}}']

[[action]]
name = "escape"
weight = 2
steps = ['{"key":"Escape","when":{"absent":{"role":"dialog","name":"Reset all keybinds?"}}}']

[[action]]
name = "page"
weight = 3
steps = ['{"click":{"role":"button","name":"<page>"},"when":{"present":{"role":"button","name":"<page>"}}}']
choose.page = ["General", "Keyboard settings", "Appearance settings"]

[[action]]
name = "switch"
weight = 7
steps = ['{"activate":{"role":"button","name":"Settings"},"when":{"absent":{"role":"button","name":"Close settings"}}}', '{"click":{"role":"button","name":"General"},"when":{"present":{"role":"button","name":"General"}}}', '{"activate":{"role":["check box","toggle button","switch"],"name":"<switch>","rendered":false},"when":{"present":{"role":["check box","toggle button","switch"],"name":"<switch>","rendered":false}}}']
choose.switch = ["Folder peeking", "Mirror columns selection", "Single-click file previews", "Include subfolders", "Open folder after dropping files", "List view Folders Single", "List view Folders Double"]

[[action]]
name = "date-format"
weight = 3
steps = ['{"activate":{"role":"button","name":"Settings"},"when":{"absent":{"role":"button","name":"Close settings"}}}', '{"click":{"role":"button","name":"General"},"when":{"present":{"role":"button","name":"General"}}}', '{"reveal":{"role":"button","name":"Modified date format"},"when":{"present":{"role":"button","name":"Modified date format","rendered":false}}}', '{"open_menu":{"role":"toggle button","name":"Modified date format","within":{"role":"button","name":"Modified date format","rendered":false}},"until":{"present":{"role":"radio menu item","name":"<format>"}},"open_states":["checked","pressed"],"when":{"present":{"role":"button","name":"Modified date format","rendered":false}}}', '{"click":{"role":"radio menu item","name":"<format>"},"when":{"present":{"role":"radio menu item","name":"<format>"}}}']
choose.format = ["ISO 8601", "Relative", "Long"]

[[action]]
name = "keymap-table"
weight = 3
steps = ['{"activate":{"role":"button","name":"Settings"},"when":{"absent":{"role":"button","name":"Close settings"}}}', '{"click":{"role":"button","name":"Keyboard settings"},"when":{"present":{"role":"button","name":"Keyboard settings"}}}', '{"click":{"role":"toggle button","name":"<map>"},"when":{"present":{"role":"toggle button","name":"<map>"}}}']
choose.map = ["Default", "10xer mode"]

[[action]]
name = "keymap-search"
weight = 3
steps = ['{"activate":{"role":"button","name":"Settings"},"when":{"absent":{"role":"button","name":"Close settings"}}}', '{"click":{"role":"button","name":"Keyboard settings"},"when":{"present":{"role":"button","name":"Keyboard settings"}}}', '{"click":{"role":"text","name":"Search keybinds"},"when":{"present":{"role":"text","name":"Search keybinds"}}}', '{"key":"ctrl+a","when":{"focused_widget":"Search keybinds"}}', '{"type":"<query>","when":{"focused_widget":"Search keybinds"}}']
choose.query = ["Rename", "refresh", "Find a name", "qqqq"]

[[action]]
name = "capture"
weight = 7
steps = ['{"activate":{"role":"button","name":"Settings"},"when":{"absent":{"role":"button","name":"Close settings"}}}', '{"click":{"role":"button","name":"Keyboard settings"},"when":{"present":{"role":"button","name":"Keyboard settings"}}}', '{"activate":{"role":"button","name":"Add a key for “<command>”","rendered":false},"when":{"present":{"role":"button","name":"Add a key for “<command>”","rendered":false}}}', '{"key":"<key>","when":{"focused_widget":"Press the new key for “<command>”"}}']
choose.command = ["Rename", "Refresh"]
choose.key = ["ctrl+e", "ctrl+c", "F7", "BackSpace", "Escape"]

[[action]]
name = "remove-key"
weight = 3
steps = ['{"activate":{"role":"button","name":"Settings"},"when":{"absent":{"role":"button","name":"Close settings"}}}', '{"click":{"role":"button","name":"Keyboard settings"},"when":{"present":{"role":"button","name":"Keyboard settings"}}}', '{"activate":{"role":"button","name":"Remove <keys> from “Rename”","rendered":false},"when":{"present":{"role":"button","name":"Remove <keys> from “Rename”","rendered":false}}}']
choose.keys = ["F2", "Ctrl+R", "Ctrl+E", "r"]

[[action]]
name = "reset-row"
weight = 2
steps = ['{"activate":{"role":"button","name":"Settings"},"when":{"absent":{"role":"button","name":"Close settings"}}}', '{"click":{"role":"button","name":"Keyboard settings"},"when":{"present":{"role":"button","name":"Keyboard settings"}}}', '{"activate":{"role":"button","name":"Restore the default keys of “Rename”","rendered":false},"when":{"present":{"role":"button","name":"Restore the default keys of “Rename”","rendered":false}}}']

[[action]]
name = "reset-all"
weight = 2
steps = ['{"activate":{"role":"button","name":"Settings"},"when":{"absent":{"role":"button","name":"Close settings"}}}', '{"click":{"role":"button","name":"Keyboard settings"},"when":{"present":{"role":"button","name":"Keyboard settings"}}}', '{"activate":{"role":"button","name":"Reset all","rendered":false},"when":{"state":{"target":{"role":"button","name":"Reset all","rendered":false},"sensitive":true}}}', '{"activate":{"role":"button","name":"<answer>","within":{"role":"dialog","name":"Reset all keybinds?"}},"when":{"present":{"role":"dialog","name":"Reset all keybinds?"}}}']
choose.answer = ["Reset", "Cancel"]
