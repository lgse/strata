# The slice's allowances: what the GTK suite already did wrong before the Rune vertical
# slice, which `./scripts/qa-parity.sh slice` lets stand so that its exit status is about
# parity (docs/rune/slice/README.md, "What the exit command lets stand").
#
# This file lists no runs. The other files of this directory do, one for each folder under
# tests/qa/scenarios (docs/testing.md, "The Rune target and the parity ledger"): the runs
# this file listed until the ledger covered the whole corpus are there.
#
# Only `slice` reads the allowances: `./scripts/qa.sh` and `./scripts/qa-mutation.sh` fail
# on them as on anything else. The runner's unit tests hold the list to the two entries
# here, and refuse one that names no real run or patch, gives no reason or no issue, or
# cites a document that does not name it.
#
#   [[flaky]]        a run that fails some of the time, and that no parity run decides: it
#                    is not required and not in the slice's set. When it fails in slice's
#                    whole-suite part, slice says so, keeps its artifacts and goes on: the
#                    failure does not fail slice. It is not run again, because alone it
#                    fails more often than in the suite.
#   [[stale_patch]]  a GTK mutation patch that no longer applies. slice runs every other
#                    patch, and fails if this one applies again: then its entry goes.
#
# Both entries are owner rulings of 2026-11-11 (docs/rune/slice/README.md, decision 27).

[[flaky]]
scenario = "new-folder-with-selection-groups"
run = "columns"
reason = "Flaky since before V3: its wait for the opened folder's column to take focus times out, in two whole-suite runs in five and in eight runs in nine alone. The owner ruled on 2026-11-11 that slice names it and lets it fail there, and that no scenario is edited."
recorded = "docs/rune/slice/README.md"
issue = "lgse/strata#2162"

[[stale_patch]]
patch = "cut"
reason = "Stale since before V3: src/ui/browser/clipboard.rs moved under it on main (#2092). The owner ruled on 2026-11-11 that this is what 'as before' means for it; rebasing it is a GTK-side change of its own."
recorded = "docs/rune/slice/README.md"
issue = "lgse/strata#2161"
