# The parity ledger of the Rune vertical slice (docs/rune/slice/README.md).
#
# Every Columns run of every scenario file in the slice's set is listed once: the folders
# keyboard_navigation, selection, escape_selection, background_selection, hidden_files and
# startup_arguments (gate G2) and inline_renaming (gate G3) under tests/qa/scenarios. Gate
# G1 is one run of the first. The runner's unit tests fail when a run is missing, listed
# twice or no longer exists.
#
#   status = "required"  passes on both targets; ./scripts/qa-parity.sh runs it on each.
#   status = "pending"   does not pass on the Rune target yet. It carries a reason, one of
#                        harness, component, rune, platform, toolkit, deviation or scope,
#                        and a blocker that names what someone can act on: a step, a work
#                        package, a Rune request or an owner ruling. scope is a part of the
#                        interface the slice leaves out: its blocker names the part's work
#                        package and the first step that needs it.
#
# A run moves to "required" only once it has passed on both targets.

