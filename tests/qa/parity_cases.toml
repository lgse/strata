[[case]]
name = "an unknown host"
file = "keys"
find = 'host = "offscreen"'
put = 'host = "window"'
refused = "window"

[[case]]
name = "an unknown gate"
file = "keys"
find = 'gate = "G1"'
put = 'gate = "G4"'
refused = "G4"

[[case]]
name = "an unknown field"
file = "keys"
append = '''note = "x"
'''
refused = "note"

[[case]]
name = "a run with no package"
file = "keys"
find = '''package = "A2"
'''
put = ""
refused = "package"

[[case]]
name = "an allowance among the runs"
file = "keys"
append = '''
[[flaky]]
scenario = "renames"
run = "list"
'''
refused = "flaky"

