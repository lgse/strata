file = "keys"
find = '''package = "A2"
status = "pending"
'''
put = '''package = "A2"
status = "pending"
host = "session"
'''

[[accepted]]
name = "a run pending on platform that names no host"
file = "keys"
find = '''reason = "scope"
blocker = "A2"'''
put = '''reason = "platform"
blocker = "an input method the image lacks"'''

[[accepted]]
name = "a required run on the session host, under an area package"
file = "keys"
find = '''package = "A2"
status = "pending"
reason = "scope"
blocker = "A2"
'''
put = '''package = "A2"
status = "required"
host = "session"
'''

[[accepted]]
name = "a run of the slice's set that an area package took to required"
file = "keys"
find = '''status = "pending"
reason = "scope"
blocker = "A7: undo"
'''
put = '''status = "required"
host = "offscreen"
'''

[[accepted]]
