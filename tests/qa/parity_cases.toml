'''

# The second corpus: a labelled pair. `moves` cannot pass in Columns on the Rune target under
# the `timing` exception, so `moves-rune`, beside it, stands in for that run there, and
# `renames` is a scenario with no twin. Here the runs are read from the headers, as each
# reader reads them, and a case's `problem` is the one line both report for the whole
# corpus: the ledger's entries, each header alone, and each pair.
#
#   scenarios  a header line for each `<folder>/<scenario>`.
#   ledger     each folder's file. A twin's runs are not listed: each is the `twin` of the
#              parallel run it stands in for.
#   patches    the scenarios the Rune mutation patches are named for.
#   packet     the entries of the Rune filing packet, docs/rune/upstream/rune.
#   case       edits which both refuse: each `edit` names a `header` or a `file` and changes
#              it as above. `patches` replaces the patches there are.
#   accepted   edits both still accept.

[pairs]
patches = ["moves-rune"]
packet = ["98-escape-after-a-dead-key.md"]

[pairs.scenarios]
"keys/moves" = '{"scenario":"moves","modes":["columns","list"],"prefs":{"type_to_search":false},"tree":"canonical","parity":{"twin":"moves-rune","exception":"timing","ref":"lgse/strata#2200"}}'
"keys/moves-rune" = '{"scenario":"moves-rune","modes":["columns"],"targets":["rune"],"prefs":{"type_to_search":false},"tree":"canonical","parity":{"twin":"moves","exception":"timing","ref":"lgse/strata#2200","differs":"line 4 waits for the selection, where the original waits out the highlight"}}'
"keys/renames" = '{"scenario":"renames","modes":["list"],"variants":[{"id":"us"},{"id":"ru","layout":"ru"}]}'

[pairs.ledger]
keys = '''
[[run]]
scenario = "moves"
run = "columns"
package = "A7"
status = "parallel"
exception = "timing"
twin = "moves-rune/columns"
ref = "lgse/strata#2200"

[[run]]
scenario = "moves"
run = "list"
package = "A2"
status = "pending"
reason = "scope"
blocker = "A2"

[[run]]
scenario = "renames"
run = "list-us"
package = "A2"
status = "pending"
reason = "scope"
blocker = "A2: list"

[[run]]
scenario = "renames"
run = "list-ru"
package = "A2"
status = "pending"
reason = "scope"
blocker = "A2: layouts"
'''

# A header's label, read alone.

[[pairs.case]]
name = "a twin does not say what differs"
problem = '''scenarios/keys/moves-rune.jsonl is a twin without a one-line "differs": say which steps differ from moves's and why'''

[[pairs.case.edit]]
header = "keys/moves-rune"
find = ''',"differs":"line 4 waits for the selection, where the original waits out the highlight"'''
put = ''''''

[[pairs.case]]
name = "a twin also runs on GTK"
problem = '''scenarios/keys/moves-rune.jsonl is a twin that also runs on GTK: its header needs "targets":["rune"]'''

[[pairs.case.edit]]
header = "keys/moves-rune"
find = '''"targets":["rune"],'''
put = ''''''

[[pairs.case]]
name = "a twin names another scenario as its original"
problem = '''scenarios/keys/moves-rune.jsonl names "renames", and is the twin of "moves": a twin is its original's name with -rune, beside it'''

[[pairs.case.edit]]
header = "keys/moves-rune"
find = '''"twin":"moves"'''
put = '''"twin":"renames"'''

[[pairs.case]]
name = "a scenario names another scenario's twin"
problem = '''scenarios/keys/moves.jsonl names "renames-rune" as its twin: the twin of moves is moves-rune, beside it'''

[[pairs.case.edit]]
header = "keys/moves"
find = '''"twin":"moves-rune"'''
put = '''"twin":"renames-rune"'''

[[pairs.case]]
name = "a scenario is named as a twin and has no label"
problem = '''scenarios/keys/looks-rune.jsonl is named as a twin and has no "parity" label: a twin names its original, "looks", with the exception, the reference and what differs'''

[[pairs.case.edit]]
header = "keys/looks-rune"
text = '''{"scenario":"looks-rune","modes":["columns"]}'''

[[pairs.case]]
name = "a scenario with no twin leaves a target out"
problem = '''scenarios/keys/renames.jsonl has "targets" and is no twin: every scenario runs on both targets, and a run that cannot pass on Rune is pending, parallel with a twin, or excluded by a ruling'''

[[pairs.case.edit]]
header = "keys/renames"
find = '''"modes":["list"],'''
put = '''"modes":["list"],"targets":["gtk"],'''

[[pairs.case]]
name = "an original leaves a target out"
problem = '''scenarios/keys/moves.jsonl has "targets", and only a twin does: the original keeps running on both targets, and the "parity" label is the one edit made to it'''

[[pairs.case.edit]]
header = "keys/moves"
find = '''"modes":["columns","list"],'''
put = '''"modes":["columns","list"],"targets":["gtk"],'''

[[pairs.case]]
name = "an original says what differs"
problem = '''scenarios/keys/moves.jsonl has "differs", which only the twin carries: moves-rune's header says which steps differ'''

[[pairs.case.edit]]
header = "keys/moves"
find = '''"ref":"lgse/strata#2200"'''
put = '''"ref":"lgse/strata#2200","differs":"line 4"'''

[[pairs.case]]
name = "a twin of a twin"
problem = '''scenarios/keys/moves-rune-rune.jsonl is a twin of a twin: "moves-rune" is itself a twin, and a twin stands in for runs of the file both targets share'''

[[pairs.case.edit]]
header = "keys/moves-rune-rune"
text = '''{"scenario":"moves-rune-rune","modes":["columns"],"targets":["rune"],"prefs":{"type_to_search":false},"tree":"canonical","parity":{"twin":"moves-rune","exception":"timing","ref":"lgse/strata#2200","differs":"line 4 waits for the selection, where the original waits out the highlight"}}'''

[[pairs.case]]
name = "a twin under platform, which never carries one"
problem = '''scenarios/keys/moves-rune.jsonl names the exception "platform", which never carries a twin: the same file runs on the session host, so its run is pending or required with that host'''

[[pairs.case.edit]]
header = "keys/moves-rune"
find = '''"exception":"timing"'''
put = '''"exception":"platform"'''

[[pairs.case]]
