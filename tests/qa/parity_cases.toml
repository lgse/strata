file = "keys"
find = '''blocker = "A2"
'''
put = '''blocker = "A2"
ruling = "the owner, 2026-11-11"
'''
problem = "keys.toml: renames/list is pending, so it has no ruling"

[[case]]
name = "a required run names no host"
file = "keys"
find = '''status = "required"
host = "offscreen"
'''
put = '''status = "required"
'''
problem = "keys.toml: moves/columns-arrows is required without a host"

[[case]]
name = "a required run keeps its old excuse"
file = "keys"
find = '''host = "offscreen"
'''
put = '''host = "offscreen"
reason = "harness"
blocker = "field"
'''
problem = "keys.toml: moves/columns-arrows is required, so it has no reason, blocker or ruling"

[[case]]
name = "an excluded run cites no ruling"
file = "pictures"
find = 'ruling = "the owner, 2026-11-11"'
put = 'ruling = ""'
problem = "pictures.toml: looks/icons is excluded without a ruling"

[[case]]
name = "an excluded run is also blocked"
file = "pictures"
append = '''reason = "scope"
blocker = "A1"
'''
problem = "pictures.toml: looks/icons is excluded, so it has no host, reason or blocker"

# A parallel run and its twin.

[[case]]
name = "a parallel run names no exception"
file = "keys"
find = '''status = "pending"
reason = "scope"
blocker = "A2"
'''
put = '''status = "parallel"
twin = "renames-rune/list"
ref = "lgse/strata#2200"
'''
problem = 'keys.toml: renames/list is parallel without an exception'

[[case]]
name = "a parallel run names no twin"
file = "keys"
find = '''status = "pending"
reason = "scope"
blocker = "A2"
'''
put = '''status = "parallel"
exception = "timing"
ref = "lgse/strata#2200"
'''
problem = 'keys.toml: renames/list is parallel without a twin'

[[case]]
name = "a parallel run cites no reference"
file = "keys"
find = '''status = "pending"
reason = "scope"
blocker = "A2"
'''
put = '''status = "parallel"
exception = "timing"
twin = "renames-rune/list"
'''
problem = 'keys.toml: renames/list is parallel without a ref'

[[case]]
name = "a parallel run keeps its old excuse"
file = "keys"
find = '''status = "pending"
reason = "scope"
blocker = "A2"
'''
put = '''status = "parallel"
exception = "timing"
twin = "renames-rune/list"
ref = "lgse/strata#2200"
blocker = "A2"
'''
problem = 'keys.toml: renames/list is parallel, so it has no reason, blocker or ruling'

[[case]]
name = "a parallel run under a code the plan does not have"
file = "keys"
find = '''status = "pending"
reason = "scope"
blocker = "A2"
'''
put = '''status = "parallel"
exception = "flaky"
twin = "renames-rune/list"
ref = "lgse/strata#2200"
'''
problem = 'keys.toml: renames/list names the exception "flaky", which is none: a twin is allowed under timing, a11y, rune, oracle, toolkit or deviation'

[[case]]
name = "a parallel run under platform, which never carries a twin"
file = "keys"
find = '''status = "pending"
reason = "scope"
blocker = "A2"
'''
put = '''status = "parallel"
exception = "platform"
twin = "renames-rune/list"
ref = "lgse/strata#2200"
'''
problem = 'keys.toml: renames/list names the exception "platform", which never carries a twin: the same file runs on the session host, so its run is pending or required with that host'

[[case]]
name = "a parallel run under a pending reason"
file = "keys"
find = '''status = "pending"
reason = "scope"
blocker = "A2"
'''
put = '''status = "parallel"
exception = "scope"
twin = "renames-rune/list"
ref = "lgse/strata#2200"
'''
problem = 'keys.toml: renames/list names the exception "scope", which is a pending reason and no exception: the run stays pending until its blocker is gone'

[[case]]
name = "a parallel run names another run as its twin"
file = "keys"
find = '''status = "pending"
reason = "scope"
blocker = "A2"
'''
put = '''status = "parallel"
exception = "timing"
twin = "renames-rune/columns"
ref = "lgse/strata#2200"
'''
problem = 'keys.toml: renames/list names the twin "renames-rune/columns": the twin of renames/list is renames-rune/list'

[[case]]
name = "a parallel run cites something that is no issue"
file = "keys"
find = '''status = "pending"
reason = "scope"
blocker = "A2"
'''
put = '''status = "parallel"
exception = "timing"
twin = "renames-rune/list"
ref = "issue 2200"
'''
problem = 'keys.toml: renames/list cites "issue 2200", which is no reference: it is the issue, lgse/strata#<number>'

[[case]]
name = "a parallel run under rune cites an issue, not its packet entry"
file = "keys"
find = '''status = "pending"
reason = "scope"
blocker = "A2"
'''
put = '''status = "parallel"
exception = "rune"
twin = "renames-rune/list"
ref = "lgse/strata#2200"
'''
problem = 'keys.toml: renames/list cites "lgse/strata#2200", which is no packet entry: a rune twin names the entry it expires with, docs/rune/upstream/rune/<number>-<name>.md'

[[case]]
name = "a required run names a twin"
file = "keys"
find = '''host = "offscreen"
'''
put = '''host = "offscreen"
twin = "moves-rune/columns-arrows"
'''
problem = "keys.toml: moves/columns-arrows is required, so it has no exception, twin or ref"

[[case]]
name = "a twin's run has an entry of its own"
file = "keys"
append = '''
[[run]]
scenario = "renames-rune"
run = "list"
package = "A2"
status = "required"
host = "offscreen"
'''
problem = "keys.toml: renames-rune/list is a twin's run, which has no entry of its own: it is listed as the twin of the parallel run it stands in for"

# What a reader cannot read.

