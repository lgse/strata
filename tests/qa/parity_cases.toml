find = '''package = "A7"
gate = "G2"
'''
put = '''package = "A7"
'''
problem = "keys.toml: moves/columns-keys belongs to gate G2"

[[case]]
name = "a run of the slice's set is under another gate"
file = "keys"
find = '''package = "A7"
gate = "G2"
'''
put = '''package = "A7"
gate = "G3"
'''
problem = "keys.toml: moves/columns-keys belongs to gate G2"

[[case]]
name = "a run outside the slice's set has a gate"
file = "keys"
find = '''package = "A2"
'''
put = '''package = "A2"
gate = "G3"
'''
problem = "keys.toml: renames/list has a gate, and is no Columns run of the slice's set"

# The owner.

[[case]]
name = "a run names no package of the plan"
file = "keys"
find = 'package = "A2"'
put = 'package = "A22"'
problem = 'keys.toml: renames/list names "A22", which is no package of the parity plan'

[[case]]
name = "a run of the slice's own is no longer required"
file = "keys"
find = '''status = "required"
host = "offscreen"
'''
put = '''status = "pending"
reason = "scope"
blocker = "A7"
'''
problem = 'keys.toml: moves/columns-arrows names "V7", which owns only the required runs of gate G1'

[[case]]
name = "a pending run of the slice's set takes a slice package"
file = "keys"
find = 'package = "A7"'
put = 'package = "V8"'
problem = 'keys.toml: moves/columns-keys names "V8", which owns only the required runs of gate G2'

[[case]]
name = "a slice package owns a run of another gate"
file = "keys"
find = 'package = "V7"'
put = 'package = "V9"'
problem = 'keys.toml: moves/columns-arrows names "V9", which owns only the required runs of gate G3'

[[case]]
name = "a slice package owns a run outside the set"
file = "keys"
find = 'package = "A2"'
put = 'package = "V8"'
problem = 'keys.toml: renames/list names "V8", which owns only the required runs of gate G2'

# The fields of each status.

[[case]]
name = "a pending run gives no reason"
file = "keys"
find = '''reason = "scope"
blocker = "A2"
'''
put = '''blocker = "A2"
'''
problem = "keys.toml: renames/list is pending without a reason"

[[case]]
name = "a pending run names no blocker"
