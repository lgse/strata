# What the parity ledger's two readers accept and refuse. The runner's tests read this table
# (tests/qa/parity_tests.rs) and so do the scripts' (scripts/test_qa_parity.py), so the
# reader that checks the ledger in the runner's tests (tests/qa/parity.rs) and the one every
# ./scripts/qa-parity.sh selection goes through (scripts/qa_parity_check.py) cannot drift
# apart. A change to the schema adds its rows here first: a good one to `ledger` or
# `accepted`, and a `case` for each thing it refuses.
#
#   planned    the runs the runner plans in a made-up corpus of two folders, in its order.
#   ledger     a ledger both readers accept for it: a file's text for each folder.
#   case       an edit to that ledger which both refuse. `problem` is the one line both
#              report, word for word. `refused` is for what a reader cannot read at all, an
#              unknown field or value or a missing one: each reader says it in its own
#              words, which contain this text.
#   accepted   an edit both still accept.
#
# An edit names a `file`, and either `find` and `put` (text of the file that occurs once,
# and what takes its place), `append` (text added at its end), `text` (the whole file, which
# need not exist yet) or `remove = true` (the file is gone).
#
# This first corpus has no scenario headers, so its cases are the rules an entry answers to
# alone: a `parallel` entry is accepted here for its fields. Whether its twin exists and
# agrees with it is the second corpus's, `[pairs]` at the end of the file, which has headers.

[[planned]]
folder = "keys"
scenario = "moves"
run = "columns-arrows"
gate = "G1"

[[planned]]
folder = "keys"
scenario = "moves"
run = "columns-keys"
gate = "G2"

[[planned]]
folder = "keys"
scenario = "renames"
run = "list"

[[planned]]
folder = "pictures"
scenario = "looks"
run = "icons"

[ledger]
keys = '''
[[run]]
scenario = "moves"
run = "columns-arrows"
package = "V7"
gate = "G1"
status = "required"
host = "offscreen"

[[run]]
scenario = "moves"
run = "columns-keys"
package = "A7"
gate = "G2"
status = "pending"
reason = "scope"
blocker = "A7: undo"

[[run]]
scenario = "renames"
run = "list"
package = "A2"
status = "pending"
reason = "scope"
blocker = "A2"
'''
pictures = '''
[[run]]
scenario = "looks"
run = "icons"
package = "E1"
status = "excluded"
ruling = "the owner, 2026-11-11"
'''

# Where an entry stands.

[[case]]
name = "a run of the folder is missing"
file = "keys"
find = '''
[[run]]
scenario = "renames"
run = "list"
package = "A2"
status = "pending"
reason = "scope"
blocker = "A2"
'''
put = ""
problem = "keys.toml: renames/list is not listed"

[[case]]
name = "a run is listed twice"
file = "keys"
find = '''blocker = "A7: undo"
'''
put = '''blocker = "A7: undo"

[[run]]
scenario = "moves"
run = "columns-keys"
package = "A7"
gate = "G2"
status = "pending"
reason = "scope"
blocker = "A7: undo"
'''
problem = "keys.toml: moves/columns-keys is listed twice"

[[case]]
name = "a run no longer exists"
file = "keys"
append = '''
[[run]]
scenario = "moves"
run = "icons"
package = "A1"
status = "pending"
reason = "scope"
blocker = "A1"
'''
problem = "keys.toml: moves/icons is no run of the folder"

[[case]]
name = "a run is another folder's"
file = "keys"
append = '''
[[run]]
scenario = "looks"
run = "icons"
package = "A1"
status = "pending"
reason = "scope"
blocker = "A1"
'''
problem = "keys.toml: looks/icons is no run of the folder"

[[case]]
name = "a run stands before one the runner plans earlier"
file = "keys"
text = '''
[[run]]
scenario = "moves"
run = "columns-arrows"
package = "V7"
gate = "G1"
status = "required"
host = "offscreen"

[[run]]
scenario = "renames"
run = "list"
package = "A2"
status = "pending"
reason = "scope"
blocker = "A2"

[[run]]
scenario = "moves"
run = "columns-keys"
package = "A7"
gate = "G2"
status = "pending"
reason = "scope"
blocker = "A7: undo"
'''
problem = "keys.toml: moves/columns-keys is out of the runner's order: it belongs before renames/list"

[[case]]
name = "a folder has no file"
file = "pictures"
remove = true
problem = "pictures.toml is missing: tests/qa/scenarios/pictures has no ledger"

[[case]]
name = "a file is named for no folder"
file = "sounds"
text = ""
problem = "sounds.toml names no folder of tests/qa/scenarios"

# The gate.

