[pytest]
testpaths = tests/e2e/unit tests/e2e/scenarios
python_files = test_*.py
# Scenarios run serially within each isolated display/worker. CI tightens this
# diagnostic cap to 60 seconds; the local runner allows slower debugging.
addopts = -p no:randomly --timeout=180 --timeout-method=signal -ra
# Pytest-xdist cannot reconstruct PyGIDeprecationWarning through gi.__getattr__.
filterwarnings =
    ignore:GLib\.unix_signal_add_full is deprecated; use GLibUnix\.signal_add_full instead:DeprecationWarning
markers =
    preferences: seed Strata preferences for a scenario
    baseline: compares against a committed golden screenshot
