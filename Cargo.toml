[package]
name = "strata"
version = "0.7.0"
edition = "2024"
description = "A fast, keyboard-first file manager for Linux"
authors = ["LGSE Ltd."]
license = "GPL-3.0-or-later"
repository = "https://github.com/LGSE/strata"
keywords = ["file-manager", "gtk4", "linux", "wayland"]
categories = ["filesystem", "gui"]

[dependencies]
cairo-rs = { version = "0.21.5", features = ["pdf", "png"] }
flate2 = "1.1.10"
fontconfig-sys = { package = "yeslogic-fontconfig-sys", version = "6.0.1" }
gdk-pixbuf = "0.21.5"
gio = { version = "0.21.5", features = ["v2_72"] }
glib = "0.21.5"
gtk = { package = "gtk4", version = "0.10.3", features = ["v4_12"] }
html5gum = { version = "0.8", default-features = false }
ignore = "0.4.23"
poppler = { package = "poppler-rs", version = "0.25.0" }
pulldown-cmark = { version = "0.13", default-features = false }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
sevenz-rust2 = "0.22.2"
sourceview5 = { version = "0.10.0", features = ["gtk_v4_12"] }
tar = "0.4.46"
tempfile = "3.27.0"
toml = "0.9"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
ureq = { version = "3.4", features = ["json"] }
zip = "8.6.0"

[build-dependencies]
glib-build-tools = "0.21.0"

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unused_unsafe = "deny"

[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
unimplemented = "warn"
unwrap_used = "warn"
