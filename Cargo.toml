# One workspace for Strata, its shared crates, and its Rune interface (docs/workspace.md).
[workspace]
resolver = "3"
members = [
    "crates/*",
    # The peer process of strata-platform's compositor tests: test tooling, never published.
    "crates/strata-platform/tests/support/strata-test-peer",
]

[workspace.package]
# The Rune-side crates inherit these two. The shared crates and the application set their own
# version.
version = "0.0.1"
rust-version = "1.99.1"
edition = "2024"
authors = ["LGSE Ltd."]
license = "MIT"
repository = "https://github.com/LGSE/strata"

# Versions shared by the root package and the crates under crates/.
[workspace.dependencies]
cairo-rs = { version = "0.22.9", features = ["pdf", "png"] }
calamine = "0.38.0"
csv = "1.4.0"
docx-rs = { version = "0.4.22", default-features = false }
fitparser = "0.12.0"
flate2 = "1.1.10"
frizbee = "0.13"
futures-channel = "0.3.31"
futures-lite = "2.6.1"
gdk-pixbuf = "0.22.0"
gio = { version = "0.22.11", features = ["v2_72"] }
gio-unix = "0.22.8"
glib = "0.22.9"
glib-build-tools = "0.22.8"
hex = "0.4.3"
html5gum = { version = "0.9.2", default-features = false }
ignore = "0.4.23"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
kamadak-exif = "0.6.1"
landlock = "0.4.7"
libc = "0.2"
mermaid-svg = "0.7.0"
pango = "0.22.9"
poppler = { package = "poppler-rs", version = "0.26.0" }
pulldown-cmark = { version = "0.13", default-features = false }
quick-xml = "0.41.0"
regex = "1.13.1"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }
ring = "0.17.14"
rquickjs = "0.13.0"
rust-i18n = "4.2.4"
rust-i18n-support = { version = "4.2.4", features = ["codegen"] }
rustix = { version = "1.1.4", features = ["fs", "process", "event", "net", "mount", "thread", "stdio", "pipe", "time"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
seccompiler = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
sevenz-rust2 = "0.22.2"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
toml = "1.1"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
unicode-normalization = "0.1.25"
unrar = "0.5.8"
unrar_sys = "0.5.8"
# The update downloader implements `ureq::unversioned` transport traits, which
# may change in a minor release.
ureq = { version = "~3.4", features = ["json"] }
zip = "9.0.4"
zstd = "0.14.3"

strata-core = { version = "0.0.0", path = "crates/strata-core", default-features = false }
strata-desktop = { version = "0.0.0", path = "crates/strata-desktop" }
strata-fs = { version = "0.0.0", path = "crates/strata-fs", default-features = false }
strata-preview = { version = "0.0.0", path = "crates/strata-preview", default-features = false }
strata-qa = { version = "0.0.0", path = "crates/strata-qa" }
strata-test-support = { version = "0.0.0", path = "crates/strata-test-support" }

# The Rune side.
# Rune is pre-release and not on crates.io. Every Rune crate pins the same `dev` rev; move
# them together, on purpose (docs/rune/plan.md §0).
# Rune's defaults minus `embedded-fonts` (strata-kit supplies JetBrains Mono; tests enable it),
# `wayland-csd-title` (Strata windows are borderless with custom chrome), the macOS-only
# `metal-backend`, `hunspell`, and `ogg-audio` (MPL-2.0 decoders).
rune = { version = "0.0.1", git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb", default-features = false, features = ["accessibility", "dbus", "svg"] }
rune-kit = { version = "0.0.1", git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb" }
rune-fx = { version = "0.0.1", git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb" }

strata-app = { version = "0.0.1", path = "crates/strata-app", default-features = false }
strata-components = { version = "0.0.1", path = "crates/strata-components" }
strata-kit = { version = "0.0.1", path = "crates/strata-kit" }
strata-platform = { version = "0.0.1", path = "crates/strata-platform" }
# Test-only and never published; cargo-deny's `wildcards` ban needs its version.
strata-test-peer = { version = "0.0.1", path = "crates/strata-platform/tests/support/strata-test-peer" }

# Third-party crates the Rune interface and its platform shims use.
png = "0.18"
swash = "0.2.10"
syntect = { version = "5.3.0", default-features = false }
tokio = { version = "1", default-features = false }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
wayland-backend = "0.3"
wayland-client = "0.31"
wayland-protocols = "0.32"
wayland-protocols-misc = "0.3"
wayland-protocols-wlr = "0.3"
wgpu = { version = "30.0.1", default-features = false }
x11rb = "0.13"
xkbcommon = "0.9"
zbus = { version = "6", default-features = false }

[package]
name = "strata"
version = "1.2.2"
edition.workspace = true
description = "A fast, keyboard-first file manager for Linux"
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["file-manager", "linux", "wayland"]
categories = ["filesystem", "gui"]

[lints]
workspace = true

[features]
default = ["rar"]
rar = ["strata-app/rar"]
# The scripted `--qa` launch mode. Never in releases.
qa = ["strata-app/qa"]
# Exact but slow consistency checks; tests and QA builds turn them on.
invariant-checks = ["strata-app/invariant-checks"]
# Test hooks and test-only items of the workspace crates.
test-support = ["strata-app/test-support"]

[dependencies]
strata-app.workspace = true

[dev-dependencies]
flate2.workspace = true
gio.workspace = true
glib.workspace = true
hex.workspace = true
image.workspace = true
png.workspace = true
regex.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
strata-qa.workspace = true
strata-test-peer.workspace = true
tar.workspace = true
tempfile.workspace = true
toml.workspace = true
zip.workspace = true

[[test]]
name = "qa"
path = "tests/qa.rs"
required-features = ["qa"]
harness = false

[profile.release]
# Whole-program optimization for the hot listing/sort/insert paths. Build
# time only: no runtime behavior change. (Stripping stays in the packaging
# flow, not here, so crash reports keep symbols.)
lto = true
codegen-units = 1

# The Rune side's perf tests (`cargo test --profile perf … -- --ignored`), as Rune's own
# workspace sets it.
[profile.perf]
inherits = "release"
opt-level = 3
codegen-units = 16
lto = false
debug = false
incremental = false

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unused_unsafe = "deny"

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
unimplemented = "warn"
unwrap_used = "warn"

# Patches Rune's root Cargo.toml carries ("Depending on Rune" in crates/rune/README.md).
# Cargo does not inherit a dependency's [patch] table; move these revs with `rune` above.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb" }
naga = { git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb" }
