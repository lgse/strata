# Bundled Strata theme catalog.
# Imported Tinted Base16 palettes use this semantic mapping:
# 00 background, 01 surface, 05 text, 0D accent, 08 danger,
# 02 muted/highlight, 03 border, and 04 dim text.

# Syntax: 0E keywords, 0B strings, 09 constants, 0A types, 0C preprocessor.
# Catppuccin uses catppuccin-mocha; Tokyo Night uses tokyo-night-dark.
# Azure Glow and Omarchy Light use original curated syntax palettes.

