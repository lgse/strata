[package]
name = "strata-app"
description = "Strata's interface on Rune: the application state, its view and the loops that host it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# UnRAR for archive browsing and RAR-based covers, on by default as in the GTK application's
# default build (the root package's `rar`). A build without UnRAR is `--no-default-features`.
default = ["rar"]
rar = ["strata-core/rar", "strata-fs/rar", "strata-preview/rar"]
# The scripted `--qa` mode (docs/rune/slice/V7-rune-qa-backend.md), on the offscreen host
# or, in a compositor, on the session host, whose input goes through Wayland's virtual
# keyboard and pointer. Never in a release build.
qa = [
    "dep:rustix",
    "dep:serde_json",
    "dep:strata-qa",
    "dep:unicode-segmentation",
    "dep:wayland-client",
    "dep:wayland-protocols-misc",
    "dep:wayland-protocols-wlr",
    "dep:xkbcommon",
    "strata-core/qa",
]

# The one crate that knows both sides: Strata's shared crates and the Rune side
# (docs/workspace.md). It never depends on gtk4, gdk4, sourceview5 or the `strata` package.
[dependencies]
rune.workspace = true
rune-kit.workspace = true
strata-components.workspace = true
strata-core.workspace = true
strata-desktop = { workspace = true, features = ["xkb-keys"] }
strata-fs.workspace = true
strata-kit.workspace = true
strata-platform = { workspace = true, features = ["csd", "glib-loop"] }
# The sandbox's thumbnail workers, by the owner's ruling of 2026-11-12 ("in strata-rune until E4").
strata-preview.workspace = true
gio.workspace = true
glib.workspace = true
image.workspace = true
rust-i18n.workspace = true
rustix = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
strata-qa = { workspace = true, optional = true }
tracing.workspace = true
unicode-segmentation = { workspace = true, optional = true }
wayland-client = { workspace = true, optional = true }
wayland-protocols-misc = { workspace = true, features = ["client"], optional = true }
wayland-protocols-wlr = { workspace = true, features = ["client"], optional = true }
xkbcommon = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
strata-test-support.workspace = true
tempfile.workspace = true
toml.workspace = true
