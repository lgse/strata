[package]
name = "strata-media-helper"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
strata-media-protocol = { path = "../media-protocol" }
cairo-rs = { version = "0.22.9", features = ["pdf", "png"] }
gdk-pixbuf = "0.22.0"
gio = { version = "0.22.9", features = ["v2_72"] }
gstreamer = { version = "0.25.3", features = ["v1_20"] }
gstreamer-app = { version = "0.25.2", features = ["v1_20"] }
poppler = { package = "poppler-rs", version = "0.26.0" }
rustix = { version = "1.1.4", features = ["process", "event", "thread"] }
serde_json = "1.0"
tempfile = "3.27.0"

[lints]
workspace = true
