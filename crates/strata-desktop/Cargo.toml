[package]
name = "strata-desktop"
version = "0.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Strata's desktop integration: portal setup, the updater, integrations, the saved settings, the tab session and build information"
publish = false

[lints]
workspace = true

[features]
# Test-only items that other crates' tests use. Never in a release build.
test-support = [
    "strata-core/test-support",
    "strata-fs/test-support",
    "strata-preview/test-support",
]
# The key library that asks libxkbcommon for what `keys::Table` does not answer. Only the
# Rune interface enables it, and the GTK application's tests, which hold it to GDK. Never
# in the GTK application itself, which asks GDK.
xkb-keys = ["dep:xkbcommon"]

[dependencies]
strata-core.workspace = true
strata-fs.workspace = true
strata-preview.workspace = true
flate2.workspace = true
gio.workspace = true
gio-unix.workspace = true
glib.workspace = true
hex.workspace = true
ring.workspace = true
rust-i18n.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
toml.workspace = true
tracing.workspace = true
ureq.workspace = true
# Not the workspace's entry: that one has the default features, which this does not need.
xkbcommon = { version = "0.9.0", default-features = false, optional = true }
zstd.workspace = true

[dev-dependencies]
strata-core = { workspace = true, features = ["test-support"] }
strata-fs = { workspace = true, features = ["test-support"] }
strata-test-support.workspace = true
libc.workspace = true
rustls.workspace = true
