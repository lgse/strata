[package]
name = "strata-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Strata's model, localization and storage, with no interface toolkit"
publish = false

[lints]
workspace = true

[features]
default = ["rar"]
# RAR archives count as a supported format.
rar = []
# Test-only items that other crates' tests use. Never in a release build.
test-support = []

[dependencies]
futures-channel.workspace = true
gio.workspace = true
glib.workspace = true
libc.workspace = true
rust-i18n.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
strata-test-support.workspace = true

[build-dependencies]
rust-i18n-support.workspace = true
