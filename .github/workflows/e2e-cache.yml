name: Warm E2E dependencies

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - Cargo.toml
      - Cargo.lock
      - tests/e2e/Dockerfile
      - tests/e2e/requirements.txt
      - tests/e2e/install-packages.sh
      - .dockerignore
      - .github/workflows/e2e-cache.yml
  schedule:
    - cron: '23 4 * * *'
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - tests/e2e/Dockerfile
      - tests/e2e/requirements.txt
      - tests/e2e/install-packages.sh
      - .dockerignore
      - .github/workflows/e2e-cache.yml

permissions:
  contents: read

concurrency:
  group: e2e-cache-warm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  warm:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Container account
        id: identity
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"
          echo "image_key=$(python3 scripts/e2e_bundle.py image-key)" >> "$GITHUB_OUTPUT"

      - name: Set up cached container builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Cache pinned packages, Python, Rust, and locked Rust dependencies
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tests/e2e/Dockerfile
          target: dependencies
          platforms: linux/amd64
          build-args: |
            E2E_UID=${{ steps.identity.outputs.uid }}
            E2E_GID=${{ steps.identity.outputs.gid }}
            E2E_IMAGE_KEY=${{ steps.identity.outputs.image_key }}
          cache-from: |
            type=gha,scope=strata-e2e-dependencies-v1
            type=gha,scope=strata-e2e-v1
          cache-to: type=gha,mode=max,scope=strata-e2e-dependencies-v1
