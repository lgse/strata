name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, and test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native development libraries
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes libfontconfig1-dev libgtk-4-dev libgtksourceview-5-dev libpoppler-glib-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

  e2e-build:
    name: E2E build and plan
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    # Preserve cold-build diagnostics without exempting them from the 180s gate.
    # The separate warmer publishes the large dependency cache.
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Container account
        id: identity
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"
          echo "image_key=$(python3 scripts/e2e_bundle.py image-key)" >> "$GITHUB_OUTPUT"

      - name: Set up cached container builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the tested revision once and collect its exact inventory
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tests/e2e/Dockerfile
          target: bundle
          platforms: linux/amd64
          build-args: |
            E2E_UID=${{ steps.identity.outputs.uid }}
            E2E_GID=${{ steps.identity.outputs.gid }}
            E2E_IMAGE_KEY=${{ steps.identity.outputs.image_key }}
            STRATA_BUILD_COMMIT=${{ github.sha }}
          outputs: type=local,dest=target/e2e-bundle
          cache-from: |
            type=gha,scope=strata-e2e-bundle-v1
            type=gha,scope=strata-e2e-dependencies-v1
            type=gha,scope=strata-e2e-v1
          cache-to: type=gha,mode=min,scope=strata-e2e-bundle-v1

      - name: Export the pinned runtime once for every shard
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tests/e2e/Dockerfile
          target: runtime
          platforms: linux/amd64
          build-args: |
            E2E_UID=${{ steps.identity.outputs.uid }}
            E2E_GID=${{ steps.identity.outputs.gid }}
            E2E_IMAGE_KEY=${{ steps.identity.outputs.image_key }}
          tags: strata-e2e:ci-runtime
          outputs: type=docker,dest=target/e2e-bundle/runtime.tar
          cache-from: |
            type=gha,scope=strata-e2e-dependencies-v1
            type=gha,scope=strata-e2e-v1

      - name: Compress the runtime without another image load or build
        run: zstd -T0 -1 --rm target/e2e-bundle/runtime.tar

      - name: Generate the runner matrix
        id: plan
        run: python3 scripts/e2e_ci.py matrix target/e2e-bundle/plan.json >> "$GITHUB_OUTPUT"

      - name: Share the binary, plan, and runtime, not Cargo or a toolchain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-bundle-${{ github.run_attempt }}
          path: target/e2e-bundle
          compression-level: 1
          if-no-files-found: error
          retention-days: 1

      - name: Share the small plan separately for aggregation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-plan-${{ github.run_attempt }}
          path: target/e2e-bundle/plan.json
          if-no-files-found: error
          retention-days: 1

  e2e-shard:
    name: E2E shard ${{ matrix.shard }}
    needs: e2e-build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e-build.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download this attempt's binary, runtime, and complete shard plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-bundle-${{ github.run_attempt }}
          path: target/e2e-bundle

      - name: Load the shared runtime without BuildKit or registry access
        shell: bash
        run: zstd -dc target/e2e-bundle/runtime.tar.zst | docker load

      - name: Run the assigned scenarios without rebuilding or installing
        env:
          STRATA_E2E_IMAGE: strata-e2e:ci-runtime
          STRATA_E2E_BUNDLE: target/e2e-bundle
          STRATA_E2E_WORKERS: '2'
          SHARD: ${{ matrix.shard }}
        run: |
          chmod +x target/e2e-bundle/strata
          ./scripts/e2e.sh -p no:cacheprovider --timeout=60 \
            --e2e-plan=target/e2e-bundle/plan.json --e2e-shard="$SHARD" \
            --e2e-report="target/e2e-reports/shard-$SHARD.json" \
            --junitxml="target/e2e-reports/shard-$SHARD.xml" --durations=10

      - name: Upload shard results even on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report-${{ github.run_attempt }}-${{ matrix.shard }}
          path: target/e2e-reports
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-${{ github.run_attempt }}-${{ matrix.shard }}
          path: target/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: End-to-end GUI suite
    needs: [e2e-build, e2e-shard]
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the plan
        if: ${{ needs.e2e-build.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-plan-${{ github.run_attempt }}
          path: target/e2e-bundle

      - name: Download all shard reports
        if: ${{ !cancelled() && needs.e2e-build.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-report-${{ github.run_attempt }}-*
          path: target/e2e-reports
          merge-multiple: true

      - name: Require every dependency to succeed
        if: ${{ always() }}
        env:
          BUILD_RESULT: ${{ needs.e2e-build.result }}
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
        run: test "$BUILD_RESULT" = success && test "$SHARD_RESULT" = success

      - name: Verify exact coverage
        run: python3 scripts/e2e_ci.py verify target/e2e-bundle/plan.json target/e2e-reports

      - name: Enforce and report the three-minute critical path, including failures
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/e2e_ci.py budget

  release-scripts:
    name: Release workflow scripts
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test release version calculation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  repository-policy:
    name: Dependency and spelling policy
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

      - name: Check spelling
        if: ${{ !cancelled() }}
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1
