name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-build:
    name: Quality build and lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    timeout-minutes: 20
    outputs:
      environment_image: ${{ steps.environment.outputs.environment_image }}
      candidate: ${{ steps.environment.outputs.candidate }}
      inputs: ${{ steps.environment.outputs.inputs }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up image inspection
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - name: Resolve the shared environment or build an explicit recipe update
        id: environment
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: |
          if reference="$(python3 scripts/image_registry.py environment)"; then
            docker pull --platform=linux/amd64 "${reference#environment_image=}"
          else
            git cat-file -e "$BASE_REF^{commit}"
            if git diff --quiet "$BASE_REF" HEAD -- tests/container; then
              echo 'The unchanged environment is unavailable. Restore public access; ordinary quality runs do not bootstrap distribution packages.' >&2
              exit 1
            else
              status=$?
              if [[ "$status" != 1 ]]; then exit "$status"; fi
            fi
            echo 'Environment inputs changed: explicitly building this unpublished candidate without publishing it.'
            reference="environment_image=$(python3 scripts/image_base.py build --engine docker)"
            echo 'candidate=true' >> "$GITHUB_OUTPUT"
          fi
          printf '%s\n' "$reference" >> "$GITHUB_OUTPUT"
          echo "inputs=$(python3 scripts/image_inputs.py image-key)" >> "$GITHUB_OUTPUT"

      - name: Restore quality-only Cargo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/quality-container/cargo
            target/quality-container/build
          key: strata-quality-v1-${{ steps.environment.outputs.inputs }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            strata-quality-v1-${{ steps.environment.outputs.inputs }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}-

      - name: Check formatting
        env:
          STRATA_CONTAINER_ENGINE: docker
          STRATA_QUALITY_IMAGE: ${{ steps.environment.outputs.environment_image }}
        run: ./scripts/quality.sh fmt

      - name: Run Clippy
        env:
          STRATA_CONTAINER_ENGINE: docker
          STRATA_QUALITY_IMAGE: ${{ steps.environment.outputs.environment_image }}
        run: ./scripts/quality.sh clippy

      - name: Check and exercise the build without UnRAR
        env:
          IMAGE: ${{ steps.environment.outputs.environment_image }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=2g,mode=1777 \
            --mount "type=bind,source=$PWD,target=/workspace" \
            --mount "type=bind,source=$PWD/target/quality-container/accounts-$(id -u)-$(id -g)/passwd,target=/etc/passwd,readonly" \
            --mount "type=bind,source=$PWD/target/quality-container/accounts-$(id -u)-$(id -g)/group,target=/etc/group,readonly" \
            --workdir /workspace \
            --env HOME=/tmp/strata-quality-home \
            --env CARGO_HOME=/workspace/target/quality-container/cargo \
            --env CARGO_TARGET_DIR=/workspace/target/quality-container/build \
            --env CARGO_PROFILE_DEV_DEBUG=0 --env CARGO_INCREMENTAL=0 \
            "$IMAGE" bash -euc '
              mkdir -p "$HOME"
              cargo tree --locked --no-default-features -e normal,build --prefix none > /tmp/dependencies.txt
              if grep -E "^unrar(_sys)? v" /tmp/dependencies.txt; then
                echo "UnRAR must not be in the feature-disabled dependency graph" >&2
                exit 1
              fi
              cargo tree --locked -e normal,build --prefix none > /tmp/default-dependencies.txt
              if grep -E "^(x11rb|wayland-client|wayland-protocols-(misc|wlr)|xkbcommon) v" /tmp/dependencies.txt /tmp/default-dependencies.txt; then
                echo "x11rb, wayland-client, wayland-protocols-misc, wayland-protocols-wlr and xkbcommon, the input clients of the qa feature, must not be in a default or feature-disabled build" >&2
                exit 1
              fi
              cargo check --locked --all-targets --no-default-features
              cargo test --locked --all-targets --no-default-features launch_mode
              cargo test --locked --all-targets --no-default-features services::operations::tests
              cargo test --locked --all-targets --no-default-features rar_disabled
              xvfb-run -a -s "-screen 0 1280x1024x24 -nolisten tcp -noreset" dbus-run-session -- \
                env -u WAYLAND_DISPLAY GDK_BACKEND=x11 GTK_A11Y=none NO_AT_BRIDGE=1 STRATA_REQUIRE_GTK_TESTS=1 \
                cargo test --locked --all-targets --no-default-features archive_extraction_actions_follow_build_support
            '

      - name: Compile all test targets once and plan the test shards
        env:
          STRATA_CONTAINER_ENGINE: docker
          STRATA_QUALITY_IMAGE: ${{ steps.environment.outputs.environment_image }}
          STRATA_QUALITY_TASK: build
        run: ./scripts/quality.sh test

      - name: Share test binaries and inventory
        if: ${{ github.event_name != 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-bundle-${{ github.run_attempt }}
          path: target/quality-bundle
          if-no-files-found: error
          retention-days: 1

      - name: Share the small quality plan separately
        if: ${{ github.event_name != 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-plan-${{ github.run_attempt }}
          path: target/quality-bundle/plan.json
          if-no-files-found: error
          retention-days: 1

      - name: Export an unpublished candidate environment for the shards
        if: github.event_name != 'push' && steps.environment.outputs.candidate == 'true'
        env:
          IMAGE: ${{ steps.environment.outputs.environment_image }}
        run: |
          mkdir -p target/quality-environment
          docker save "$IMAGE" | zstd -T0 -1 > target/quality-environment/image.tar.zst

      - name: Share the unpublished environment without publishing it
        if: github.event_name != 'push' && steps.environment.outputs.candidate == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-environment-${{ github.run_attempt }}
          path: target/quality-environment/image.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Save trusted quality cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/quality-container/cargo
            target/quality-container/build
          key: strata-quality-v1-${{ steps.environment.outputs.inputs }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}-${{ github.sha }}

  quality-shard:
    name: Rust tests shard ${{ matrix.shard }}
    if: ${{ github.event_name != 'push' }}
    needs: quality-build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull the exact published environment
        if: needs.quality-build.outputs.candidate != 'true'
        env:
          IMAGE: ${{ needs.quality-build.outputs.environment_image }}
        run: docker pull --platform=linux/amd64 "$IMAGE"

      - name: Download an unpublished candidate environment
        if: needs.quality-build.outputs.candidate == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quality-environment-${{ github.run_attempt }}
          path: target/quality-environment

      - name: Load the unpublished candidate
        if: needs.quality-build.outputs.candidate == 'true'
        run: zstd -dc target/quality-environment/image.tar.zst | docker load

      - name: Download this attempt's test binaries and plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quality-bundle-${{ github.run_attempt }}
          path: target/quality-bundle

      - name: Run assigned tests on a private display and bus without compiling
        env:
          STRATA_CONTAINER_ENGINE: docker
          STRATA_QUALITY_IMAGE: ${{ needs.quality-build.outputs.environment_image }}
          STRATA_QUALITY_TASK: shard
          STRATA_QUALITY_SHARD: ${{ matrix.shard }}
        run: ./scripts/quality.sh test

      - name: Share quality reports and logs even on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-report-${{ github.run_attempt }}-${{ matrix.shard }}
          path: target/quality-reports
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Format, lint, and test
    needs: [quality-build, quality-shard]
    if: ${{ always() && github.event_name != 'push' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful compilation, lint, and every shard
        env:
          BUILD_RESULT: ${{ needs.quality-build.result }}
          SHARD_RESULT: ${{ needs.quality-shard.result }}
        run: test "$BUILD_RESULT" = success && test "$SHARD_RESULT" = success

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the quality plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quality-plan-${{ github.run_attempt }}
          path: target/quality-bundle

      - name: Download all quality reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: quality-report-${{ github.run_attempt }}-*
          path: target/quality-reports
          merge-multiple: true

      - name: Verify exact Rust test coverage
        run: python3 scripts/quality_ci.py verify

  # QA scenarios run only when CI is started by hand.
  qa:
    name: QA scenarios
    needs: quality-build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull the exact published environment
        if: needs.quality-build.outputs.candidate != 'true'
        env:
          IMAGE: ${{ needs.quality-build.outputs.environment_image }}
        run: docker pull --platform=linux/amd64 "$IMAGE"

      - name: Download an unpublished candidate environment
        if: needs.quality-build.outputs.candidate == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quality-environment-${{ github.run_attempt }}
          path: target/quality-environment

      - name: Load the unpublished candidate
        if: needs.quality-build.outputs.candidate == 'true'
        run: zstd -dc target/quality-environment/image.tar.zst | docker load

      - name: Restore the quality build's Cargo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/quality-container/cargo
            target/quality-container/build
          key: strata-quality-v1-${{ needs.quality-build.outputs.inputs }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            strata-quality-v1-${{ needs.quality-build.outputs.inputs }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}-

      - name: Build the qa feature and run every scenario in the pinned container
        env:
          STRATA_CONTAINER_ENGINE: docker
          STRATA_TEST_IMAGE: ${{ needs.quality-build.outputs.environment_image }}
          STRATA_TEST_CARGO_CACHE: target/quality-container
        run: ./scripts/qa.sh

      - name: Confirm a qa build contains the text the release check rejects
        run: |
          strings target/quality-container/build/debug/strata | grep -F "usage: strata --qa"

      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-artifacts-${{ github.run_attempt }}
          path: target/qa-artifacts
          if-no-files-found: ignore
          retention-days: 7

  release-scripts:
    name: Release workflow scripts
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'push' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test CI and release helpers
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  repository-policy:
    name: Dependency and spelling policy
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

      - name: Check spelling
        if: ${{ !cancelled() }}
        uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3
