name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      mode:
        description: Release channel to publish
        required: true
        default: stable
        type: choice
        options:
          - stable
          - alpha
          - beta
          - rc
          - nightly
      source:
        description: PR number, branch, tag, or commit to publish (prereleases only; blank uses main)
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_RUST_VERSION: 1.98.0

jobs:
  prepare:
    name: Determine release version
    # Organization-owned repositories expose the organization, not a human owner.
    if: github.actor == vars.RELEASE_ACTOR
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.source.outputs.sha }}
      checkout_ref: ${{ steps.source.outputs.checkout_ref }}

    steps:
      - name: Require the default branch
        env:
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$BRANCH" != "$DEFAULT_BRANCH" ]]; then
            echo "Releases must be run from $DEFAULT_BRANCH (selected: $BRANCH)." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve source commit
        id: source
        env:
          MODE: ${{ inputs.mode }}
          SOURCE: ${{ inputs.source }}
        run: |
          if [[ "$MODE" == "stable" && -n "$SOURCE" ]]; then
            echo "Stable releases must use the current default-branch tip." >&2
            exit 1
          fi

          if [[ -z "$SOURCE" ]]; then
            sha="$(git rev-parse HEAD)"
            checkout_ref="$sha"
          elif [[ "$SOURCE" =~ ^[0-9]+$ ]]; then
            checkout_ref="refs/pull/${SOURCE}/head"
            git fetch --no-tags origin "$checkout_ref"
            sha="$(git rev-parse FETCH_HEAD)"
          else
            git fetch --no-tags origin "$SOURCE"
            sha="$(git rev-parse FETCH_HEAD)"
            checkout_ref="$sha"
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"

      - name: Calculate version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          MODE: ${{ inputs.mode }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          current_version="$(git show "$SOURCE_SHA:Cargo.toml" | grep -m1 -oP '^version = "\K\d+\.\d+\.\d+(?=")')"
          tags="$(git tag -l 'v*')"
          version="$(python3 scripts/release_version.py \
            --current-version "$current_version" \
            --bump "$BUMP" \
            --mode "$MODE" \
            --date "$(date --utc +%Y%m%d)" \
            --tags "$tags")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Guard against superseding an untested RC
        if: inputs.mode == 'stable'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # VERSION is the plain core version for a stable release. If an RC
          # already exists for this core version, a stable release must not
          # silently supersede it unless the RC's commit is already part of
          # this release's history -- otherwise a stable tag could publish
          # over an RC whose changes were never folded in and never tested
          # as stable.
          for tag in $(git tag -l "v${VERSION}-rc.*"); do
            if ! git merge-base --is-ancestor "$tag" "$SOURCE_SHA"; then
              echo "Tag $tag targets a commit not reachable from $SOURCE_SHA (the release source). A stable release must not silently supersede an untested RC." >&2
              exit 1
            fi
          done

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          persist-credentials: false

      - name: Verify source commit
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set release version
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [[ "$MODE" != "stable" ]]; then
            # Fail closed when targeting source older than release-channel
            # support; otherwise the archive tag and binary identity diverge.
            if ! grep -q 'STRATA_RELEASE_TAG' build.rs; then
              echo "The selected source does not support prerelease build metadata." >&2
              exit 1
            fi

            # Prerelease identity is injected at build time instead of being
            # written into Cargo.toml, which remains the stable version line.
            {
              echo "STRATA_RELEASE_TAG=v${VERSION}"
              echo "STRATA_BUILD_KIND=${MODE}"
            } >> "$GITHUB_ENV"
            exit 0
          fi

          python3 - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          manifest_path = pathlib.Path("Cargo.toml")
          manifest = manifest_path.read_text()
          manifest, count = re.subn(
              r'(^version = ")\d+\.\d+\.\d+("$)',
              rf'\g<1>{version}\2',
              manifest,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("could not update Cargo.toml package version")
          manifest_path.write_text(manifest)

          lock_path = pathlib.Path("Cargo.lock")
          lock = lock_path.read_text()
          lock, count = re.subn(
              r'(\[\[package\]\]\nname = "strata"\nversion = ")\d+\.\d+\.\d+("\n)',
              rf'\g<1>{version}\2',
              lock,
              count=1,
          )
          if count != 1:
              raise SystemExit("could not update the strata version in Cargo.lock")
          lock_path.write_text(lock)
          PY

      - name: Install native development libraries
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes libfontconfig1-dev libgtk-4-dev libgtksourceview-5-dev libpoppler-glib-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RELEASE_RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package binary
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          package="strata-${VERSION}-${TARGET}"
          mkdir -p "dist/$package"
          install -m 755 "target/$TARGET/release/strata" "dist/$package/strata"
          objcopy --only-keep-debug --compress-debug-sections=zlib "dist/$package/strata" "dist/$package.debug"
          strip --strip-unneeded "dist/$package/strata"
          objcopy --add-gnu-debuglink="dist/$package.debug" "dist/$package/strata"
          printf '%s\n' "$SOURCE_SHA" > "dist/$package/SOURCE_COMMIT"
          cp README.md LICENSE THIRD_PARTY_LICENSES.md "dist/$package/"
          install -m 644 data/io.github.lgse.Strata.desktop "dist/$package/"
          install -m 644 data/icons/scalable/apps/io.github.lgse.Strata.svg "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          (cd dist && sha256sum "$package.tar.gz" > "$package.tar.gz.sha256")
          (cd dist && sha256sum "$package.debug" > "$package.debug.sha256")

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: strata-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.debug
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Tag and publish release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Verify source commit
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Commit version and push tag
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          MODE: ${{ inputs.mode }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "$MODE" != "stable" ]]; then
            # A prerelease run tags the source commit but never pushes a
            # version-bump commit to the default branch.
            git fetch origin --tags
            if git rev-parse "v$VERSION" >/dev/null 2>&1; then
              echo "Tag v$VERSION already exists." >&2
              exit 1
            fi

            git tag -a "v$VERSION" -m "Strata v$VERSION"
            git push origin "v$VERSION"
            exit 0
          fi

          git fetch origin "$BRANCH" --tags
          if [[ "$(git rev-parse "origin/$BRANCH")" != "$SOURCE_SHA" ]]; then
            echo "The default branch changed while release binaries were building. Run the workflow again." >&2
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists." >&2
            exit 1
          fi

          python3 - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          for filename, pattern in (
              ("Cargo.toml", r'(^version = ")\d+\.\d+\.\d+("$)'),
              ("Cargo.lock", r'(\[\[package\]\]\nname = "strata"\nversion = ")\d+\.\d+\.\d+("\n)'),
          ):
              path = pathlib.Path(filename)
              text, count = re.subn(pattern, rf'\g<1>{version}\2', path.read_text(), count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"could not update version in {filename}")
              path.write_text(text)
          PY

          git add Cargo.toml Cargo.lock
          git commit -m "chore: release v$VERSION"
          git tag -a "v$VERSION" -m "Strata v$VERSION"
          git push --atomic origin "HEAD:$BRANCH" "v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [[ "$MODE" != "stable" ]]; then
            # --prerelease keeps /releases/latest pointing at the last final
            # release, which is the endpoint a Stable user polls.
            gh release create "v$VERSION" dist/* --verify-tag --generate-notes --prerelease --title "Strata v$VERSION"
          else
            gh release create "v$VERSION" dist/* --verify-tag --generate-notes --title "Strata v$VERSION"
          fi

  package:
    name: Prepare AUR package update
    needs: [prepare, release]
    if: inputs.mode != 'nightly'
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    environment: package-automation
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Install automation tools
        run: pacman -Syu --noconfirm --needed github-cli python

      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.PACKAGE_PR_TOKEN }}

      - name: Regenerate packages and open a pull request
        env:
          BRANCH: build/aur-v${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ secrets.PACKAGE_PR_TOKEN }}
          MODE: ${{ inputs.mode }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          args=()
          if [[ "$MODE" == stable ]]; then
            args+=(--stable "$VERSION")
          fi

          candidate=$(python3 -c 'import sys; from scripts.update_aur import package_version; print(package_version(sys.argv[1]))' "$VERSION")
          current=$(grep -m1 '^pkgver=' packaging/aur/strata-rc-bin/PKGBUILD | cut -d= -f2)
          if (( $(vercmp "$candidate" "$current") >= 0 )); then
            args+=(--preview "$VERSION")
          fi

          if (( ${#args[@]} == 0 )); then
            echo "v$VERSION is older than the packaged Preview release."
            exit 0
          fi
          python3 scripts/update_aur.py "${args[@]}"

          if git diff --quiet -- packaging/aur; then
            echo "AUR packages already describe v$VERSION."
            exit 0
          fi

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add packaging/aur
          git commit -m "build(arch): update AUR packages for v$VERSION"
          if remote_sha=$(git ls-remote --exit-code --heads origin "$BRANCH" | cut -f1); then
            git push --force-with-lease="$BRANCH:$remote_sha" origin "HEAD:$BRANCH"
          else
            git push origin "HEAD:$BRANCH"
          fi

          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            exit 0
          fi
          cat > /tmp/aur-package-pr.md <<EOF
          ## Description

          Updates the reviewed AUR package sources for Strata v$VERSION.

          ## How to test

          Install either generated package and confirm its version is v$VERSION.

          ## Visual evidence

          N/A — generated package metadata only.
          EOF
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "build(arch): update AUR packages for v$VERSION" \
            --body-file /tmp/aur-package-pr.md
