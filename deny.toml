[graph]
all-features = true

[advisories]
# Remove once docx-rs releases on zip 9 (#2035).
ignore = [
  { id = "RUSTSEC-2026-0429", reason = "zip 8 only via docx-rs, which never calls extract" },
  { id = "RUSTSEC-2026-0367", reason = "zip 8 only via docx-rs, which never calls extract" },
  { id = "RUSTSEC-2026-0368", reason = "zip 8 only via docx-rs, which never calls extract" },
  { id = "RUSTSEC-2026-0369", reason = "zip 8 only via docx-rs, which never calls extract" },
  { id = "RUSTSEC-2026-0370", reason = "zbus 5 is required by ashpd 0.13" },
  { id = "RUSTSEC-2026-0371", reason = "zbus 5 is required by ashpd 0.13" },
  { id = "RUSTSEC-2026-0372", reason = "zbus 5 is required by ashpd 0.13" },
  { id = "RUSTSEC-2025-0141", reason = "bincode 1 is syntect's syntax dump format on the Rune side; unmaintained, no known vulnerability, and its authors call 1.3.3 complete" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "bzip2-1.0.6",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# tiny-skia dependency; its redistribution notice is in THIRD_PARTY_LICENSES.md.
[[licenses.exceptions]]
name = "arrayref"
allow = ["BSD-2-Clause"]

# RAW metadata dependencies; their redistribution notices are in THIRD_PARTY_LICENSES.md.
[[licenses.exceptions]]
name = "kamadak-exif"
allow = ["BSD-2-Clause"]

[[licenses.exceptions]]
name = "mutate_once"
allow = ["BSD-2-Clause"]

# Rune's clipboard dependency (arboard) names these for Windows only; no Linux build links them.
[[licenses.exceptions]]
name = "clipboard-win"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
name = "error-code"
allow = ["BSL-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"

# The crate layering. Each entry names the only crates that may depend directly on one:
# the interface toolkits stay in the application package, and a workspace crate is used
# only by the layers above it (core, then preview, then fs, then desktop). The Rune side
# (platform, kit, components, gallery) uses Rune and never the shared crates; the
# application reaches nothing on the Rune side. strata-app is the one crate that uses both,
# and only the strata-rune binary uses it (docs/workspace.md).
deny = [
  { crate = "gtk4", wrappers = ["sourceview5", "strata"] },
  { crate = "gdk4", wrappers = ["gdk4-wayland", "gdk4-x11", "gsk4", "gtk4", "sourceview5"] },
  { crate = "gdk4-wayland", wrappers = ["strata"] },
  { crate = "gdk4-x11", wrappers = ["strata"] },
  { crate = "sourceview5", wrappers = ["strata"] },
  { crate = "gstreamer", wrappers = ["gstreamer-app", "gstreamer-base", "strata"] },
  { crate = "gstreamer-app", wrappers = ["strata"] },
  { crate = "strata-core", wrappers = ["strata", "strata-app", "strata-desktop", "strata-fs", "strata-preview"] },
  { crate = "strata-preview", wrappers = ["strata", "strata-desktop", "strata-fs"] },
  { crate = "strata-fs", wrappers = ["strata", "strata-app", "strata-desktop"] },
  { crate = "strata-desktop", wrappers = ["strata", "strata-app"] },
  { crate = "strata-qa", wrappers = ["strata", "strata-app"] },
  { crate = "rune", wrappers = ["rune-kit", "strata-app", "strata-components", "strata-gallery", "strata-kit", "strata-platform"] },
  { crate = "rune-kit", wrappers = ["strata-app", "strata-components", "strata-gallery", "strata-kit"] },
  { crate = "strata-platform", wrappers = ["strata-app", "strata-gallery"] },
  { crate = "strata-kit", wrappers = ["strata-app", "strata-components", "strata-gallery"] },
  { crate = "strata-components", wrappers = ["strata-app", "strata-gallery"] },
  { crate = "strata-app", wrappers = ["strata-rune"] },
  { crate = "strata-test-peer", wrappers = ["strata-gallery", "strata-platform", "strata-rune"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Rune is pinned by git rev until it is on crates.io (docs/rune/plan.md §8).
allow-git = ["https://github.com/anomalyco/rune"]
